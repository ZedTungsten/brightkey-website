<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance & Leaves — Brightkey ERP</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2" />

  <style>
    /* ── Layout ── */
    .top-bar { flex-shrink: 0; background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .top-bar-title { font-size: 1rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.03em; }
    .content-area { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
    .main-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    .scroll-area { flex: 1; overflow: auto; padding: 2rem; display: flex; flex-direction: column; }
    .att-container { max-width: 1200px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }

    /* ── Tab Layout ── */
    .tabs-nav {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg-surface);
      padding: 0 1.5rem;
    }
    .tab-btn {
      padding: 0.9rem 1rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab-btn.active {
      color: var(--cyan-light);
      border-bottom-color: var(--cyan);
    }
    .tab-btn:hover:not(.active) {
      color: var(--text-secondary);
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* ── Month Selector ── */
    .month-selector {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .month-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
    }
    .month-btn:hover {
      border-color: var(--border-hover);
      background: var(--bg-elevated);
    }
    .month-title-display {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-primary);
      min-width: 150px;
      text-align: center;
    }

    /* ── Shift Badge ── */
    .shift-badge-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .shift-badge-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .shift-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--cyan-dim, rgba(6,182,212,0.1));
      color: var(--cyan-light, #22d3ee);
      border: 1px solid rgba(6,182,212,0.25);
      white-space: nowrap;
    }
    .shift-badge svg {
      flex-shrink: 0;
    }

    /* ── Week Block ── */
    .week-block {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .week-header {
      background: var(--bg-elevated);
      padding: 0.75rem 1.25rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .week-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .week-table th {
      padding: 0.6rem 1.25rem;
      text-align: left;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .week-table td {
      padding: 0.75rem 1.25rem;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .week-table tr:last-child td {
      border-bottom: none;
    }
    .week-table tr:hover td {
      background: var(--bg-elevated);
    }

    /* ── Credit Cards ── */
    .credits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .credit-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }
    .credit-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    }
    .credit-card.vl::before { background: var(--cyan, #0891B2); }
    .credit-card.sl::before { background: var(--blue, #2563EB); }
    
    .credit-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 0.25rem; }
    .credit-value { font-size: 1.85rem; font-weight: 800; color: var(--text-primary); }

    /* ── Forms ── */
    .form-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-sm);
    }
    .form-box-title {
      font-size: 0.95rem; font-weight: 800; color: var(--text-primary);
      margin-bottom: 1.25rem; letter-spacing: -0.02em;
      border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;
    }
    .form-grid-2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
    }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
    .form-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; }
    .form-input, .form-select, .form-textarea {
      background: #FFFFFF; border: 1px solid #D4D4D8;
      border-radius: var(--radius-sm); padding: 0.55rem 0.75rem; font-size: 0.88rem;
      color: #09090B; width: 100%; outline: none; transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--cyan, #0891B2); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-helper { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }

    /* ── Leave Cards ── */
    .leaves-section-title {
      font-size: 1.05rem; font-weight: 800; color: var(--text-primary);
      margin-bottom: 1rem; letter-spacing: -0.02em;
    }
    .leaves-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.25rem; margin-bottom: 2rem;
    }
    .leave-request-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 0.6rem;
      position: relative;
      transition: transform 0.2s;
    }
    .leave-request-card:hover {
      transform: translateY(-2px);
    }
    .leave-request-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    }
    .leave-request-card.pending::before { background: #a1a1aa; }
    .leave-request-card.approved::before { background: #22c55e; }
    .leave-request-card.rejected::before { background: #ef4444; }

    .leave-header { display: flex; align-items: center; justify-content: space-between; }
    .leave-badge {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      padding: 2px 6px; border-radius: 4px; letter-spacing: 0.05em;
    }
    .leave-badge.pending { background: #f4f4f5; color: #71717a; }
    .leave-badge.approved { background: rgba(34,197,94,0.1); color: #22c55e; }
    .leave-badge.rejected { background: rgba(239,68,68,0.1); color: #ef4444; }

    .leave-type-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    .leave-dates { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; }
    .leave-days { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); }
    .leave-reason { font-size: 0.82rem; color: var(--text-secondary); background: var(--bg-elevated); padding: 0.5rem; border-radius: var(--radius-sm); margin-top: 0.25rem; }
    .leave-reject-reason { font-size: 0.8rem; color: #ef4444; font-weight: 500; border-top: 1px dashed rgba(239,68,68,0.2); padding-top: 0.5rem; margin-top: 0.25rem; }

    /* ── Manager Approvals ── */
    .manager-section {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-sm);
    }
    .manager-table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    .manager-table th {
      padding: 0.75rem 1rem; text-align: left; font-size: 0.68rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
    }
    .manager-table td {
      padding: 0.75rem 1rem; color: var(--text-secondary);
      border-bottom: 1px solid var(--border); vertical-align: middle;
    }
    .manager-table tbody tr:hover td { background: var(--bg-surface); }
    .manager-action-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .manager-action-btn {
      width: 92px;
      padding: 0.55rem 0.75rem;
      color: #fff;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: background-color var(--transition), border-color var(--transition);
    }
    .manager-action-btn.approve {
      background: var(--success);
      border-color: var(--success);
    }
    .manager-action-btn.approve:hover {
      background: #059669;
      border-color: #059669;
    }
    .manager-action-btn.reject {
      background: var(--danger);
      border-color: var(--danger);
    }
    .manager-action-btn.reject:hover {
      background: #dc2626;
      border-color: #dc2626;
    }

    /* ── Modal overlay ── */
    .overlay-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center;
    }
    .overlay-modal.open { display: flex; }
    .modal-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); width: 450px; max-width: 90%;
      box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column;
    }
    .modal-header { padding: 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 1rem; font-weight: 800; color: var(--text-primary); }
    .modal-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    .modal-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--border); display: flex; gap: 0.75rem; justify-content: flex-end; }

    @media (max-width: 1024px) {
      .scroll-area { padding: 1.25rem; }
      .att-container { gap: 1.25rem; }
      .month-selector { margin-bottom: 1rem; }
      .week-block { margin-bottom: 1rem; }
      .week-header { padding: 0.65rem 1rem; }
      .week-table th,
      .week-table td { padding-inline: 1rem; }
      .credits-grid { gap: 1rem; margin-bottom: 1.25rem; }
      .credit-card { padding: 1rem 1.25rem; }
      .form-box,
      .manager-section { padding: 1.25rem; margin-bottom: 1.25rem; }
      .leaves-grid { gap: 1rem; margin-bottom: 1.25rem; }
    }

    @media (max-width: 600px) {
      .top-bar {
        height: 52px;
        padding-inline: 1rem;
      }
      .top-bar-title { font-size: 0.9rem; }
      #topbar-date { display: none; }
      .content-area {
        height: calc(100vh - 52px);
        height: calc(100dvh - 52px);
      }
      .tabs-nav {
        padding-inline: 1rem;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs-nav::-webkit-scrollbar { display: none; }
      .tab-btn {
        padding: 0.7rem 0.9rem;
        font-size: 0.75rem;
      }
      .scroll-area { padding: 0.75rem 0.75rem 5rem; }
      .att-container { gap: 0.75rem; }
      .month-selector {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) 32px;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .month-title-display {
        min-width: 0;
        font-size: 0.98rem;
      }
      .shift-badge-wrap {
        grid-column: 1 / -1;
        margin-left: 0;
        justify-content: center;
        min-width: 0;
      }
      .shift-badge {
        max-width: calc(100% - 3.5rem);
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0.25rem 0.6rem;
        font-size: 0.7rem;
      }
      .week-block {
        border-radius: var(--radius-sm);
        margin-bottom: 0.75rem;
      }
      .week-header {
        padding: 0.55rem 0.75rem;
        font-size: 0.7rem;
      }
      .week-table {
        table-layout: fixed;
        font-size: 0.75rem;
      }
      .week-table th {
        padding: 0.45rem 0.3rem;
        font-size: 0.55rem;
        letter-spacing: 0.04em;
        text-align: center;
        overflow-wrap: anywhere;
      }
      .week-table td {
        padding: 0.55rem 0.3rem;
        text-align: center;
        overflow-wrap: anywhere;
      }
      .week-table th:first-child,
      .week-table td:first-child {
        width: 24%;
        padding-left: 0.65rem;
        text-align: left;
      }
      .credits-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.6rem;
        margin-bottom: 0.75rem;
      }
      .credit-card {
        border-radius: var(--radius-sm);
        padding: 0.85rem;
      }
      .credit-label {
        font-size: 0.6rem;
        line-height: 1.35;
      }
      .credit-value { font-size: 1.4rem; }
      .form-box,
      .manager-section {
        border-radius: var(--radius-sm);
        padding: 0.9rem;
        margin-bottom: 0.75rem;
      }
      .form-box-title {
        margin-bottom: 0.85rem;
        font-size: 0.88rem;
      }
      .form-grid-2 { gap: 0.65rem; }
      .form-group { gap: 0.25rem; margin-bottom: 0.7rem; }
      .form-label { font-size: 0.65rem; }
      .form-input,
      .form-select,
      .form-textarea {
        min-height: 40px;
        padding: 0.55rem 0.65rem;
        font-size: 0.8rem;
      }
      .form-textarea { min-height: 70px; }
      .form-helper { font-size: 0.68rem; }
      .leaves-section-title {
        margin-bottom: 0.65rem;
        font-size: 0.92rem;
      }
      .leaves-grid {
        grid-template-columns: 1fr;
        gap: 0.65rem;
        margin-bottom: 0.75rem;
      }
      .leave-request-card {
        border-radius: var(--radius-sm);
        padding: 0.9rem;
        gap: 0.45rem;
      }
      .manager-section > div[style*="overflow-x"] {
        overscroll-behavior: contain;
      }
      .manager-table { min-width: 680px; font-size: 0.78rem; }
      .manager-table th,
      .manager-table td { padding: 0.6rem 0.75rem; }
      .overlay-modal {
        height: 100vh;
        height: 100dvh;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      .modal-card {
        width: 100%;
        max-width: 100%;
        max-height: calc(100dvh - 1rem);
        overflow-y: auto;
      }
      .modal-header,
      .modal-body,
      .modal-footer { padding: 0.9rem 1rem; }
    }
  </style>
</head>
<body>

  <div class="dash-layout">
    <!-- Sidebar -->
    <aside class="dash-sidebar" id="dash-sidebar"></aside>

    <!-- Main -->
    <div class="dash-main">
      <!-- Top Bar -->
      <div class="top-bar">
        <span class="top-bar-title">Attendance & Leaves</span>
        <div style="flex:1;"></div>
        <span id="topbar-date" style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary);"></span>
      </div>

      <div class="content-area">
        <main class="main-panel">
          <!-- Tabs Navigation -->
          <div class="tabs-nav">
            <button class="tab-btn active" id="tab-btn-logs" onclick="AttendanceApp.switchTab('logs')">Logs</button>
            <button class="tab-btn" id="tab-btn-leaves" onclick="AttendanceApp.switchTab('leaves')">Leaves</button>
            <button class="tab-btn" id="tab-btn-requests" hidden onclick="AttendanceApp.switchTab('requests')">Requests</button>
          </div>

          <div class="scroll-area">
            <div class="att-container">

              <!-- ── Logs Tab Content ── -->
              <div class="tab-content active" id="tab-content-logs">
                <!-- Month Selector -->
                <div class="month-selector">
                  <button class="month-btn" onclick="AttendanceApp.changeMonth(-1)">&lt;</button>
                  <span class="month-title-display" id="month-display">Loading…</span>
                  <button class="month-btn" onclick="AttendanceApp.changeMonth(1)">&gt;</button>
                  <!-- Shift Badge -->
                  <div class="shift-badge-wrap" id="shift-badge-wrap" style="display:none;">
                    <span class="shift-badge-label">Shift</span>
                    <span class="shift-badge" id="shift-badge-text">
                      <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                      <span id="shift-badge-inner">—</span>
                    </span>
                  </div>
                </div>

                <!-- Dynamic Week Lists -->
                <div id="logs-container">
                  <div style="text-align:center; padding:3rem; color:var(--text-muted);">Loading logs…</div>
                </div>
              </div>

              <!-- ── Leaves Tab Content ── -->
              <div class="tab-content" id="tab-content-leaves">
                <!-- Credit Load Counters -->
                <div class="credits-grid">
                  <div class="credit-card vl">
                    <div class="credit-label">Vacation Leave Balance</div>
                    <div class="credit-value" id="vl-balance">0.0</div>
                  </div>
                  <div class="credit-card sl">
                    <div class="credit-label">Sick Leave Balance</div>
                    <div class="credit-value" id="sl-balance">0.0</div>
                  </div>
                </div>

                <!-- Leaves Forms Block -->
                <div class="form-box">
                  <div class="form-box-title">File Leave Request</div>
                  
                  <div class="form-group">
                    <label class="form-label" for="leave-type-select">Leave Type</label>
                    <select id="leave-type-select" class="form-select" onchange="AttendanceApp.onLeaveTypeChange()">
                      <option value="vacation">Vacation Leave (VL)</option>
                      <option value="sick">Sick Leave (SL)</option>
                    </select>
                  </div>

                  <!-- Vacation Leave Inputs -->
                  <div id="vl-inputs-container">
                    <div class="form-grid-2">
                      <div class="form-group">
                        <label class="form-label" for="vl-from">Date From</label>
                        <input type="date" id="vl-from" class="form-input" onchange="AttendanceApp.calculateVLDays()" />
                        <div class="form-helper">Tomorrow onwards only</div>
                      </div>
                      <div class="form-group">
                        <label class="form-label" for="vl-to">Date To</label>
                        <input type="date" id="vl-to" class="form-input" onchange="AttendanceApp.calculateVLDays()" />
                      </div>
                    </div>
                    <div class="form-group">
                      <label class="form-label">Days Requested</label>
                      <input type="text" id="vl-days-display" class="form-input" readonly value="0 days" style="background:var(--bg-elevated);" />
                    </div>
                  </div>

                  <!-- Sick Leave Inputs -->
                  <div id="sl-inputs-container" style="display: none;">
                    <div class="form-grid-2">
                      <div class="form-group">
                        <label class="form-label" for="sl-from" id="sl-from-label">Date</label>
                        <input type="date" id="sl-from" class="form-input" onchange="AttendanceApp.onSickLeaveDateChange()" />
                        <div class="form-helper" id="sl-shift-helper"></div>
                      </div>
                      <div class="form-group" id="sl-to-wrap" style="display: none;">
                        <label class="form-label" for="sl-to">Date To</label>
                        <input type="date" id="sl-to" class="form-input" onchange="AttendanceApp.calculateSLDays()" />
                      </div>
                    </div>
                    <div class="form-group" id="sl-days-wrap" style="display: none;">
                      <label class="form-label">Days Requested</label>
                      <input type="text" id="sl-days-display" class="form-input" readonly value="1 day" style="background:var(--bg-elevated);" />
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="form-label" for="leave-reason">Reason</label>
                    <textarea id="leave-reason" class="form-textarea" placeholder="Provide reason details here…"></textarea>
                  </div>

                  <button class="btn btn-cyan btn-sm" id="btn-submit-leave" onclick="AttendanceApp.submitLeaveRequest()">Request</button>
                </div>

                <!-- My Submitted Requests Cards -->
                <div class="leaves-section-title">My Leave Requests</div>
                <div class="leaves-grid" id="my-requests-container">
                  <div style="grid-column: 1/-1; text-align:center; padding: 2rem; color:var(--text-muted);">No requests submitted yet.</div>
                </div>

              </div>

              <!-- ── Manager Requests Tab Content ── -->
              <div class="tab-content" id="tab-content-requests">
                <div class="manager-section" id="manager-approvals-section">
                  <div class="leaves-section-title">Direct Report Leave Requests</div>
                  <div style="overflow-x: auto;">
                    <table class="manager-table">
                      <thead>
                        <tr>
                          <th>Employee</th>
                          <th>Type</th>
                          <th>Dates</th>
                          <th>Days</th>
                          <th>Reason</th>
                          <th style="width: 220px; text-align: center;">Actions</th>
                        </tr>
                      </thead>
                      <tbody id="manager-approvals-tbody">
                        <tr><td colspan="6" style="text-align:center; padding: 2rem; color:var(--text-muted);">Loading requests…</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- Rejection Reason Dialog Modal -->
  <div class="overlay-modal" id="reject-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Reject Leave Request</div>
        <button class="btn-minimal" onclick="AttendanceApp.closeRejectModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="reject-request-id" />
        <div class="form-group">
          <label class="form-label" for="reject-reason-input">Rejection Reason</label>
          <textarea id="reject-reason-input" class="form-textarea" placeholder="State reason why this leave is rejected…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost btn-sm" onclick="AttendanceApp.closeRejectModal()">Cancel</button>
        <button class="btn btn-danger-fill btn-sm" onclick="AttendanceApp.confirmReject()">Reject Request</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/main.js"></script>
  <script>
    'use strict';

    function showToast(message, isError = false) {
      if (window.Toast) {
        window.Toast.show(message, isError ? 'error' : 'success');
      } else {
        console.log((isError ? 'ERROR: ' : 'INFO: ') + message);
      }
    }

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const AttendanceApp = {
      currentUser: null,
      companyId: null,
      employee: null,
      managerScope: null,
      leaveRestrictions: {
        sl_shift_cutoff_enabled: true,
        sl_shift_cutoff_hours: 1,
        sl_advance_filing_enabled: true,
        sl_advance_days: 1,
        sl_single_day_only: true
      },
      selectedTab: 'logs',
      leavesLoaded: false,
      
      // Date Month Selector State
      selectedYear: new Date().getFullYear(),
      selectedMonth: new Date().getMonth(), // 0-11
      
      MONTH_NAMES: [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ],

      async init() {
        if (!window.BKAuth) return;
        
        // Accessible by all authenticated company members/employees
        const user = await window.BKAuth.requireAuth('../admin.html');
        if (!user) return;
        
        const roleInfo = await window.BKAuth.getUserRole();
        if (!roleInfo) {
          window.location.href = '../admin.html';
          return;
        }

        this.currentUser = user;
        this.companyId = await this.getCompanyId(roleInfo.tenantId);
        
        if (this.companyId) {
          await this.loadEmployeeProfile();
          await this.loadLeaveRestrictions();
          await this.configureManagerRequestsAccess();
        }

        this.configureSickLeaveForm();

        // Default tomorrow constraints for VL Date inputs
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const tomorrowStr = tomorrow.toISOString().split('T')[0];
        document.getElementById('vl-from').min = tomorrowStr;
        document.getElementById('vl-to').min = tomorrowStr;

        await this.loadLogs();
      },

      async getCompanyId(tenantId) {
        try {
          const sb = window.BKAuth.sb;
          const { data } = await sb.from('companies').select('id').eq('tenant_id', tenantId).limit(1).maybeSingle();
          return data?.id || null;
        } catch (err) {
          console.error(err);
          return null;
        }
      },

      async loadEmployeeProfile() {
        try {
          const sb = window.BKAuth.sb;
          const { data } = await sb.from('employees')
            .select('id, company_id, first_name, last_name, email, shift_time_1, employment_status, vl_load, sl_load')
            .eq('company_id', this.companyId)
            .eq('email', this.currentUser.email)
            .limit(1)
            .maybeSingle();
          this.employee = data || null;
        } catch (err) {
          console.error(err);
        }
      },

      async loadLeaveRestrictions() {
        if (!this.companyId) return;
        try {
          const sb = window.BKAuth.sb;
          const { data, error } = await sb.from('global_settings')
            .select('value')
            .eq('company_id', this.companyId)
            .eq('key', 'leaves_settings')
            .maybeSingle();
          if (error) throw error;

          const settings = data?.value || {};
          this.leaveRestrictions = {
            sl_shift_cutoff_enabled: settings.sl_shift_cutoff_enabled !== false,
            sl_shift_cutoff_hours: Math.max(0, Number(settings.sl_shift_cutoff_hours ?? 1)),
            sl_advance_filing_enabled: settings.sl_advance_filing_enabled !== false,
            sl_advance_days: Math.max(0, parseInt(settings.sl_advance_days ?? 1, 10)),
            sl_single_day_only: settings.sl_single_day_only !== false
          };
        } catch (err) {
          console.error('Failed to load Sick Leave restrictions:', err);
        }
      },

      formatLocalDateInput(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      },

      configureSickLeaveForm() {
        const fromInput = document.getElementById('sl-from');
        const toInput = document.getElementById('sl-to');
        if (!fromInput || !toInput) return;

        const today = new Date();
        const todayStr = this.formatLocalDateInput(today);
        fromInput.min = todayStr;
        fromInput.value = todayStr;

        if (this.leaveRestrictions.sl_advance_filing_enabled) {
          const latestStart = new Date(today);
          latestStart.setDate(latestStart.getDate() + this.leaveRestrictions.sl_advance_days);
          fromInput.max = this.formatLocalDateInput(latestStart);
        } else {
          fromInput.removeAttribute('max');
        }

        const singleDayOnly = this.leaveRestrictions.sl_single_day_only;
        document.getElementById('sl-from-label').textContent = singleDayOnly ? 'Date' : 'Date From';
        document.getElementById('sl-to-wrap').style.display = singleDayOnly ? 'none' : 'block';
        document.getElementById('sl-days-wrap').style.display = singleDayOnly ? 'none' : 'block';
        toInput.min = todayStr;
        toInput.value = todayStr;

        this.onSickLeaveDateChange();
      },

      onSickLeaveDateChange() {
        const fromInput = document.getElementById('sl-from');
        const toInput = document.getElementById('sl-to');
        if (!fromInput || !toInput) return;

        if (this.leaveRestrictions.sl_single_day_only) {
          toInput.value = fromInput.value;
        } else {
          toInput.min = fromInput.value || this.formatLocalDateInput(new Date());
          if (!toInput.value || toInput.value < fromInput.value) {
            toInput.value = fromInput.value;
          }
          this.calculateSLDays();
        }
        this.validateSickLeaveTiming();
      },

      calculateSLDays() {
        const fromVal = document.getElementById('sl-from').value;
        const toVal = document.getElementById('sl-to').value;
        const display = document.getElementById('sl-days-display');
        if (!display) return;

        if (!fromVal || !toVal) {
          display.value = '0 days';
          return;
        }

        const d1 = new Date(fromVal + 'T00:00:00');
        const d2 = new Date(toVal + 'T00:00:00');
        if (d2 < d1) {
          display.value = 'Invalid range';
          return;
        }

        const diffDays = Math.round((d2 - d1) / 86400000) + 1;
        display.value = `${diffDays} day${diffDays === 1 ? '' : 's'}`;
      },

      switchTab(tab) {
        if (tab === 'requests' && document.getElementById('tab-btn-requests')?.hidden) return;

        this.selectedTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        document.getElementById(`tab-btn-${tab}`).classList.add('active');
        document.getElementById(`tab-content-${tab}`).classList.add('active');
        if (tab === 'leaves' && !this.leavesLoaded) {
          this.loadLeavesData();
        } else if (tab === 'requests') {
          this.loadManagerApprovals();
        }
      },

      async configureManagerRequestsAccess() {
        const requestsTab = document.getElementById('tab-btn-requests');
        if (!requestsTab || !this.employee || !this.companyId) return;

        try {
          const { reports, isStructureManager } = await this.getManagerScope();
          requestsTab.hidden = !(isStructureManager || reports.length > 0);
        } catch (err) {
          console.error('Could not resolve manager request access:', err);
          requestsTab.hidden = true;
        }
      },

      async getManagerScope() {
        if (this.managerScope) return this.managerScope;

        const sb = window.BKAuth.sb;
        const [employeesResult, structureResult] = await Promise.all([
          sb.from('employees')
            .select('id, first_name, last_name, reporting_to')
            .eq('company_id', this.companyId)
            .order('first_name', { ascending: true })
            .limit(500),
          sb.from('global_settings')
            .select('value')
            .eq('company_id', this.companyId)
            .eq('key', 'company_structure')
            .maybeSingle()
        ]);
        if (employeesResult.error) throw employeesResult.error;
        if (structureResult.error) throw structureResult.error;

        const structure = structureResult.data?.value || { departments: [] };
        const reports = (employeesResult.data || []).filter(report =>
          report.id !== this.employee.id
          && this.resolveLeaveManagerId(report, structure) === this.employee.id
        );
        const isStructureManager = (structure.departments || []).some(department =>
          department?.managerId === this.employee.id
          || (department?.subteams || []).some(team => team?.managerId === this.employee.id)
        );

        this.managerScope = { reports, isStructureManager };
        return this.managerScope;
      },

      changeMonth(dir) {
        this.selectedMonth += dir;
        if (this.selectedMonth < 0) {
          this.selectedMonth = 11;
          this.selectedYear--;
        } else if (this.selectedMonth > 11) {
          this.selectedMonth = 0;
          this.selectedYear++;
        }
        this.loadLogs();
      },

      async loadLogs() {
        const container = document.getElementById('logs-container');
        document.getElementById('month-display').textContent = `${this.MONTH_NAMES[this.selectedMonth]} ${this.selectedYear}`;
        
        container.innerHTML = '<div style="text-align:center; padding:3rem; color:var(--text-muted);"><div class="bk-spinner" style="margin: 0 auto 1rem;"></div>Loading shift logs…</div>';

        let logs = [];
        if (this.employee) {
          try {
            const sb = window.BKAuth.sb;
            const startOfMonth = new Date(this.selectedYear, this.selectedMonth, 1).toISOString();
            const endOfMonth = new Date(this.selectedYear, this.selectedMonth + 1, 1).toISOString();

            const { data, error } = await sb.from('attendance_logs')
              .select('created_at, status')
              .eq('company_id', this.companyId)
              .eq('employee_id', this.employee.id)
              .gte('created_at', startOfMonth)
              .lt('created_at', endOfMonth)
              .order('created_at', { ascending: true });

            if (error) throw error;
            logs = data || [];
          } catch (err) {
            console.error(err);
          }
        }

        try {
          // Parse and group by Date
          const dayGroups = {};
          logs.forEach(log => {
            const dateStr = new Date(log.created_at).toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
            if (!dayGroups[dateStr]) {
              dayGroups[dateStr] = [];
            }
            dayGroups[dateStr].push(log);
          });

          // Reconstruct Date rows
          const listRows = [];
          
          // Determine the range of days to display
          const now = new Date();
          let maxDay = new Date(this.selectedYear, this.selectedMonth + 1, 0).getDate();
          if (this.selectedYear === now.getFullYear() && this.selectedMonth === now.getMonth()) {
            maxDay = now.getDate();
          } else if (this.selectedYear > now.getFullYear() || (this.selectedYear === now.getFullYear() && this.selectedMonth > now.getMonth())) {
            // Future months: don't show any rows
            maxDay = 0;
          }

          // Parse shifts
          const parseTimeStr = (str) => {
            if (!str) return null;
            const match = str.match(/(\d+):(\d+)\s*(AM|PM)/i);
            if (match) {
              let h = parseInt(match[1], 10);
              const m = parseInt(match[2], 10);
              const ampm = match[3].toUpperCase();
              if (ampm === 'PM' && h < 12) h += 12;
              if (ampm === 'AM' && h === 12) h = 0;
              return { hour: h, minute: m };
            }
            return null;
          };

          let shift1Start = { hour: 9, minute: 0 };
          let shift1End = { hour: 18, minute: 0 };

          if (this.employee) {
            if (this.employee.shift_time_1) {
              const parts = this.employee.shift_time_1.split('-');
              if (parts.length === 2) {
                const start = parseTimeStr(parts[0]);
                const end = parseTimeStr(parts[1]);
                if (start) shift1Start = start;
                if (end) shift1End = end;
              } else {
                const start = parseTimeStr(this.employee.shift_time_1);
                if (start) shift1Start = start;
              }
            }
          }

          const getLateRemark = (checkInTime, shiftStart) => {
            if (!checkInTime || !shiftStart) return '';
            const targetStart = new Date(checkInTime);
            targetStart.setHours(shiftStart.hour, shiftStart.minute, 0, 0);

            if (checkInTime > targetStart) {
              const diffMs = checkInTime - targetStart;
              const diffMins = Math.floor(diffMs / 60000);
              if (diffMins > 0) {
                const hrs = Math.floor(diffMins / 60);
                const mins = diffMins % 60;
                return (hrs > 0 ? (mins > 0 ? `${hrs} hr ${mins} min` : `${hrs} hr`) : `${mins} min`) + ' late';
              }
            } else if (checkInTime < targetStart) {
              const diffMs = targetStart - checkInTime;
              const diffMins = Math.floor(diffMs / 60000);
              if (diffMins > 0) {
                const hrs = Math.floor(diffMins / 60);
                const mins = diffMins % 60;
                return (hrs > 0 ? (mins > 0 ? `${hrs} hr ${mins} min` : `${hrs} hr`) : `${mins} min`) + ' early';
              }
            }
            return '';
          };

          const getEarlyOutRemark = (checkOutTime, shiftEnd) => {
            if (!checkOutTime || !shiftEnd) return '';
            const targetEnd = new Date(checkOutTime);
            targetEnd.setHours(shiftEnd.hour, shiftEnd.minute, 0, 0);

            if (checkOutTime < targetEnd) {
              const diffMs = targetEnd - checkOutTime;
              const diffMins = Math.floor(diffMs / 60000);
              if (diffMins > 0) {
                const hrs = Math.floor(diffMins / 60);
                const mins = diffMins % 60;
                return (hrs > 0 ? (mins > 0 ? `${hrs} hr ${mins} min` : `${hrs} hr`) : `${mins} min`) + ' early';
              }
            } else if (checkOutTime > targetEnd) {
              const diffMs = checkOutTime - targetEnd;
              const diffMins = Math.floor(diffMs / 60000);
              if (diffMins > 0) {
                const hrs = Math.floor(diffMins / 60);
                const mins = diffMins % 60;
                return (hrs > 0 ? (mins > 0 ? `${hrs} hr ${mins} min` : `${hrs} hr`) : `${mins} min`) + ' late';
              }
            }
            return '';
          };

          const formatRemarkHtml = (remark, type) => {
            if (!remark) return '';
            let color = 'var(--text-secondary)';
            if (type === 'in') {
              color = remark.includes('late') ? 'var(--warning)' : (remark.includes('early') ? 'var(--cyan)' : 'var(--text-secondary)');
            } else {
              color = remark.includes('early') ? 'var(--danger)' : (remark.includes('late') ? 'var(--cyan)' : 'var(--text-secondary)');
            }
            return `<span style="font-size: 0.72rem; margin-top: 0.25rem; font-weight: 600; display: block; color: ${color};">${remark}</span>`;
          };

          // ── Render shift badge ──
          const shiftBadgeWrap = document.getElementById('shift-badge-wrap');
          const shiftBadgeInner = document.getElementById('shift-badge-inner');
          if (shiftBadgeWrap && shiftBadgeInner) {
            if (this.employee && (this.employee.shift_time_1 || this.employee.shift_days)) {
              // Format time from parsed hours
              const fmtH = (h, m) => {
                const ampm = h >= 12 ? 'PM' : 'AM';
                const h12 = h === 0 ? 12 : (h > 12 ? h - 12 : h);
                return m > 0 ? `${h12}:${String(m).padStart(2,'0')} ${ampm}` : `${h12} ${ampm}`;
              };

              // Format shift days (e.g. "Mon,Tue,Wed,Thu,Fri" → "Mon – Fri")
              let daysStr = '';
              if (this.employee.shift_days) {
                const dayMap = {
                  'M': 'Mon', 'Mo': 'Mon', 'Mon': 'Mon',
                  'T': 'Tue', 'Tu': 'Tue', 'Tue': 'Tue',
                  'W': 'Wed', 'We': 'Wed', 'Wed': 'Wed',
                  'Th': 'Thu', 'Thu': 'Thu',
                  'F': 'Fri', 'Fr': 'Fri', 'Fri': 'Fri',
                  'S': 'Sat', 'Sa': 'Sat', 'Sat': 'Sat',
                  'Su': 'Sun', 'Sun': 'Sun'
                };
                const mappedDays = this.employee.shift_days.split(',').map(d => {
                  const trimmed = d.trim();
                  return dayMap[trimmed] || trimmed;
                });
                // Condense consecutive ranges (e.g. Mon,Tue,Wed,Thu,Fri → Mon – Fri)
                if (mappedDays.length > 1) {
                  daysStr = `${mappedDays[0]} – ${mappedDays[mappedDays.length - 1]}`;
                } else if (mappedDays.length === 1) {
                  daysStr = mappedDays[0];
                }
              }

              const timeStr = `${fmtH(shift1Start.hour, shift1Start.minute)} – ${fmtH(shift1End.hour, shift1End.minute)}`;
              shiftBadgeInner.textContent = daysStr ? `${daysStr}  ${timeStr}` : timeStr;
              shiftBadgeWrap.style.display = 'flex';
            } else {
              shiftBadgeWrap.style.display = 'none';
            }
          }

          const weeks = [];
          let currentWeekDays = [];
          let currentWeekNum = 1;

          for (let d = 1; d <= maxDay; d++) {
            const currentDateObj = new Date(this.selectedYear, this.selectedMonth, d);
            
            // A new week starts on Sunday (getDay() === 0).
            // If it's Sunday and we are past the first day of the month,
            // we push the current week and start a new one.
            if (currentDateObj.getDay() === 0 && d > 1) {
              weeks.push({ weekNum: currentWeekNum, days: currentWeekDays });
              currentWeekDays = [];
              currentWeekNum++;
            }

            const dateStr = currentDateObj.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const dayLogs = dayGroups[dateStr] || [];

            // Sort logs of the day chronologically
            const sortedLogs = dayLogs.slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const inLog = sortedLogs.find(log => log.status === 'available') || null;
            const outLog = inLog
              ? sortedLogs.find(log => log.status === 'offline' && new Date(log.created_at) >= new Date(inLog.created_at)) || null
              : null;
            const session = (inLog || outLog) ? { inLog, outLog } : null;
            let timeInText = '—';
            let timeInRemark = '';
            
            let timeOutText = '—';
            let timeOutRemark = '';

            if (session) {
              if (session.inLog) {
                const t = new Date(session.inLog.created_at);
                timeInText = t.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                timeInRemark = getLateRemark(t, shift1Start);
              }
              if (session.outLog) {
                const t = new Date(session.outLog.created_at);
                timeOutText = t.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                timeOutRemark = getEarlyOutRemark(t, shift1End);
              } else if (session.inLog) {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                if (currentDateObj < today) {
                  timeOutText = '<span style="color: var(--danger, #ef4444); font-weight: 600;">Forced Time-out</span>';
                }
              }
            }

            let totalHoursHtml = '—';
            if (session && session.inLog && session.outLog) {
              const checkInTime = new Date(session.inLog.created_at);
              const checkOutTime = new Date(session.outLog.created_at);
              if (checkOutTime >= checkInTime) {
                const diffMs = checkOutTime - checkInTime;
                const totalMins = Math.floor(diffMs / 60000);
                const h = Math.floor(totalMins / 60);
                const m = totalMins % 60;
                totalHoursHtml = `<span style="font-weight:600; color:var(--text-primary);">${h}h ${m}m</span>`;
              }
            }

            currentWeekDays.push({
              dayNum: d,
              dateFriendly: currentDateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
              
              timeInText,
              timeInRemark,
              timeOutText,
              timeOutRemark,

              totalHoursHtml
            });
          }

          if (currentWeekDays.length > 0) {
            weeks.push({ weekNum: currentWeekNum, days: currentWeekDays });
          }

          // Filter out weeks with no logged days
          const filteredWeeks = weeks.filter(w => w.days.length > 0);

          // Reverse weeks to show the latest week first
          filteredWeeks.reverse();

          const totalDays = filteredWeeks.reduce((sum, w) => sum + w.days.length, 0);
          if (totalDays === 0) {
            container.innerHTML = '<div style="text-align:center; padding:3rem; color:var(--text-muted);">No logs recorded for this month.</div>';
            return;
          }

          container.innerHTML = '';
          filteredWeeks.forEach(w => {
            const weekHtml = `
              <div class="week-block">
                <div class="week-header">Week ${w.weekNum}</div>
                <table class="week-table">
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Time In</th>
                      <th>Time Out</th>
                      <th>Total Hours</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${w.days.slice().reverse().map(r => `
                      <tr>
                        <td><strong>${r.dateFriendly}</strong></td>
                        
                        <!-- Time In -->
                        <td>
                          <span style="font-weight:600; color:var(--text-primary);">${r.timeInText}</span>
                          ${formatRemarkHtml(r.timeInRemark, 'in')}
                        </td>

                        <!-- Time Out -->
                        <td>
                          <span style="font-weight:600; color:var(--text-primary);">${r.timeOutText}</span>
                          ${formatRemarkHtml(r.timeOutRemark, 'out')}
                        </td>

                        <!-- Total Hours -->
                        <td>${r.totalHoursHtml}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `;
            container.insertAdjacentHTML('beforeend', weekHtml);
          });

        } catch (err) {
          console.error(err);
          container.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--danger);">Failed to load logs: ${err.message}</div>`;
        }
      },

      onLeaveTypeChange() {
        const type = document.getElementById('leave-type-select').value;
        const vlBox = document.getElementById('vl-inputs-container');
        const slBox = document.getElementById('sl-inputs-container');
        
        if (type === 'vacation') {
          vlBox.style.display = 'block';
          slBox.style.display = 'none';
          document.getElementById('btn-submit-leave').disabled = false;
        } else {
          vlBox.style.display = 'none';
          slBox.style.display = 'block';
          this.validateSickLeaveTiming();
        }
      },

      calculateVLDays() {
        const fromVal = document.getElementById('vl-from').value;
        const toVal = document.getElementById('vl-to').value;
        const display = document.getElementById('vl-days-display');

        if (!fromVal || !toVal) {
          display.value = '0 days';
          return;
        }

        const d1 = new Date(fromVal + 'T00:00:00');
        const d2 = new Date(toVal + 'T00:00:00');

        if (d2 < d1) {
          display.value = 'Invalid range';
          return;
        }

        const diffTime = Math.abs(d2 - d1);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; // inclusive
        display.value = `${diffDays} day${diffDays > 1 ? 's' : ''}`;
      },

      validateSickLeaveTiming() {
        if (!this.employee) return true;
        const btn = document.getElementById('btn-submit-leave');
        const helper = document.getElementById('sl-shift-helper');
        const selectedType = document.getElementById('leave-type-select')?.value;
        if (selectedType !== 'sick') {
          btn.disabled = false;
          return true;
        }
        const selectedDate = document.getElementById('sl-from')?.value;
        const todayStr = this.formatLocalDateInput(new Date());

        if (!selectedDate) {
          btn.disabled = true;
          helper.textContent = 'Select a Sick Leave date.';
          helper.style.color = 'var(--danger)';
          return false;
        }

        if (selectedDate < todayStr) {
          btn.disabled = true;
          helper.textContent = 'Sick Leave cannot be filed for a past date.';
          helper.style.color = 'var(--danger)';
          return false;
        }

        if (this.leaveRestrictions.sl_advance_filing_enabled) {
          const latestStart = new Date();
          latestStart.setDate(latestStart.getDate() + this.leaveRestrictions.sl_advance_days);
          if (selectedDate > this.formatLocalDateInput(latestStart)) {
            btn.disabled = true;
            helper.textContent = `Sick Leave can only be filed up to ${this.leaveRestrictions.sl_advance_days} day(s) in advance.`;
            helper.style.color = 'var(--danger)';
            return false;
          }
        }

        if (selectedDate > todayStr || !this.leaveRestrictions.sl_shift_cutoff_enabled) {
          btn.disabled = false;
          if (!this.leaveRestrictions.sl_shift_cutoff_enabled && selectedDate === todayStr) {
            helper.textContent = 'The before-shift filing restriction is disabled.';
          } else {
            helper.textContent = this.leaveRestrictions.sl_advance_filing_enabled
              ? `You may file up to ${this.leaveRestrictions.sl_advance_days} day(s) in advance.`
              : 'Future Sick Leave filing is allowed.';
          }
          helper.style.color = 'var(--text-muted)';
          return true;
        }
        
        // Default shift is 09:00 AM
        let shiftStartHour = 9;
        let shiftStartMin = 0;

        if (this.employee.shift_time_1) {
          const match = this.employee.shift_time_1.match(/(\d+):(\d+)\s*(AM|PM)/i);
          if (match) {
            let h = parseInt(match[1], 10);
            const m = parseInt(match[2], 10);
            const ampm = match[3].toUpperCase();
            if (ampm === 'PM' && h < 12) h += 12;
            if (ampm === 'AM' && h === 12) h = 0;
            shiftStartHour = h;
            shiftStartMin = m;
          }
        }

        const shiftStartToday = new Date();
        shiftStartToday.setHours(shiftStartHour, shiftStartMin, 0, 0);

        const now = new Date();
        const cutoff = new Date(shiftStartToday);
        cutoff.setMinutes(cutoff.getMinutes() - (this.leaveRestrictions.sl_shift_cutoff_hours * 60));

        if (now >= cutoff) {
          btn.disabled = true;
          helper.textContent = `Shift starts at ${this.employee.shift_time_1 || '09:00 AM'}. Filing closed (less than ${this.leaveRestrictions.sl_shift_cutoff_hours} hour(s) before shift start).`;
          helper.style.color = 'var(--danger)';
          return false;
        } else {
          btn.disabled = false;
          helper.textContent = `Shift starts at ${this.employee.shift_time_1 || '09:00 AM'}. File at least ${this.leaveRestrictions.sl_shift_cutoff_hours} hour(s) before the shift.`;
          helper.style.color = 'var(--text-muted)';
          return true;
        }
      },

      async loadLeavesData() {
        if (!this.employee) return;

        // Balance Counters
        document.getElementById('vl-balance').textContent = Number(this.employee.vl_load || 0).toFixed(1);
        document.getElementById('sl-balance').textContent = Number(this.employee.sl_load || 0).toFixed(1);

        await this.loadMyRequests();
        this.leavesLoaded = true;
      },

      async loadMyRequests() {
        const container = document.getElementById('my-requests-container');
        container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 2rem; color:var(--text-muted);"><div class="bk-spinner" style="margin:0 auto 1rem;"></div>Loading requests…</div>';

        try {
          const sb = window.BKAuth.sb;
          const { data, error } = await sb.from('leave_requests')
            .select('id, employee_id, leave_type, date_from, date_to, number_of_days, reason, status, rejected_reason, created_at')
            .eq('company_id', this.companyId)
            .eq('employee_id', this.employee.id)
            .order('created_at', { ascending: false })
            .limit(100);

          if (error) throw error;

          if (!data || data.length === 0) {
            container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 2rem; color:var(--text-muted);">No requests submitted yet.</div>';
            return;
          }

          container.innerHTML = data.map(req => {
            const dateFromStr = new Date(req.date_from).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const dateToStr = new Date(req.date_to).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const daysLabel = `${req.number_of_days} day${req.number_of_days > 1 ? 's' : ''}`;
            const statusClass = req.status;

            let rejectHtml = '';
            if (req.status === 'rejected' && req.rejected_reason) {
              rejectHtml = `<div class="leave-reject-reason">Manager Comment: ${esc(req.rejected_reason)}</div>`;
            }

            return `
              <div class="leave-request-card ${statusClass}">
                <div class="leave-header">
                  <span class="leave-type-label">${req.leave_type === 'sick' ? 'Sick Leave' : 'Vacation Leave'}</span>
                  <span class="leave-badge ${statusClass}">${req.status}</span>
                </div>
                <div class="leave-dates">${dateFromStr} — ${dateToStr}</div>
                <div class="leave-days">${daysLabel}</div>
                <div class="leave-reason">${esc(req.reason)}</div>
                ${rejectHtml}
              </div>
            `;
          }).join('');

        } catch (err) {
          console.error(err);
          container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 2rem; color:var(--danger);">Failed to load requests: ${err.message}</div>`;
        }
      },

      async loadManagerApprovals() {
        const tbody = document.getElementById('manager-approvals-tbody');
        if (!tbody || !this.employee || !this.companyId) return;

        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 2rem; color:var(--text-muted);"><div class="bk-spinner" style="margin: 0 auto;"></div>Loading approvals…</td></tr>';

        try {
          const sb = window.BKAuth.sb;
          const { reports } = await this.getManagerScope();

          if (!reports || reports.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 2rem; color:var(--text-muted);">You have no direct reports.</td></tr>';
            return;
          }

          const reportIds = reports.map(report => report.id);
          const reportMap = new Map(reports.map(report => [report.id, report]));
          const { data: requests, error: requestsError } = await sb.from('leave_requests')
            .select('id, employee_id, leave_type, date_from, date_to, number_of_days, reason, status, created_at')
            .eq('company_id', this.companyId)
            .eq('status', 'pending')
            .in('employee_id', reportIds)
            .order('created_at', { ascending: true })
            .limit(100);
          if (requestsError) throw requestsError;

          if (!requests || requests.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 2rem; color:var(--text-muted);">No pending approvals.</td></tr>';
            return;
          }

          tbody.innerHTML = requests.map(req => {
            const dateFromStr = new Date(req.date_from).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const dateToStr = new Date(req.date_to).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const report = reportMap.get(req.employee_id);
            const empName = [report?.first_name, report?.last_name].filter(Boolean).join(' ') || 'Unknown Employee';

            return `
              <tr>
                <td><strong>${esc(empName)}</strong></td>
                <td><span class="leave-type-label">${req.leave_type === 'sick' ? 'Sick' : 'Vacation'}</span></td>
                <td><strong>${dateFromStr} — ${dateToStr}</strong></td>
                <td>${req.number_of_days}</td>
                <td><span style="font-size:0.8rem; color:var(--text-secondary);">${esc(req.reason)}</span></td>
                <td>
                  <div class="manager-action-group">
                    <button class="manager-action-btn approve" onclick="AttendanceApp.approveRequest('${req.id}')">Approve</button>
                    <button class="manager-action-btn reject" onclick="AttendanceApp.openRejectModal('${req.id}')">Reject</button>
                  </div>
                </td>
              </tr>
            `;
          }).join('');

        } catch (err) {
          console.error(err);
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 2rem; color:var(--danger);">Leave requests could not be loaded.</td></tr>';
        }
      },

      resolveLeaveManagerId(employee, structure) {
        if (employee?.reporting_to) return employee.reporting_to;
        const employeeId = employee?.id;
        if (!employeeId) return null;

        for (const department of (structure?.departments || [])) {
          const departmentManagerId = department?.managerId || null;
          for (const team of (department?.subteams || [])) {
            if (team?.managerId === employeeId) return departmentManagerId;
            if ((team?.colleagueIds || []).includes(employeeId)) {
              return team?.managerId || departmentManagerId;
            }
          }
        }
        return null;
      },

      async submitLeaveRequest() {
        if (!this.employee || !this.companyId) {
          showToast('Employee profile configuration incomplete.', true);
          return;
        }

        const type = document.getElementById('leave-type-select').value;
        const reason = document.getElementById('leave-reason').value.trim();

        if (!reason) {
          showToast('Please state a reason for filing leave.', true);
          return;
        }

        let dateFrom, dateTo, numDays;

        if (type === 'vacation') {
          dateFrom = document.getElementById('vl-from').value;
          dateTo = document.getElementById('vl-to').value;

          if (!dateFrom || !dateTo) {
            showToast('Please specify leave start and end dates.', true);
            return;
          }

          const d1 = new Date(dateFrom + 'T00:00:00');
          const d2 = new Date(dateTo + 'T00:00:00');

          if (d2 < d1) {
            showToast('Start date cannot be after end date.', true);
            return;
          }

          const diffTime = Math.abs(d2 - d1);
          numDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

          // Check balance limit
          const vlBalance = parseFloat(this.employee.vl_load || 0);
          if (numDays > vlBalance) {
            showToast(`Insufficient Vacation Leave balance. Requested: ${numDays}, Available: ${vlBalance}.`, true);
            return;
          }

        } else {
          dateFrom = document.getElementById('sl-from').value;
          dateTo = this.leaveRestrictions.sl_single_day_only
            ? dateFrom
            : document.getElementById('sl-to').value;

          if (!dateFrom || !dateTo) {
            showToast('Please specify the Sick Leave date.', true);
            return;
          }

          const d1 = new Date(dateFrom + 'T00:00:00');
          const d2 = new Date(dateTo + 'T00:00:00');
          if (d2 < d1) {
            showToast('Start date cannot be after end date.', true);
            return;
          }
          numDays = Math.round((d2 - d1) / 86400000) + 1;

          // Validate timing check
          if (!this.validateSickLeaveTiming()) {
            showToast('This Sick Leave request does not meet the configured filing restrictions.', true);
            return;
          }

          // Check balance limit
          const slBalance = parseFloat(this.employee.sl_load || 0);
          if (numDays > slBalance) {
            showToast(`Insufficient Sick Leave balance. Requested: ${numDays}, Available: ${slBalance}.`, true);
            return;
          }
        }

        const btn = document.getElementById('btn-submit-leave');
        btn.disabled = true;
        btn.textContent = 'Filing…';

        try {
          const sb = window.BKAuth.sb;
          const payload = {
            company_id: this.companyId,
            employee_id: this.employee.id,
            leave_type: type,
            date_from: dateFrom,
            date_to: dateTo,
            number_of_days: numDays,
            reason: reason,
            status: 'pending'
          };

          const { error } = await sb.from('leave_requests').insert([payload]);
          if (error) throw error;

          showToast('Leave request submitted successfully.');
          
          // Clear inputs
          document.getElementById('leave-reason').value = '';
          if (type === 'vacation') {
            document.getElementById('vl-from').value = '';
            document.getElementById('vl-to').value = '';
            document.getElementById('vl-days-display').value = '0 days';
          }

          await this.loadLeavesData();
        } catch (err) {
          console.error(err);
          const isOverlappingLeave = err?.code === 'P0001'
            && String(err.message || '').includes('overlapping pending or approved leave request');
          showToast(
            isOverlappingLeave
              ? 'You already have a pending or approved leave request covering one or more of those dates.'
              : 'The leave request could not be submitted. Please try again.',
            true
          );
        } finally {
          btn.disabled = false;
          btn.textContent = 'Request';
        }
      },

      async approveRequest(reqId) {
        const ok = await BKDialog.ask({
          title: 'Approve Leave Request',
          message: 'Are you sure you want to approve this request? Leave credits will be deducted.',
          okText: 'Approve'
        });
        if (!ok) return;

        try {
          const sb = window.BKAuth.sb;
          const { error } = await sb.rpc('decide_direct_report_leave_request', {
            p_request_id: reqId,
            p_decision: 'approved',
            p_rejection_reason: null
          });
          if (error) throw error;

          showToast('Leave request approved.');
          await this.loadManagerApprovals();
        } catch (err) {
          console.error(err);
          showToast('The leave request could not be approved. Please try again.', true);
        }
      },

      openRejectModal(id) {
        document.getElementById('reject-request-id').value = id;
        document.getElementById('reject-reason-input').value = '';
        document.getElementById('reject-modal').classList.add('open');
      },

      closeRejectModal() {
        document.getElementById('reject-modal').classList.remove('open');
      },

      async confirmReject() {
        const id = document.getElementById('reject-request-id').value;
        const reason = document.getElementById('reject-reason-input').value.trim();

        if (!reason) {
          showToast('Please state rejection reason.', true);
          return;
        }

        try {
          const sb = window.BKAuth.sb;
          const { error } = await sb.rpc('decide_direct_report_leave_request', {
            p_request_id: id,
            p_decision: 'rejected',
            p_rejection_reason: reason
          });

          if (error) throw error;

          showToast('Leave request rejected.');
          this.closeRejectModal();
          await this.loadManagerApprovals();
        } catch (err) {
          console.error(err);
          showToast('The leave request could not be rejected. Please try again.', true);
        }
      }
    };

    // Boot
    document.addEventListener('DOMContentLoaded', () => {
      AttendanceApp.init();
    });
  </script>
</body>
</html>
