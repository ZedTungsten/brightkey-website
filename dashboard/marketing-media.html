<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing Media — Brightkey Portal</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/dashboard/marketing-media/marketing-media.css?v=20260831-1" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar" id="dash-sidebar"></aside>
    <div class="dash-main">
      <div class="top-bar">
        <span class="top-bar-title">Marketing Media</span>
      </div>

      <nav class="drawer-tabs" aria-label="Marketing Media sections">
        <button type="button" class="tab-btn active">Customers</button>
      </nav>

      <main class="marketing-media-main">
        <div class="marketing-media-toolbar">
          <div class="marketing-media-filters">
            <div class="bk-search-field marketing-media-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
              <input id="media-search" type="search" placeholder="Search customer, order number, or device..." aria-label="Search customer media" />
            </div>
            <select id="media-device-filter" class="form-select marketing-media-field" aria-label="Filter by customer, order number, and device">
              <option value="">All customers and devices</option>
            </select>
          </div>

          <div class="month-picker" id="marketing-media-month-navigator" aria-label="Installed month">
            <button type="button" id="media-prev-month" aria-label="Previous month">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
            </button>
            <span id="media-month-display"></span>
            <button type="button" id="media-next-month" aria-label="Next month">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
          </div>
        </div>

        <section class="media-table-card" aria-label="Customer installation media">
          <div class="media-table-scroll">
            <table class="media-table">
              <thead>
                <tr>
                  <th class="customer-column">Customer &amp; Installation</th>
                  <th>Media</th>
                </tr>
              </thead>
              <tbody id="media-table-body">
                <tr>
                  <td colspan="2">
                    <div class="loading-wrapper"><span class="spinner-cyan"></span><span>Loading customer media...</span></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/dashboard/marketing-media/marketing-media.js?v=20260831-1"></script>
</body>
</html>
