<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Media — Brightkey Portal</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/dashboard/media/media.css?v=20260901-1" />
  <link rel="stylesheet" href="/dashboard/media/products/products.css?v=20260831-1" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
</head>
<body class="marketing-media-page">
  <div class="dash-layout">
    <aside class="dash-sidebar" id="dash-sidebar"></aside>
    <div class="dash-main">
      <div class="top-bar"><span class="top-bar-title">Media</span></div>

      <nav class="drawer-tabs" aria-label="Media sections">
        <a class="tab-btn" data-media-tab="customers" href="/dashboard/media/customers">Customers</a>
        <a class="tab-btn active" data-media-tab="products" href="/dashboard/media/products" aria-current="page">Products</a>
      </nav>

      <main class="marketing-media-main">
        <div class="marketing-media-toolbar">
          <div class="marketing-media-filters">
            <select id="product-media-filter" class="form-select marketing-media-field product-media-filter" aria-label="Filter by SKU and product">
              <option value="">All Products</option>
            </select>
          </div>
          <div class="product-range-filters" aria-label="Date range">
            <select id="product-media-year" class="form-select product-range-select" aria-label="Year"></select>
            <select id="product-media-quarter" class="form-select product-range-select" aria-label="Quarter">
              <option value="1">Q1</option>
              <option value="2">Q2</option>
              <option value="3">Q3</option>
              <option value="4">Q4</option>
            </select>
          </div>
        </div>

        <section class="media-table-card" aria-label="Product installation media">
          <div class="media-table-scroll">
            <table class="media-table product-media-table">
              <thead><tr><th class="product-sku-column">SKU</th><th>Customer Installations &amp; After Media</th></tr></thead>
              <tbody id="product-media-body"><tr><td colspan="2"><div class="loading-wrapper"><span class="spinner-cyan"></span><span>Loading product media...</span></div></td></tr></tbody>
            </table>
          </div>
          <footer class="media-pagination">
            <span id="product-media-page-status" aria-live="polite">Page 1</span>
            <div class="media-page-actions">
              <button type="button" id="product-media-prev-page" class="btn btn-outline" disabled>Previous</button>
              <div id="product-media-page-numbers" class="media-page-numbers" aria-label="Pagination"></div>
              <button type="button" id="product-media-next-page" class="btn btn-outline" disabled>Next</button>
            </div>
          </footer>
        </section>
      </main>
    </div>
  </div>

  <div id="product-media-preview" class="media-video-modal" aria-hidden="true">
    <div class="media-image-card" role="dialog" aria-modal="true" aria-labelledby="product-media-preview-title">
      <header class="media-video-header">
        <h2 id="product-media-preview-title">Media Preview</h2>
        <button type="button" id="product-media-preview-close" class="media-video-close" aria-label="Close media preview" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </header>
      <div class="product-media-preview-body">
        <img id="product-media-preview-image" alt="Installation media preview" hidden />
        <video id="product-media-preview-video" controls playsinline preload="metadata" hidden></video>
        <p id="product-media-preview-error" class="media-video-error" hidden>This media cannot be previewed in this browser.</p>
      </div>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/dashboard/media/products/products.js?v=20260901-1"></script>
</body>
</html>
