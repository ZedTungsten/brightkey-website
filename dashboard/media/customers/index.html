<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media — Brightkey Portal</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/dashboard/media/media.css?v=20260901-1" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
</head>
<body class="marketing-media-page">
  <div class="dash-layout">
    <aside class="dash-sidebar" id="dash-sidebar"></aside>
    <div class="dash-main">
      <div class="top-bar">
        <span class="top-bar-title">Media</span>
      </div>

      <nav class="drawer-tabs" aria-label="Media sections">
        <a class="tab-btn active" data-media-tab="customers" href="/dashboard/media/customers" aria-current="page">Customers</a>
        <a class="tab-btn" data-media-tab="products" href="/dashboard/media/products">Products</a>
      </nav>

      <main class="marketing-media-main">
        <div class="marketing-media-toolbar">
          <div class="marketing-media-filters">
            <div class="bk-search-field marketing-media-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
              <input id="media-search" type="search" placeholder="Search customer, order number, or device..." aria-label="Search customer media" />
            </div>
            <select id="media-device-filter" class="form-select marketing-media-field" aria-label="Filter by customer, order number, and device">
              <option value="">All Customers</option>
            </select>
            <select id="media-sort" class="form-select marketing-media-field marketing-media-sort" aria-label="Sort customer media">
              <option value="date-desc">Date (Latest First)</option>
              <option value="name-asc">Name (A to Z)</option>
              <option value="date-asc">Date (Earliest First)</option>
            </select>
          </div>

          <div class="month-picker" id="marketing-media-month-navigator" aria-label="Installed month">
            <button type="button" id="media-prev-month" aria-label="Previous month">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
            </button>
            <span id="media-month-display"></span>
            <button type="button" id="media-next-month" aria-label="Next month">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
          </div>
        </div>

        <section class="media-table-card" aria-label="Customer installation media">
          <div class="media-table-scroll">
            <table class="media-table">
              <thead>
                <tr>
                  <th class="customer-column">Customer &amp; Installation</th>
                  <th>Media</th>
                </tr>
              </thead>
              <tbody id="media-table-body">
                <tr>
                  <td colspan="2">
                    <div class="loading-wrapper"><span class="spinner-cyan"></span><span>Loading customer media...</span></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <footer class="media-pagination">
            <span id="media-page-status" aria-live="polite">Page 1</span>
            <div class="media-page-actions">
              <button type="button" id="media-prev-page" class="btn btn-outline" disabled>Previous</button>
              <div id="media-page-numbers" class="media-page-numbers" aria-label="Pagination"></div>
              <button type="button" id="media-next-page" class="btn btn-outline" disabled>Next</button>
            </div>
          </footer>
        </section>
      </main>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <div id="media-video-modal" class="media-video-modal" aria-hidden="true">
    <div class="media-video-card" role="dialog" aria-modal="true" aria-labelledby="media-video-title">
      <header class="media-video-header">
        <h2 id="media-video-title">Video Preview</h2>
        <div class="media-video-actions">
          <a id="media-video-download" class="media-video-download" download="installation-video" aria-label="Download video">Download</a>
          <button type="button" id="media-video-close" class="media-video-close" aria-label="Close video preview" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </div>
      </header>
      <div class="media-video-body">
        <video id="media-video-player" controls playsinline preload="metadata"></video>
        <p id="media-video-error" class="media-video-error" hidden>This video cannot be previewed in this browser.</p>
      </div>
    </div>
  </div>

  <div id="media-image-modal" class="media-video-modal" aria-hidden="true">
    <div class="media-image-card" role="dialog" aria-modal="true" aria-labelledby="media-image-title">
      <header class="media-video-header">
        <h2 id="media-image-title">Image Preview</h2>
        <button type="button" id="media-image-close" class="media-video-close" aria-label="Close image preview" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </header>
      <div class="media-image-body">
        <img id="media-image-preview" alt="Installation media preview" />
        <p id="media-image-error" class="media-video-error" hidden>This image cannot be previewed.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/dashboard/media/media.js?v=20260901-1"></script>
</body>
</html>
