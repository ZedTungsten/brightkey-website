<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouse — Brightkey Admin</title>
  
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <link rel="stylesheet" href="/dashboard/warehouse/shared.css" />
  <style>
    #panel-order {
      height: auto;
      min-height: 100%;
    }

    #panel-order > .panel {
      height: auto;
      min-height: 100%;
    }

    .reorder-row {
      display: flex;
      align-items: stretch;
      gap: 1rem;
      overflow-x: auto;
      padding: 0 0 1rem;
      scroll-snap-type: x proximity;
    }

    .supplier-order-panel {
      flex: 0 0 50vw;
      width: 50vw;
      min-width: 50vw;
      margin-bottom: 0 !important;
      scroll-snap-align: start;
    }

    .add-reorder-card {
      flex: 0 0 220px;
      min-height: 420px;
      border: 4px dashed #d4d4d8;
      border-radius: 8px;
      background: transparent;
      color: var(--cyan-dark);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .add-reorder-card:hover {
      border-color: var(--cyan);
      background: var(--cyan-dim);
    }
  </style>
</head>
<body>
  <div class="toast-container" id="toast-container"></div>

  <div class="dash-layout">
    <!-- Sidebar -->
    <aside class="dash-sidebar" id="dash-sidebar"></aside>

    <!-- Main Content -->
    <div class="dash-main">

      <div class="page-wrap">
        
        <!-- Top Bar -->
        <div class="top-bar">
          <span class="top-bar-title">Warehouse & Inventory Ledger</span>
          <div style="flex:1;"></div>
          <div style="display:flex; gap:0.5rem; align-items:center;">
            <button id="btn-undo" class="btn btn-outline" style="display: none; border-color: var(--warning); color: var(--warning);" onclick="undoLastAction(this)">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" style="vertical-align: -2px; margin-right: 6px;"><path d="M3 7v6h6M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>Undo
            </button>
            <select id="wh-select-dropdown" class="wh-select-dropdown" style="display:none;" onchange="switchWarehouse(this.value)"></select>
            
            <button id="btn-all-supplier-orders" class="btn btn-primary" onclick="submitAllSupplierOrders(this)" disabled>
              Request Order
            </button>
          </div>
        </div>

    <!-- Content Area -->
    <div class="content-area" style="padding-bottom: 2rem;">
      
      <!-- Left Workspace (Tables & Stats) -->
      <div class="main-workspace">

        <!-- Level-2 Operation Tab Bar -->
        <div class="drawer-tabs">
          <a class="tab-btn" href="/dashboard/inventory/summary">Summary</a>
          <a class="tab-btn" href="/dashboard/inventory/stats">Stats</a>
          <a class="tab-btn" href="/dashboard/inventory/forecast">Forecast</a>
          <a class="tab-btn active" href="/dashboard/inventory/order">Order</a>
          <a class="tab-btn" href="/dashboard/inventory/forecast#settings">Settings</a>
        </div>

        <!-- Table Scroll workspace -->
        <div class="table-scroll">
          <!-- Tab Panel: Order -->
          <div class="tab-panel active" id="panel-order">
            <div class="reorder-row" id="reorder-row">
            <div class="panel supplier-order-panel">
              <!-- Business & Supplier Selectors -->
              <div style="display: flex; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--bg-surface); flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 0.4rem;">
                  <label class="form-label" style="font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Select Business</label>
                  <select data-role="business-select" class="form-select" onchange="handleBusinessSelect(this)" style="height: 38px; background: var(--bg-base); color: var(--text-primary); border: 1px solid var(--border); padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.85rem; outline: none;">
                    <option value="">-- Choose Business --</option>
                  </select>
                </div>
                <div class="form-group" style="flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 0.4rem;">
                  <label class="form-label" style="font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Select Supplier</label>
                  <select data-role="supplier-select" class="form-select" onchange="handleSupplierSelect(this)" style="height: 38px; background: var(--bg-base); color: var(--text-primary); border: 1px solid var(--border); padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.85rem; outline: none;" disabled>
                    <option value="">-- Select Business First --</option>
                  </select>
                </div>
              </div>

              <div data-role="catalog-wrapper" style="display: none;">
                <!-- Search & Page Stats -->
                <div style="display: flex; gap: 1rem; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; background: var(--bg-surface);">
                  <div style="display: flex; gap: 0.75rem; align-items: center; flex: 1; min-width: 280px;">
                    <div class="bk-search-field">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
                      <input type="search" data-role="supplier-search" placeholder="Search by SKU or title..." oninput="handleSupplierSearch(this)" />
                    </div>
                </div>
              </div>

              <!-- Product Grid Table -->
              <div class="table-responsive">
                <table>
                  <thead>
                    <tr>
                      <th style="width: 100px;">Image</th>
                      <th style="width: 160px;">Product Code</th>
                      <th>Product Title</th>
                      <th style="width: 140px;">Quantity</th>
                      <th style="width: 160px; text-align: right;">Dealer Price</th>
                      <th style="width: 160px; text-align: right;">Line Total</th>
                    </tr>
                  </thead>
                  <tbody data-role="supplier-product-list">
                    <tr>
                      <td colspan="6">
                        <div class="loading-wrapper">
                          <div class="spinner-cyan"></div>
                          <span>Loading product catalog...</span>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Pager Row -->
              <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.25rem; border-top: 1px solid var(--border); background: var(--bg-surface); flex-wrap: wrap; gap: 0.75rem;">
                <div style="display:flex;align-items:center;gap:0.75rem;">
                  <div data-role="supplier-pager" style="display: flex; gap: 0.35rem; align-items: center;"></div>
                  <div data-role="supplier-page-info" style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Page 1 of 1</div>
                </div>
                <div data-role="supplier-selected-info" style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; margin-left:auto;">No items selected</div>
              </div>

              <!-- Tally Summary Section -->
              <div style="padding: 1.5rem; border-top: 1px solid var(--border); background: var(--bg-elevated);">
                <!-- Table headers for tally -->
                <div style="display: flex; align-items: center; gap: 1rem; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);">
                  <div style="width: 180px;">Unit Code</div>
                  <div style="width: 90px; text-align: right;">Quantity</div>
                  <div style="width: 140px; text-align: right;">Price</div>
                  <div style="margin-left: auto; width: 160px; text-align: right;">Amount</div>
                </div>

                <div data-role="supplier-tally-list" style="padding-top: 0.5rem;">
                  <div style="font-size: 0.82rem; color: var(--text-muted); padding: 0.5rem 0;">No products selected.</div>
                </div>

                <!-- Tally Total -->
                <div data-role="supplier-tally-total" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); text-align: right; font-size: 1.05rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-mono);">
                  Total: ₱0.00
                </div>

              </div>
            </div> <!-- End of supplier-catalog-wrapper -->

            </div>
            <button type="button" class="add-reorder-card" id="add-reorder-card" onclick="addReorderPanel()">+ Add Reorder</button>
            </div>
          </div>
        </div>

      </div>

      

      </div>

    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/dashboard/warehouse/shared.js"></script>
  <script>
    'use strict';

    // Bridge window globals to WarehousePage properties
    Object.defineProperty(window, 'sb', { get() { return WarehousePage.sb; }, set(val) { WarehousePage.sb = val; } });
    Object.defineProperty(window, 'companyId', { get() { return WarehousePage.companyId; }, set(val) { WarehousePage.companyId = val; } });
    Object.defineProperty(window, 'activeWarehouseId', { get() { return WarehousePage.activeWarehouseId; }, set(val) { WarehousePage.activeWarehouseId = val; } });
    Object.defineProperty(window, 'fulfillmentWarehouses', { get() { return WarehousePage.fulfillmentWarehouses; }, set(val) { WarehousePage.fulfillmentWarehouses = val; } });
    Object.defineProperty(window, 'allProducts', { get() { return WarehousePage.allProducts; }, set(val) { WarehousePage.allProducts = val; } });
    Object.defineProperty(window, 'allEmployees', { get() { return WarehousePage.allEmployees; }, set(val) { WarehousePage.allEmployees = val; } });
    Object.defineProperty(window, 'bookings', { get() { return WarehousePage.bookings; }, set(val) { WarehousePage.bookings = val; } });
    Object.defineProperty(window, 'activeTransactions', { get() { return WarehousePage.activeTransactions; }, set(val) { WarehousePage.activeTransactions = val; } });
    Object.defineProperty(window, 'lastAction', { get() { return WarehousePage.lastAction; }, set(val) { WarehousePage.lastAction = val; } });

    // Global helper functions mapped to WarehousePage
    const wrapActionWithLoading = (btn, asyncFn) => WarehousePage.wrapActionWithLoading(btn, asyncFn);
    const updateUndoButtonState = () => WarehousePage.updateUndoButtonState();
    const formatMoney = (cents) => WarehousePage.formatMoney(cents);
    const escFulfillment = (str) => WarehousePage.escFulfillment(str);
    const escapeHtml = escFulfillment;
    const showToast = (msg, isError) => WarehousePage.showToast(msg, isError);
    const showLoadingState = () => WarehousePage.showLoadingState();
    const loadWarehouseTabs = (tenantId) => WarehousePage.loadWarehouseTabs(tenantId);
    const loadCoreData = () => WarehousePage.loadCoreData();
    const updateBadgeCounts = () => WarehousePage.updateBadgeCounts();
    const runAutoSyncInBackground = () => WarehousePage.runAutoSyncInBackground();
    const handleCancellationProcess = (id, sku, qty, prevStatus) => WarehousePage.handleCancellationProcess(id, sku, qty, prevStatus);
    const runAutoSync = () => WarehousePage.runAutoSync();

    let allInventory = {};
    let isEditingAvailable = false;
    let warehouseTransfers = [];

    // Supplier Order State
    const supplierOrderPageSize = 10;
    let suppliersList = [];
    let businessesList = [];
    const reorderPanelStates = new WeakMap();

    function createReorderState() {
      return { search: '', page: 1, quantities: {}, posting: false, businessId: '', supplierId: '' };
    }

    function getReorderPanel(source) {
      if (source instanceof Element) return source.closest('.supplier-order-panel');
      return source?.classList?.contains('supplier-order-panel') ? source : document.querySelector('.supplier-order-panel');
    }

    function getReorderState(panel) {
      if (!reorderPanelStates.has(panel)) reorderPanelStates.set(panel, createReorderState());
      return reorderPanelStates.get(panel);
    }

    function panelRole(panel, role) {
      return panel?.querySelector(`[data-role="${role}"]`);
    }

    // Initialize Page
    async function init() {
      try {
        const authInfo = await BKAuth.checkRoleGate(['Logistics'], '../../admin.html');
        if (!authInfo) return;
        sb = BKAuth.sb;

        // Resolve company_id using tenant_id
        const { data: co } = await sb.from('companies').select('id').eq('tenant_id', authInfo.tenantId).limit(1).maybeSingle();
        companyId = co?.id || null;

        await loadWarehouseTabs(authInfo.tenantId);
        showLoadingState();
        await loadCoreData();

        // Load businesses in the company-wide priority order and suppliers together.
        const [businessResult, orderResult, supplierResult] = await Promise.all([
          sb.from('tenant_businesses').select('id,name').eq('company_id', companyId),
          sb.from('global_settings').select('value').eq('company_id', companyId).eq('key', 'business_order').maybeSingle(),
          sb.from('suppliers').select('id,name,business_id').eq('company_id', companyId).order('name')
        ]);
        if (businessResult.error || orderResult.error || supplierResult.error) {
          throw businessResult.error || orderResult.error || supplierResult.error;
        }
        const businessRank = new Map((Array.isArray(orderResult.data?.value) ? orderResult.data.value : [])
          .map((id, index) => [id, index]));
        businessesList = [...(businessResult.data || [])].sort((a, b) =>
          (businessRank.get(a.id) ?? Number.MAX_SAFE_INTEGER) - (businessRank.get(b.id) ?? Number.MAX_SAFE_INTEGER)
          || a.name.localeCompare(b.name));
        suppliersList = supplierResult.data || [];
        initializeReorderPanel(document.querySelector('.supplier-order-panel'));

        await refreshDashboard();
        await loadRecommendedOrderHandoff();
        runAutoSyncInBackground();

        

        // Setup Drag & Drop for Pack Photo Modal
        const zone = document.getElementById('photo-preview-container');
        if (zone) {
          zone.addEventListener('dragover', e => {
            e.preventDefault();
            e.stopPropagation();
            zone.style.borderColor = 'var(--cyan)';
          });
          zone.addEventListener('dragleave', () => {
            zone.style.borderColor = 'var(--border)';
          });
          zone.addEventListener('drop', async e => {
            e.preventDefault();
            e.stopPropagation();
            zone.style.borderColor = 'var(--border)';
            if (e.dataTransfer.files.length) {
              const file = e.dataTransfer.files[0];
              if (file.type.startsWith('image/')) {
                try {
                  const compressed = await compressPackedImage(file);
                  packPhotoBlob = compressed;
                  const url = URL.createObjectURL(compressed);
                  document.getElementById('packed-photo-preview').src = url;
                  document.getElementById('packed-photo-preview').style.display = 'block';
                  document.getElementById('upload-placeholder').style.display = 'none';
                  document.getElementById('camera-container').style.display = 'none';
                  document.getElementById('photo-preview-container').style.display = 'flex';
                  document.getElementById('btn-open-camera').style.display = 'inline-flex';
                  document.getElementById('btn-confirm-pack').disabled = false;
                } catch (err) {
                  console.error(err);
                  showToast('File compression failed: ' + err.message, true);
                }
              } else {
                showToast('Please drop a valid image file.', true);
              }
            }
          });
        }
      } catch (err) {
        console.error(err);
        showToast('Error loading fulfillment data: ' + err.message, true);
      }
    }



    async function refreshDashboard() {
      // 2. Fetch inventory snapshot — scoped to active warehouse
      let invQuery = sb.from('inventory').select('*');
      if (companyId) invQuery = invQuery.or(`company_id.eq.${companyId},company_id.is.null`);
      if (activeWarehouseId) {
        invQuery = invQuery.eq('warehouse_id', activeWarehouseId);
      } else {
        invQuery = invQuery.is('warehouse_id', null);
      }

      // 3. Fetch transactions — scoped to active warehouse
      let txQuery = sb.from('inventory_transactions').select('*').order('created_at', { ascending: false });
      if (companyId) txQuery = txQuery.or(`company_id.eq.${companyId},company_id.is.null`);
      if (activeWarehouseId) {
        txQuery = txQuery.eq('warehouse_id', activeWarehouseId);
      } else {
        txQuery = txQuery.is('warehouse_id', null);
      }
      txQuery = txQuery.range(0, 999);

      const transferQuery = companyId
        ? sb.from('warehouse_transfers').select('*').eq('company_id', companyId)
        : Promise.resolve({ data: [], error: null });

      const deliveryQuery = companyId
        ? sb.from('delivery_bookings').select('*').eq('company_id', companyId)
        : Promise.resolve({ data: [], error: null });

      const [
        { data: invData, error: invErr },
        { data: txData, error: txErr },
        { data: transData, error: transErr },
        { data: delivData, error: delivErr }
      ] = await Promise.all([invQuery, txQuery, transferQuery, deliveryQuery]);

      if (invErr) throw invErr;
      if (txErr) throw txErr;
      if (!delivErr) {
        WarehousePage.deliveryBookings = delivData || [];
      }

      allInventory = {};
      (invData || []).forEach(row => {
        allInventory[row.sku] = row;
      });
      activeTransactions = txData || [];
      if (transErr) {
        console.error('Failed to fetch warehouse transfers:', transErr);
        warehouseTransfers = [];
      } else {
        warehouseTransfers = transData || [];
      }

      // Update warehouse name label in the inventory panel header
      const whNameEl = document.getElementById('panel-wh-name');
      if (whNameEl) {
        const wh = fulfillmentWarehouses.find(w => w.id === activeWarehouseId);
        whNameEl.textContent = wh ? wh.name : 'All Inventory';
      }

      // Render this page only; subpages carry their own focused render paths.
      renderSupplierOrderTab();
      updateBadgeCounts();
    }




    let sortCol = 'sku';
    let sortDir = 'asc';
    let selectedCategories = new Set();
    let uniqueCategories = [];
    let isCategoryInitialized = false;

    // Stock filter state — all active by default (shows everything)
    const activeStockFilters = new Set(['with_stocks', 'no_stocks', 'with_dispatched']);

    window.toggleStockFilterDropdown = function(event) {
      event.stopPropagation();
      const menu = document.getElementById('stock-filter-menu');
      if (!menu) return;
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    };

    window.handleStockFilterChange = function(cb) {
      if (cb.checked) {
        activeStockFilters.add(cb.value);
      } else {
        activeStockFilters.delete(cb.value);
      }
      // Update button label to show active count when not all selected
      const btn = document.getElementById('stock-filter-btn');
      if (btn) {
        const allThree = activeStockFilters.size === 3;
        btn.childNodes[0].textContent = allThree ? 'Stock Filter' : `Stock Filter (${activeStockFilters.size})`;
      }
      renderInventorySummary();
    };

    window.selectAllCategories = function(selectActive, event) {
      if (event) event.stopPropagation();
      selectedCategories.clear();
      if (selectActive) {
        uniqueCategories.forEach(cat => selectedCategories.add(cat));
      }
      populateCategoryFilter();
      renderInventorySummary();
    };

    function populateCategoryFilter() {
      const cats = new Set();
      allProducts.forEach(p => {
        cats.add(p.category || '');
      });
      uniqueCategories = Array.from(cats).sort();

      const menu = document.getElementById('category-dropdown-menu');
      if (!menu) return;

      // Initialize all categories as selected on first load when categories are actually loaded
      if (!isCategoryInitialized && uniqueCategories.length > 0) {
        uniqueCategories.forEach(cat => selectedCategories.add(cat));
        isCategoryInitialized = true;
      }

      const headerHtml = `
        <div style="display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border); padding: 0.25rem 0.5rem 0.5rem; margin-bottom: 0.25rem; justify-content: space-between; align-items: center;">
          <span style="color: var(--cyan-light); cursor: pointer; font-weight: 700; font-size: 0.72rem; text-transform: uppercase;" onclick="selectAllCategories(true, event)">All</span>
          <span style="color: var(--text-muted); cursor: pointer; font-weight: 700; font-size: 0.72rem; text-transform: uppercase;" onclick="selectAllCategories(false, event)">None</span>
        </div>
      `;

      const listHtml = uniqueCategories.map(cat => {
        const displayLabel = cat ? cat.replace(/_/g, ' ') : '(No Category)';
        const checked = selectedCategories.has(cat) ? 'checked' : '';
        return `
          <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.5rem; font-size: 0.82rem; cursor: pointer; color: var(--text-secondary); user-select: none;">
            <input type="checkbox" value="${cat}" ${checked} onchange="handleCategoryCheckboxChange(this)" style="cursor: pointer;" />
            <span style="text-transform: capitalize;">${displayLabel}</span>
          </label>
        `;
      }).join('');

      menu.innerHTML = headerHtml + listHtml;
    }

    window.toggleCategoryDropdown = function(event) {
      event.stopPropagation();
      const menu = document.getElementById('category-dropdown-menu');
      if (!menu) return;
      const isOpen = menu.style.display === 'block';
      menu.style.display = isOpen ? 'none' : 'block';
    };

    window.handleCategoryCheckboxChange = function(cb) {
      const cat = cb.value;
      if (cb.checked) {
        selectedCategories.add(cat);
      } else {
        selectedCategories.delete(cat);
      }
      renderInventorySummary();
    };

    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      const catContainer = document.getElementById('category-dropdown-container');
      const catMenu = document.getElementById('category-dropdown-menu');
      if (catMenu && catContainer && !catContainer.contains(e.target)) {
        catMenu.style.display = 'none';
      }
      const stockContainer = document.getElementById('stock-filter-container');
      const stockMenu = document.getElementById('stock-filter-menu');
      if (stockMenu && stockContainer && !stockContainer.contains(e.target)) {
        stockMenu.style.display = 'none';
      }
    });

    function updateSortIndicators() {
      const cols = ['sku', 'title', 'category', 'business', 'available', 'reserved', 'inspect', 'packed', 'returned', 'cancelled'];
      cols.forEach(col => {
        const span = document.getElementById(`sort-icon-${col}`);
        if (!span) return;
        if (sortCol === col) {
          span.innerHTML = sortDir === 'asc' 
            ? `<svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" stroke-width="3" fill="none" style="vertical-align: middle; margin-left: 4px; color: var(--cyan);"><polyline points="18 15 12 9 6 15"></polyline></svg>` 
            : `<svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" stroke-width="3" fill="none" style="vertical-align: middle; margin-left: 4px; color: var(--cyan);"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
        } else {
          span.innerHTML = `<svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" stroke-width="2" fill="none" style="vertical-align: middle; margin-left: 4px; opacity: 0.3;"><polyline points="6 9 12 15 18 9"></polyline><polyline points="18 15 12 9 6 15"></polyline></svg>`;
        }
      });
    }

    window.handleSort = function(col) {
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col;
        sortDir = 'asc';
      }
      renderInventorySummary();
    };

    window.startEditingAvailable = function() {
      isEditingAvailable = true;
      document.getElementById('btn-edit-avail').style.display = 'none';
      document.getElementById('btn-save-avail').style.display = 'inline-flex';
      document.getElementById('btn-cancel-avail').style.display = 'inline-flex';
      renderInventorySummary();
    };

    window.cancelEditingAvailable = function() {
      isEditingAvailable = false;
      document.getElementById('btn-edit-avail').style.display = 'inline-flex';
      document.getElementById('btn-save-avail').style.display = 'none';
      document.getElementById('btn-cancel-avail').style.display = 'none';
      renderInventorySummary();
    };

    window.saveEditingAvailable = async function() {
      const inputs = document.querySelectorAll('.edit-avail-input');
      const updates = [];
      const changedSkus = [];

      inputs.forEach(input => {
        const sku = input.getAttribute('data-sku');
        const newVal = parseInt(input.value);
        if (isNaN(newVal)) return;

        const baseInv = allInventory[sku] || { available: 0 };
        const oldVal = baseInv.available || 0;

        if (newVal !== oldVal) {
          changedSkus.push(sku);
          updates.push({
            sku: sku,
            available: newVal
          });
        }
      });

      if (updates.length === 0) {
        showToast('No changes to save.');
        cancelEditingAvailable();
        return;
      }

      try {
        const btnSave = document.getElementById('btn-save-avail');
        btnSave.disabled = true;
        btnSave.innerText = 'Saving...';

        const promises = updates.map(async (upd) => {
          if (allInventory[upd.sku]) {
            // Update existing row by id (warehouse-scoped)
            const { error } = await sb.from('inventory')
              .update({ available: upd.available })
              .eq('id', allInventory[upd.sku].id);
            if (error) throw error;
          } else {
            // Insert new row for this warehouse
            const { error } = await sb.from('inventory')
              .insert([{ sku: upd.sku, available: upd.available, warehouse_id: activeWarehouseId || null }]);
            if (error) throw error;
          }
        });

        await Promise.all(promises);
        showToast(`Successfully updated ${updates.length} item(s).`);
        
        isEditingAvailable = false;
        document.getElementById('btn-edit-avail').style.display = 'inline-flex';
        document.getElementById('btn-save-avail').style.display = 'none';
        document.getElementById('btn-cancel-avail').style.display = 'none';
        document.getElementById('btn-save-avail').disabled = false;
        document.getElementById('btn-save-avail').innerHTML = `<svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none" style="vertical-align: middle;"><polyline points="20 6 9 17 4 12"></polyline></svg> Save Changes`;

        await refreshDashboard();
      } catch (err) {
        console.error(err);
        showToast('Error saving changes: ' + err.message, true);
        document.getElementById('btn-save-avail').disabled = false;
        document.getElementById('btn-save-avail').innerHTML = `<svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none" style="vertical-align: middle;"><polyline points="20 6 9 17 4 12"></polyline></svg> Save Changes`;
      }
    };

    function renderInventorySummary() { if (!document.getElementById('inventory-list')) return;
      const tbody = document.getElementById('inventory-list');
      tbody.innerHTML = '';

      if (allProducts.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center">No products found in database.</td></tr>`;
        return;
      }

      // Filter products by selected categories and count_inventory !== false
      const catFiltered = allProducts.filter(p => selectedCategories.has(p.category || '') && p.count_inventory !== false);

      // Apply stock filter (OR logic: show row if any checked condition matches)
      const filteredProducts = catFiltered.filter(p => {
        if (activeStockFilters.size === 3) return true; // all checked = show all
        if (activeStockFilters.size === 0) return false;
        const inv = allInventory[p.sku] || {};
        const avail = inv.available || 0;
        const dispatched = inv.dispatched || 0;
        if (activeStockFilters.has('with_stocks') && avail > 0) return true;
        if (activeStockFilters.has('no_stocks') && avail < 1) return true;
        if (activeStockFilters.has('with_dispatched') && dispatched > 0) return true;
        return false;
      });

      if (filteredProducts.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center">No products match the selected filters.</td></tr>`;
        updateSortIndicators();
        return;
      }

      // Sort
      const sortedProducts = [...filteredProducts].sort((a, b) => {
        let valA, valB;
        if (sortCol === 'sku') {
          valA = a.sku || '';
          valB = b.sku || '';
        } else if (sortCol === 'title') {
          valA = a.title || '';
          valB = b.title || '';
        } else if (sortCol === 'category') {
          valA = a.category || '';
          valB = b.category || '';
        } else if (sortCol === 'business') {
          valA = a.business || '';
          valB = b.business || '';
        } else {
          // available, reserved, packed, returned, cancelled
          valA = (allInventory[a.sku]?.[sortCol]) || 0;
          valB = (allInventory[b.sku]?.[sortCol]) || 0;
        }

        if (typeof valA === 'string') {
          return sortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        } else {
          return sortDir === 'asc' ? valA - valB : valB - valA;
        }
      });

      // Render rows
      sortedProducts.forEach(p => {
        const inv = allInventory[p.sku] || { available: 0, reserved: 0, inspect: 0, packed: 0, returned: 0, cancelled: 0 };

        const styleInspect = isStocked ? 'color:#a855f7; font-weight:600;' : 'color:var(--text-muted) !important; opacity:0.4;';
        const stylePacked = isStocked ? 'color:var(--cyan-light); font-weight:600;' : 'color:var(--text-muted) !important; opacity:0.4;';
        const styleReturned = isStocked ? 'color:var(--danger);' : 'color:var(--text-muted) !important; opacity:0.4;';
        const styleCancelled = isStocked ? 'color:var(--danger);' : 'color:var(--text-muted) !important; opacity:0.4;';

        let imageSrc = p.image_main;
        if (!imageSrc || !imageSrc.match(/^https?:\/\//)) {
          imageSrc = '../../assets/og-image.png';
        }

        tbody.innerHTML += `
          <tr>
            <td>
              <img src="${imageSrc}" alt="${p.sku}" style="width: 80px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-elevated); display: block;" />
            </td>
            <td><strong>${p.sku}</strong></td>
            <td>${p.title}</td>
            <td><span class="badge-status dispatched" style="font-size: 0.72rem; padding: 0.15rem 0.4rem; background: var(--bg-elevated); border: 1px solid var(--border); text-transform: capitalize;">${(p.category || '—').replace(/_/g, ' ')}</span></td>

    async function loadRecommendedOrderHandoff() {
      const url = new URL(window.location.href);
      const nonce = url.searchParams.get('recommended');
      if (!nonce) return;
      try {
        const { data, error } = await sb.from('global_settings').select('value')
          .eq('company_id', companyId).eq('key', 'inventory_reorder_handoff').maybeSingle();
        if (error) throw error;
        const handoff = data?.value;
        const createdAt = Date.parse(handoff?.created_at || '');
        const isFresh = Number.isFinite(createdAt) && Date.now() - createdAt < 30 * 60 * 1000;
        if (!handoff || handoff.nonce !== nonce || !isFresh || !Array.isArray(handoff.orders)) {
          showToast('The recommended reorder draft has expired. Generate it again from Forecast.', true);
          return;
        }
        const sourcePanel = document.querySelector('.supplier-order-panel');
        handoff.orders.forEach((order, index) => {
          const panel = index === 0 ? sourcePanel : addReorderPanel(false);
          if (!panel) return;
          const businessSelect = panelRole(panel, 'business-select');
          if (![...businessSelect.options].some(option => option.value === order.business_id)) return;
          businessSelect.value = order.business_id;
          handleBusinessSelect(businessSelect);
          const supplierSelect = panelRole(panel, 'supplier-select');
          if (![...supplierSelect.options].some(option => option.value === order.supplier_id)) return;
          supplierSelect.value = order.supplier_id;
          handleSupplierSelect(supplierSelect);
          const state = getReorderState(panel);
          state.quantities = Object.fromEntries((order.items || [])
            .filter(item => item?.sku && Number(item.qty) > 0)
            .map(item => [String(item.sku).toUpperCase(), Math.ceil(Number(item.qty))]));
          renderSupplierOrderTab(panel);
        });
        updateAllOrdersButton();
        url.searchParams.delete('recommended');
        history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
        showToast('Recommended reorder quantities loaded.');
      } catch (error) {
        console.error('Recommended reorder draft could not be loaded:', error);
        showToast('The recommended reorder draft could not be loaded. Try again.', true);
      }
    }

        if (p.count_inventory === false) return false;

          if (productBiz !== bizName.toLowerCase()) return false;
        }
        const sku = (p.sku || '').toLowerCase();
        const title = (p.title || '').toLowerCase();
        return !query || sku.includes(query) || title.includes(query);
      });

      // Paginate

        if (!imageSrc || !imageSrc.match(/^https?:\/\//)) {
          imageSrc = '../../assets/og-image.png'; // local default

    function renderSupplierPager(panel, pages, current) {
      const pagerWrap = panelRole(panel, 'supplier-pager');
      const state = getReorderState(panel);
      if (!pagerWrap) return;
      pagerWrap.innerHTML = '';

      function createButton(label, pageNum, disabled, active) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = active ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
        btn.innerText = label;
        btn.disabled = disabled;
        btn.style.padding = '0.35rem 0.65rem';
        btn.style.fontSize = '0.75rem';
        if (!disabled) {
          btn.onclick = () => {
            state.page = pageNum;
            renderSupplierOrderTab(panel);
          };
        }
        return btn;
      }

      // Prev Button
      pagerWrap.appendChild(createButton('Prev', current - 1, current <= 1, false));

      // Page numbers (up to 7 buttons, or ellipses)
      const buildPageButtons = (totPages, curr) => {
        const btns = [];
        if (totPages <= 7) {
          for (let i = 1; i <= totPages; i++) btns.push(i);
          return btns;
        }
        btns.push(1);
        const left = Math.max(2, curr - 2);
        const right = Math.min(totPages - 1, curr + 2);
        if (left > 2) btns.push('...');
        for (let j = left; j <= right; j++) btns.push(j);
        if (right < totPages - 1) btns.push('...');
        btns.push(totPages);
        return btns;
      };

      const pagesList = buildPageButtons(pages, current);
      pagesList.forEach(item => {
        if (item === '...') {
          const dots = document.createElement('span');
          dots.innerText = '...';
          dots.style.padding = '0 0.25rem';
          dots.style.fontSize = '0.8rem';
          dots.style.color = 'var(--text-muted)';
          pagerWrap.appendChild(dots);
        } else {
          pagerWrap.appendChild(createButton(String(item), item, false, item === current));
        }
      });

      // Next Button
      pagerWrap.appendChild(createButton('Next', current + 1, current >= pages, false));
    }

        delete state.quantities[sku];

        const lineTotalCell = row.querySelector('td[data-role="line-total"]');

    function getPanelOrderItems(panel) {
      const state = getReorderState(panel);

        const qty = state.quantities[product.sku];

          items.push({ sku: product.sku, qty });

    function updateAllOrdersButton() {

    async function submitReorderPanel(panel) {
      const state = getReorderState(panel);
      const items = getPanelOrderItems(panel);
      if (!state.supplierId || items.length === 0) return false;
      state.posting = true;
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const random = Math.floor(100 + Math.random() * 900);
      const refOrder = `SUP-${yyyy}${mm}${dd}-${random}`;

      const selectedSup = suppliersList.find(supplier => supplier.id === state.supplierId);
      const supplierName = selectedSup ? selectedSup.name : 'Supplier';

      const payloads = items.map(item => ({
        company_id: companyId,
        reference_id: refOrder,
        sku: item.sku,
        quantity: item.qty,
        type: 'supplier_order',
        status: 'ordered',
        customer_name: supplierName,
        timestamp_ordered: new Date().toISOString(),
        warehouse_id: activeWarehouseId || null
      }));

      const { error: txErr } = await sb.from('inventory_transactions').insert(payloads);
      if (txErr) throw txErr;

      const uniqueSkus = [...new Set(items.map(item => item.sku))];
      let existQ = sb.from('inventory').select('sku').or(`company_id.eq.${companyId},company_id.is.null`).in('sku', uniqueSkus);
      if (activeWarehouseId) existQ = existQ.eq('warehouse_id', activeWarehouseId);
      else existQ = existQ.is('warehouse_id', null);
      const { data: existingRows, error: checkErr } = await existQ;
      if (checkErr) throw checkErr;

      const existingSkus = new Set((existingRows || []).map(row => row.sku));
      const newInventoryRows = uniqueSkus
        .filter(sku => !existingSkus.has(sku))
        .map(sku => ({ company_id: companyId, sku, available: 0, warehouse_id: activeWarehouseId || null }));

      if (newInventoryRows.length > 0) {
        const { error: insErr } = await sb.from('inventory').insert(newInventoryRows);
        if (insErr) throw insErr;
      }

      state.quantities = {};
      state.search = '';
      state.posting = false;
      const searchInput = panelRole(panel, 'supplier-search');
      if (searchInput) searchInput.value = '';
      const businessSelect = panelRole(panel, 'business-select');
      businessSelect.value = '';
      handleBusinessSelect(businessSelect);
      return true;
    }

    window.submitAllSupplierOrders = async function(button) {
      const panels = [...document.querySelectorAll('.supplier-order-panel')]
        .filter(panel => getReorderState(panel).supplierId && getPanelOrderItems(panel).length > 0);
      if (panels.length === 0) return;

      try {
        await wrapActionWithLoading(button, async () => {
          for (const panel of panels) await submitReorderPanel(panel);
          await refreshDashboard();
          showToast(`${panels.length} supplier order${panels.length === 1 ? '' : 's'} successfully requested.`);
        });
      } catch (error) {
        panels.forEach(panel => { getReorderState(panel).posting = false; });
        throw error;
      } finally {
        button.textContent = 'Request Order';
        updateAllOrdersButton();
      }
    };

    // ACTION: Warehouse Confirms Receipt
    

            // ACTION: Unpack entire order (packed → inspect)
    

    // ACTION: Mark Packed
    

    // ACTION: Cancel from Pack queue (reserved → cancelled inventory)
    window.cancelPackItem = async function(btn, id, sku, qty) {
      await wrapActionWithLoading(btn, async () => {
        await handleCancellationProcess(id, sku, qty, 'reserved');
        lastAction = { type: 'cancelPack', id, sku, qty };
        updateUndoButtonState();
        await refreshDashboard();
      });
    };

    // ACTION: Unpack item (packed → reserved)
    window.unpackItem = async function(btn, id, sku, qty) {
      await wrapActionWithLoading(btn, async () => {
        const { error: txErr } = await sb.from('inventory_transactions').update({
          status: 'reserved',
          timestamp_packed: null
        }).eq('id', id);
        if (txErr) throw txErr;

        let invQUnpack = sb.from('inventory').select('*').eq('sku', sku);
        if (activeWarehouseId) invQUnpack = invQUnpack.eq('warehouse_id', activeWarehouseId);
        else invQUnpack = invQUnpack.is('warehouse_id', null);
        const { data: invRow, error: invErr } = await invQUnpack;
        if (invErr) throw invErr;
        if (invRow && invRow.length > 0) {
          const inv = invRow[0];
          const { error: updErr } = await sb.from('inventory').update({
            reserved: inv.reserved + qty,
            packed: Math.max(0, inv.packed - qty)
          }).eq('id', inv.id);
          if (updErr) throw updErr;
        }

        lastAction = null;
        updateUndoButtonState();
        await refreshDashboard();
      });
    };

    // ACTION: Mark Dispatched
    window.dispatchItem = async function(btn, id, sku, qty) {
      await wrapActionWithLoading(btn, async () => {
        const now = new Date().toISOString();

        const { error: txErr } = await sb.from('inventory_transactions').update({
          status: 'dispatched',
          timestamp_dispatched: now
        }).eq('id', id);
        if (txErr) throw txErr;

        let invQDisp = sb.from('inventory').select('*').eq('sku', sku);
        if (activeWarehouseId) invQDisp = invQDisp.eq('warehouse_id', activeWarehouseId);
        else invQDisp = invQDisp.is('warehouse_id', null);
        const { data: invRow, error: invErr } = await invQDisp;
        if (invErr) throw invErr;
        if (invRow && invRow.length > 0) {
          const inv = invRow[0];
          const { error: updErr } = await sb.from('inventory').update({
            packed: Math.max(0, inv.packed - qty),
            dispatched: inv.dispatched + qty
          }).eq('id', inv.id);
          if (updErr) throw updErr;
        }

        lastAction = { type: 'dispatch', id, sku, qty };
        updateUndoButtonState();
        await refreshDashboard();
      });
    };



    // ACTION: Undo Last Action
    window.undoLastAction = async function(btn) {
      if (!lastAction) {
        showToast('No action to undo.', true);
        return;
      }

      await wrapActionWithLoading(btn, async () => {
        const { type, id, sku, qty } = lastAction;

        if (type === 'pack') {
          // undo pack (change packed back to reserved)
          const { error: txErr } = await sb.from('inventory_transactions').update({
            status: 'reserved',
            timestamp_packed: null
          }).eq('id', id);
          if (txErr) throw txErr;

          let invQU1 = sb.from('inventory').select('*').eq('sku', sku);
          if (activeWarehouseId) invQU1 = invQU1.eq('warehouse_id', activeWarehouseId);
          else invQU1 = invQU1.is('warehouse_id', null);
          const { data: invRow, error: invErr } = await invQU1;
          if (invErr) throw invErr;
          if (invRow && invRow.length > 0) {
            const inv = invRow[0];
            const { error: updErr } = await sb.from('inventory').update({
              reserved: inv.reserved + qty,
              packed: Math.max(0, inv.packed - qty)
            }).eq('id', inv.id);
            if (updErr) throw updErr;
          }
          showToast('Undone: Item marked back as reserved.');
        } 
        else if (type === 'cancelPack') {
          // undo cancelPack (change cancelled back to reserved)
          const { error: txErr } = await sb.from('inventory_transactions').update({
            status: 'reserved',
            timestamp_cancelled: null
          }).eq('id', id);
          if (txErr) throw txErr;

          let invQU2 = sb.from('inventory').select('*').eq('sku', sku);
          if (activeWarehouseId) invQU2 = invQU2.eq('warehouse_id', activeWarehouseId);
          else invQU2 = invQU2.is('warehouse_id', null);
          const { data: invRow, error: invErr } = await invQU2;
          if (invErr) throw invErr;
          if (invRow && invRow.length > 0) {
            const inv = invRow[0];
            const { error: updErr } = await sb.from('inventory').update({
              reserved: inv.reserved + qty,
              cancelled: Math.max(0, inv.cancelled - qty)
            }).eq('id', inv.id);
            if (updErr) throw updErr;
          }
          showToast('Undone: Cancelled item restored back to Pack queue.');
        }
        else if (type === 'dispatch') {
          // undo dispatch (change dispatched back to packed)
          const { error: txErr } = await sb.from('inventory_transactions').update({
            status: 'packed',
            timestamp_dispatched: null
          }).eq('id', id);
          if (txErr) throw txErr;

          let invQU3 = sb.from('inventory').select('*').eq('sku', sku);
          if (activeWarehouseId) invQU3 = invQU3.eq('warehouse_id', activeWarehouseId);
          else invQU3 = invQU3.is('warehouse_id', null);
          const { data: invRow, error: invErr } = await invQU3;
          if (invErr) throw invErr;
          if (invRow && invRow.length > 0) {
            const inv = invRow[0];
            const { error: updErr } = await sb.from('inventory').update({
              packed: inv.packed + qty,
              dispatched: Math.max(0, inv.dispatched - qty)
            }).eq('id', inv.id);
            if (updErr) throw updErr;
          }
          showToast('Undone: Dispatched item moved back to Dispatch queue.');
        }
        else if (type === 'return') {
          // undo return (change returned back to dispatched)
          const { error: txErr } = await sb.from('inventory_transactions').update({
            status: 'dispatched',
            timestamp_returned: null
          }).eq('id', id);
          if (txErr) throw txErr;

          let invQU4 = sb.from('inventory').select('*').eq('sku', sku);
          if (activeWarehouseId) invQU4 = invQU4.eq('warehouse_id', activeWarehouseId);
          else invQU4 = invQU4.is('warehouse_id', null);
          const { data: invRow, error: invErr } = await invQU4;
          if (invErr) throw invErr;
          if (invRow && invRow.length > 0) {
            const inv = invRow[0];
            const { error: updErr } = await sb.from('inventory').update({
              dispatched: inv.dispatched + qty,
              returned: Math.max(0, inv.returned - qty)
            }).eq('id', inv.id);
            if (updErr) throw updErr;
          }
          showToast('Undone: Returned item marked back as dispatched.');
        }

        lastAction = null;
        updateUndoButtonState();
        await refreshDashboard();
      });
    };

    // ── WAREHOUSE TRANSFER TAB FUNCTIONALITY ──
    let directTransferDraft = [];

    window.populateTransferDropdowns = function() {
      const activeWh = fulfillmentWarehouses.find(w => w.id === activeWarehouseId);
      const skuDirectSelect = document.getElementById('direct-transfer-sku');
      const skuRequestSelect = document.getElementById('request-transfer-sku');
      const targetWhSelect = document.getElementById('direct-transfer-target-wh');
      const sourceWhSelect = document.getElementById('request-transfer-source-wh');

      if (!skuDirectSelect || !skuRequestSelect || !targetWhSelect || !sourceWhSelect) return;

      // Populate SKUs
      // 1. Direct Transfer SKU needs available stock in activeWarehouseId
      let directSkuOptions = '';
      let requestSkuOptions = '';

      allProducts.forEach(p => {
        if (p.count_inventory === false) return; // Skip service/non-stocked items
        const inv = allInventory[p.sku];
        const avail = inv ? inv.available : 0;
        
        // Show SKU, title and available quantity
        const optText = `[${p.sku}] ${p.title} (Avail: ${avail})`;
        
        requestSkuOptions += `<option value="${escFulfillment(p.sku)}">${escFulfillment(optText)}</option>`;
        if (avail > 0) {
          directSkuOptions += `<option value="${escFulfillment(p.sku)}">${escFulfillment(optText)}</option>`;
        }
      });

      skuDirectSelect.innerHTML = directSkuOptions || '<option value="" disabled>No stocked items available</option>';
      skuRequestSelect.innerHTML = requestSkuOptions || '<option value="" disabled>No products available</option>';

      // Populate Warehouses
      let targetWhOptions = '<option value="" disabled selected>Select Target Warehouse</option>';
      let sourceWhOptions = '<option value="" disabled selected>Select Source Warehouse</option>';

      fulfillmentWarehouses.forEach(w => {
        if (w.id === activeWarehouseId) return; // Exclude active warehouse
        const optHtml = `<option value="${escFulfillment(w.id)}">${escFulfillment(w.name)}</option>`;
        targetWhOptions += optHtml;
        sourceWhOptions += optHtml;
      });

      targetWhSelect.innerHTML = targetWhOptions;
      sourceWhSelect.innerHTML = sourceWhOptions;

      // If activeWarehouseId is null (All Inventory), disable controls
      const inputs = [
        skuDirectSelect, skuRequestSelect, targetWhSelect, sourceWhSelect,
        document.getElementById('direct-transfer-qty'),
        document.getElementById('request-transfer-qty'),
        document.getElementById('btn-submit-transfer-request')
      ];
      const addProdBtn = document.querySelector('button[onclick="addDirectTransferItem()"]');
      if (addProdBtn) inputs.push(addProdBtn);

      if (!activeWarehouseId) {
        inputs.forEach(el => { if (el) el.disabled = true; });
        showToast('Please select a specific warehouse to transfer or request stock.', true);
      } else {
        inputs.forEach(el => { if (el && el !== document.getElementById('btn-submit-transfer-request')) el.disabled = false; });
        // Enable request button as well
        const reqBtn = document.getElementById('btn-submit-transfer-request');
        if (reqBtn) reqBtn.disabled = false;
      }
    };

    window.addDirectTransferItem = function() {
      if (!activeWarehouseId) return;
      const skuSelect = document.getElementById('direct-transfer-sku');
      const qtyInput = document.getElementById('direct-transfer-qty');
      const targetWhSelect = document.getElementById('direct-transfer-target-wh');

      if (!skuSelect || !qtyInput || !targetWhSelect) return;

      const sku = skuSelect.value;
      const qty = parseInt(qtyInput.value) || 0;
      const targetWhId = targetWhSelect.value;

      if (!sku) {
        showToast('Please select an item.', true);
        return;
      }
      if (qty <= 0) {
        showToast('Quantity must be greater than 0.', true);
        return;
      }
      if (!targetWhId) {
        showToast('Please select a target warehouse.', true);
        return;
      }

      // Check available stock in activeWarehouseId
      const inv = allInventory[sku];
      const avail = inv ? inv.available : 0;
      
      // Calculate current total quantity of this SKU in draft
      const draftTotal = directTransferDraft
        .filter(item => item.sku === sku)
        .reduce((sum, item) => sum + item.quantity, 0);

      if (avail < draftTotal + qty) {
        showToast(`Insufficient stock of ${sku}. Available: ${avail}, currently in draft: ${draftTotal}`, true);
        return;
      }

      const targetWh = fulfillmentWarehouses.find(w => w.id === targetWhId);

      // Add or merge into draft
      const existing = directTransferDraft.find(item => item.sku === sku && item.targetWarehouseId === targetWhId);
      if (existing) {
        existing.quantity += qty;
      } else {
        directTransferDraft.push({
          sku,
          quantity: qty,
          targetWarehouseId: targetWhId,
          targetWarehouseName: targetWh ? targetWh.name : 'Unknown'
        });
      }

      qtyInput.value = 1;
      renderDirectTransferItemsList();
    };

    window.removeDirectTransferItem = function(idx) {
      directTransferDraft.splice(idx, 1);
      renderDirectTransferItemsList();
    };

    window.renderDirectTransferItemsList = function() {
      const tbody = document.getElementById('direct-transfer-items-list');
      const submitBtn = document.getElementById('btn-submit-direct-transfer');
      if (!tbody) return;

      if (directTransferDraft.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted" style="padding: 1rem 0;">No products added yet.</td></tr>`;
        if (submitBtn) submitBtn.disabled = true;
        return;
      }

      tbody.innerHTML = directTransferDraft.map((item, idx) => `
        <tr>
          <td><code>${escFulfillment(item.sku)}</code></td>
          <td><strong>${item.quantity}</strong></td>
          <td>${escFulfillment(item.targetWarehouseName)}</td>
          <td style="text-align:right;">
            <button class="btn btn-danger btn-sm" style="padding: 0.15rem 0.4rem; font-size: 0.75rem;" onclick="removeDirectTransferItem(${idx})">Remove</button>
          </td>
        </tr>
      `).join('');

      if (submitBtn) submitBtn.disabled = false;
    };

    window.submitDirectTransfer = async function() {
      const btn = document.getElementById('btn-submit-direct-transfer');
      if (!btn || btn.disabled || directTransferDraft.length === 0) return;

      await wrapActionWithLoading(btn, async () => {
        if (!companyId) throw new Error('Company context is not initialized.');

        const { data: { user } } = await sb.auth.getSession();

        // 1. Process each item in draft
        for (const item of directTransferDraft) {
          // Double-check stock in active warehouse
          let invQ = sb.from('inventory').select('*').eq('sku', item.sku).eq('warehouse_id', activeWarehouseId);
          const { data: invRow, error: invErr } = await invQ;
          if (invErr || !invRow || invRow.length === 0) {
            throw new Error(`Inventory record not found for SKU ${item.sku} in current warehouse.`);
          }

          const currentInv = invRow[0];
          if (currentInv.available < item.quantity) {
            throw new Error(`Insufficient stock for SKU ${item.sku}. Available: ${currentInv.available}, requested: ${item.quantity}`);
          }

          // Deduct from source warehouse
          const { error: updErr } = await sb.from('inventory').update({
            available: currentInv.available - item.quantity
          }).eq('id', currentInv.id);
          if (updErr) throw updErr;

          // Insert approved warehouse_transfer row
          const { error: insErr } = await sb.from('warehouse_transfers').insert([{
            company_id: companyId,
            from_warehouse_id: activeWarehouseId,
            to_warehouse_id: item.targetWarehouseId,
            sku: item.sku,
            quantity: item.quantity,
            status: 'approved',
            requested_by: user?.id || null,
            approved_by: user?.id || null,
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          }]);
          if (insErr) throw insErr;
        }

        showToast('Stocks transferred and shipped successfully!');
        directTransferDraft = [];
        renderDirectTransferItemsList();
        await refreshDashboard();
      });
    };

    window.submitTransferRequest = async function() {
      const btn = document.getElementById('btn-submit-transfer-request');
      if (!btn || btn.disabled || !activeWarehouseId) return;

      const skuSelect = document.getElementById('request-transfer-sku');
      const qtyInput = document.getElementById('request-transfer-qty');
      const sourceWhSelect = document.getElementById('request-transfer-source-wh');

      if (!skuSelect || !qtyInput || !sourceWhSelect) return;

      const sku = skuSelect.value;
      const qty = parseInt(qtyInput.value) || 0;
      const sourceWhId = sourceWhSelect.value;

      if (!sku) {
        showToast('Please select an item.', true);
        return;
      }
      if (qty <= 0) {
        showToast('Quantity must be greater than 0.', true);
        return;
      }
      if (!sourceWhId) {
        showToast('Please select a source warehouse.', true);
        return;
      }

      await wrapActionWithLoading(btn, async () => {
        if (!companyId) throw new Error('Company context is not initialized.');

        const { data: { user } } = await sb.auth.getSession();

        // Insert pending warehouse_transfer row (requested_by is current user, target is activeWarehouseId, source is sourceWhId)
        const { error: insErr } = await sb.from('warehouse_transfers').insert([{
          company_id: companyId,
          from_warehouse_id: sourceWhId,
          to_warehouse_id: activeWarehouseId,
          sku: sku,
          quantity: qty,
          status: 'pending',
          requested_by: user?.id || null,
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString()
        }]);
        if (insErr) throw insErr;

        showToast('Transfer request submitted successfully!');
        qtyInput.value = 1;
        await refreshDashboard();
      });
    };

    

    

    

    

    // Run Initial Load
    init();
  </script>
