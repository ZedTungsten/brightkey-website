<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profit & Loss — Brightkey Statements</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg?v=2" />
  <style>
    /* ── Excel-style Table ── */
    .excel-container {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      margin-top: 1.5rem;
      overscroll-behavior: contain;
    }
    .excel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10pt;
      color: var(--text-primary);
      font-family: Arial, sans-serif;
    }
    .excel-table th, .excel-table td {
      border: 1px solid #d4d4d8;
      padding: 0.45rem 0.85rem;
      text-align: right;
    }
    .excel-table th {
      background: var(--bg-base, #fafafa);
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-size: 10pt;
      letter-spacing: 0.05em;
    }
    .excel-table thead {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #FAFAFA;
      isolation: isolate;
    }
    .excel-table thead th {
      position: relative;
      z-index: 21;
      background: #FAFAFA;
    }
    .excel-table td {
      background: var(--bg-surface) !important;
    }
    .excel-table th:first-child, .excel-table td:first-child {
      width: 90px;
      min-width: 90px;
      background: var(--bg-base, #fafafa) !important;
    }
    .excel-table th:first-child { text-align: center; }
    .excel-table th:nth-child(2), .excel-table td:nth-child(2) {
      text-align: left;
      font-weight: 600;
      background: var(--bg-base, #fafafa) !important;
      width: 280px;
    }
    .excel-table td.benchmark-cell { color: #71717a !important; font-weight: 500 !important; font-variant-numeric: tabular-nums; }
    .excel-table td.benchmark-cell.is-empty { text-align: center; }
    .benchmark-input { width: 100%; padding: 0.25rem 0.4rem; text-align: right; font-size: 0.8rem; color: #1e293b; background: #fefdf0; border: none; border-radius: 4px; outline: none; font-variant-numeric: tabular-nums; }
    .benchmark-input:focus { box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25); }
    .excel-table td.benchmark-ear {
      background-repeat: no-repeat !important;
      background-size: 10px 10px !important;
    }
    .excel-table td.benchmark-ear-top { background-position: top right !important; }
    .excel-table td.benchmark-ear-bottom { background-position: bottom right !important; }
    .excel-table td.benchmark-ear-top.benchmark-ear-green {
      background-image: linear-gradient(225deg, var(--success, #22c55e) 0 50%, transparent 50%) !important;
    }
    .excel-table td.benchmark-ear-top.benchmark-ear-red {
      background-image: linear-gradient(225deg, var(--danger, #ef4444) 0 50%, transparent 50%) !important;
    }
    .excel-table td.benchmark-ear-bottom.benchmark-ear-green {
      background-image: linear-gradient(315deg, var(--success, #22c55e) 0 50%, transparent 50%) !important;
    }
    .excel-table td.benchmark-ear-bottom.benchmark-ear-red {
      background-image: linear-gradient(315deg, var(--danger, #ef4444) 0 50%, transparent 50%) !important;
    }
    
    /* ── Hierarchy ── */
    .row-net-profit td {
      font-weight: 800 !important;
    }
    .row-gross-profit td {
      font-weight: 700 !important;
      border-top: 1px solid var(--text-primary) !important;
    }
    .row-group-header td {
      font-weight: 700 !important;
      text-transform: uppercase;
    }
    .row-group-header td:nth-child(2) {
      text-align: left;
    }
    .row-subgroup-header td {
      font-weight: 600 !important;
    }
    .row-subgroup-header td:nth-child(2) {
      text-align: left;
    }
    .row-net-margin td {
      font-weight: 400 !important;
      font-style: italic !important;
    }
    .row-gross-margin td {
      font-weight: 400 !important;
      font-style: italic !important;
    }
    .row-total td {
      font-weight: 700 !important;
      border-top: 1.5px solid var(--border) !important;
      border-bottom: 1.5px solid var(--border) !important;
    }
    .row-expenses td, .row-expenses td:first-child, .row-expenses td:nth-child(2) {
      font-weight: 700 !important;
      background: #fef2f2 !important; /* Very light red */
    }
    .row-cost-header td, .row-cost-header td:first-child, .row-cost-header td:nth-child(2) {
      background: #fff9f9 !important;
    }
    .row-revenue-header td, .row-revenue-header td:first-child, .row-revenue-header td:nth-child(2) {
      font-weight: 700 !important;
      text-transform: uppercase;
      background: #f0fdf4 !important; /* Very light green */
    }
    .row-revenue-header td:nth-child(2) {
      text-align: left;
    }
    .row-spacer td, .row-spacer td:first-child, .row-spacer td:nth-child(2) {
      border: none !important;
      padding: 0 !important;
      height: 10px !important;
      background: var(--bg-surface) !important;
    }
    .row-sub-subitem td {
      font-weight: 400 !important;
      color: var(--text-secondary) !important;
    }
    .row-sub-subitem td:nth-child(2) {
      font-weight: 400 !important;
      color: var(--text-secondary) !important;
    }
    .row-subitem td:nth-child(2) {
      font-weight: 400 !important;
    }
    .excel-table td.cell-pct {
      font-style: italic !important;
      color: var(--text-muted, #737373) !important;
    }
    .indent-1 {
      padding-left: 1.5rem !important;
    }
    .indent-2 {
      padding-left: 2.5rem !important;
    }
    .tooltip-container:hover .tooltip-text {
      visibility: visible !important;
      opacity: 1 !important;
    }

    /* ── Tab Container Bar ── */
    .drawer-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      background: var(--bg-surface);
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      padding: 0.9rem 1.25rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
      text-decoration: none;
    }
    .tab-btn.active {
      color: var(--cyan-light);
      border-bottom-color: var(--cyan);
    }
    .tab-btn:hover:not(.active) {
      color: var(--text-secondary);
    }

    .shimmer-row td {
      background: linear-gradient(90deg, var(--bg-surface) 25%, var(--bg-base) 50%, var(--bg-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .pl-page { padding: 2rem; }

    @media (min-width: 900px) {
      .profit-loss-page .dash-layout {
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
      }
      .profit-loss-page .dash-main {
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }
      .pl-page {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex: 1;
        overflow: hidden;
        padding: 1.5rem 1.5rem 4rem;
      }
      .pl-panel {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }
      .pl-toolbar { flex: 0 0 auto; }
      .excel-container {
        min-width: 0;
        min-height: 0;
        flex: 1;
      }
      .excel-table { min-height: 100%; }
      .excel-table tbody tr { height: 1px; }
    }
  </style>
</head>
<body class="bg-base text-primary profit-loss-page">
  <div class="dash-layout">
    <!-- Sidebar -->
    <aside class="dash-sidebar" id="dash-sidebar"></aside>

    <!-- Main Content Area -->
    <main class="dash-main">
      <header class="dash-topbar" style="border-bottom: none; height: auto; min-height: 60px; display: flex; flex-direction: column; align-items: stretch; justify-content: space-between; padding-top: 1rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem; padding-left: 2rem; margin-bottom: 0.75rem;">
          <h1 style="font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em;">Financial Statements</h1>
        </div>
        <!-- Tabs Component connected directly to header -->
        <div class="drawer-tabs" style="margin-bottom: 0; padding-left: 2rem; border-top: 1px solid var(--border);">
          <a href="/dashboard/statements/profit-and-loss" class="tab-btn active">Profit & Loss</a>
          <a href="/dashboard/statements/cashflow" class="tab-btn">Cashflow</a>
          <a href="/dashboard/statements/balance-sheet" class="tab-btn">Balance Sheet</a>

        <div class="pl-panel" style="background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm);">
          <div class="pl-toolbar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <h2 style="font-size: 1rem; font-weight: 700; color: var(--text-primary); margin: 0;">Profit & Loss Statement</h2>
              <div class="tooltip-container" style="position: relative; display: inline-block; cursor: pointer;">
                <div style="width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--text-muted); color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; line-height: 1;">?</div>
                <div class="tooltip-text" style="visibility: hidden; width: 280px; background-color: var(--bg-surface); color: var(--text-primary); text-align: left; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.75rem; position: absolute; z-index: 10; top: 125%; left: 0; box-shadow: var(--shadow-md); font-size: 0.76rem; line-height: 1.4; font-weight: 500;">

                <span id="benchmark-edit-btn-text">Edit Benchmarks</span>
              </button>
              <button id="btn-show-benchmarks" onclick="PLApp.toggleShowBenchmarks()" class="btn btn-outline btn-sm" aria-pressed="false" style="display: flex; align-items: center; gap: 0.4rem;">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                Show Benchmarks
              </button>
              <button id="btn-show-changes" onclick="PLApp.toggleShowChanges()" class="btn btn-outline btn-sm" aria-pressed="false" style="display: flex; align-items: center; gap: 0.4rem;">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17V7m0 0-4 4m4-4 4 4M17 7v10m0 0-4-4m4 4 4-4"/></svg>
                Show Changes
              </button>
              <button id="btn-lock-mode" onclick="PLApp.toggleLockMode()" class="btn btn-outline btn-sm" style="display: flex; align-items: center; gap: 0.4rem;">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Lock Months
              </button>

          <div class="excel-container">
            <table class="excel-table" id="pl-table">

                  <!-- Dynamic Month Headers -->
                </tr>

                <!-- Loading State Shimmer -->
                <tr class="shimmer-row">

  <!-- Supabase SDK, Auth & Sidebar -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/sidebar.js"></script>

  <script src="/dashboard/js/financial-calculators.js"></script>

  <script>
    (function() {
      'use strict';

      window.PLApp = {
        companyId: null,
        tenantId: null,
        months: [],
        products: [],
        bookings: [],
        employees: [],
        adjustments: [],
        deliveries: [],
        payoutSettings: null,
        lockedStatements: [],
        lockModeActive: false,
        benchmarks: {},
        benchmarkEditMode: false,
        showBenchmarks: false,
        showChanges: false,

        resolvePlanForMonth(s, targetMonthStr) {
          const subBills = this.softwareBilling.filter(b => b.subscription_id === s.id);
          const exactBill = subBills.find(b => b.billing_month === targetMonthStr);
          if (exactBill && exactBill.mode !== 'unsubscribed') {
            return { mode: exactBill.mode, cost_centavos: exactBill.cost_centavos };
          }

          if (s.mode === 'pay_as_you_go') {
            const subStartMonth = (s.subscribed_date || '').slice(0, 7);
            const targetMonth = targetMonthStr.slice(0, 7);
            if (subStartMonth === targetMonth) return { mode: 'pay_as_you_go', cost_centavos: s.cost_centavos };
            return { mode: 'pay_as_you_go', cost_centavos: 0 };
          }

          const pastBills = subBills.filter(b => b.billing_month <= targetMonthStr && b.mode !== 'unsubscribed');
          if (pastBills.length > 0) {
            pastBills.sort((a, b) => b.billing_month.localeCompare(a.billing_month));
            const latestBill = pastBills[0];
            if (latestBill.mode === 'pay_as_you_go') return { mode: 'pay_as_you_go', cost_centavos: 0 };
            return { mode: latestBill.mode, cost_centavos: latestBill.cost_centavos };
          }
          return { mode: s.mode, cost_centavos: s.cost_centavos };
        },

        getAssignedDoorsForEmployee(b, empId) {
          let doorsArr = [];
          if (b.doors) {
            if (typeof b.doors === 'string') {
              try { doorsArr = JSON.parse(b.doors); } catch(_) {}
            } else if (Array.isArray(b.doors)) {
              doorsArr = b.doors;
            }
          }

          let bInsts = [];
          if (b.installers) {
            if (typeof b.installers === 'string') {
              try { bInsts = JSON.parse(b.installers); } catch(_) {}
            } else if (Array.isArray(b.installers)) {
              bInsts = b.installers;
            }
          }

          const isBookingLevelInstaller = bInsts.some(inst => inst && inst.id === empId) || 
                                          (b.installer_id && b.installer_id.split(' | ').includes(empId));

          const bookingHasDoorLevelInstallers = doorsArr.some(d => d && Array.isArray(d.installers) && d.installers.some(inst => inst && (inst.id || inst.name)));

          const assignedDoors = [];

          if (doorsArr.length === 0) {
            if (isBookingLevelInstaller) {
              let roles = [];
              const matchedBInsts = bInsts.filter(inst => inst && inst.id === empId);
              if (matchedBInsts.length > 0) {
                matchedBInsts.forEach(inst => {
                  const r = inst.role || 'lead';
                  if (!roles.includes(r)) roles.push(r);
                });
              } else if (b.installer_id) {
                const ids = b.installer_id.split(' | ');
                const myIdIdx = ids.indexOf(empId);
                if (myIdIdx !== -1) {
                  roles.push(myIdIdx === 0 ? 'lead' : 'assist');
                }
              }
              if (roles.length === 0) roles.push('lead');
              
              let productsArr = [];
              if (b.products) {
                if (typeof b.products === 'string') {
                  try { productsArr = JSON.parse(b.products); } catch(_) {}
                } else if (Array.isArray(b.products)) {
                  productsArr = b.products;
                }
              }
              const skus = (b.product_skus || '').split(' | ').filter(Boolean);
              const activeSkus = productsArr.length > 0 
                ? productsArr.filter(p => !p.cancelled && p.sku !== 'ADD-ON LABOR').map(p => p.sku)
                : skus;

              assignedDoors.push({
                completed: b.status === 'done' || b.status === 'completed' || b.status === 'finished',
                roles: roles,
                skus: activeSkus,
                completed_at: b.updated_at || b.created_at || b.scheduled_date,
                scheduled_date: b.scheduled_date
              });
            }
            return assignedDoors;
          }

          let productsArr = [];
          if (b.products) {
            if (typeof b.products === 'string') {
              try { productsArr = JSON.parse(b.products); } catch(_) {}
            } else if (Array.isArray(b.products)) {
              productsArr = b.products;
            }
          }
          const skus = (b.product_skus || '').split(' | ');
          const anyDoorHasAttachedProducts = doorsArr.some(d => d && Array.isArray(d.products) && d.products.length > 0);
          const isSingleDoorGrouping = (doorsArr.length === 1 && productsArr.length > 0);
          const skuOccurrenceCount = new Map();

          doorsArr.forEach((door, index) => {
            let isAssignedToThisDoor = false;
            let roles = [];

            if (door && Array.isArray(door.installers)) {
              const matchedInsts = door.installers.filter(inst => inst && inst.id === empId);
              if (matchedInsts.length > 0) {
                isAssignedToThisDoor = true;
                matchedInsts.forEach(inst => {
                  const r = inst.role || 'lead';
                  if (!roles.includes(r)) roles.push(r);
                });
              }
            } else if (bookingHasDoorLevelInstallers) {
              isAssignedToThisDoor = false;
            } else {
              isAssignedToThisDoor = isBookingLevelInstaller;
              const matchedBInsts = bInsts.filter(inst => inst && inst.id === empId);
              if (matchedBInsts.length > 0) {
                matchedBInsts.forEach(inst => {
                  const r = inst.role || 'lead';
                  if (!roles.includes(r)) roles.push(r);
                });
              } else if (b.installer_id) {
                const ids = b.installer_id.split(' | ');
                const myIdIdx = ids.indexOf(empId);
                if (myIdIdx !== -1) {
                  roles.push(myIdIdx === 0 ? 'lead' : 'assist');
                }
              }
            }

            if (isAssignedToThisDoor) {
              const doorSkus = [];
              if (anyDoorHasAttachedProducts && door) {
                const attachedSkus = door.products || [];
                attachedSkus.forEach(sku => {
                  const matchingProds = productsArr.filter(p => p.sku === sku);
                  const occurrenceIndex = skuOccurrenceCount.get(sku) || 0;
                  const matchedProd = matchingProds[occurrenceIndex];
                  if (matchedProd && !matchedProd.cancelled) {
                    doorSkus.push(matchedProd.sku);
                  }
                  skuOccurrenceCount.set(sku, occurrenceIndex + 1);
                });
              } else if (isSingleDoorGrouping) {
                productsArr.forEach(p => {
                  if (p.sku !== 'ADD-ON LABOR' && !p.cancelled) {
                    doorSkus.push(p.sku);
                  }
                });
              } else {
                if (productsArr[index] && !productsArr[index].cancelled) {
                  doorSkus.push(productsArr[index].sku);
                } else if (skus[index]) {
                  doorSkus.push(skus[index]);
                }
              }

              assignedDoors.push({
                completed: Boolean(door.completed) || ['done', 'completed', 'finished'].includes(String(b.status || '').toLowerCase()),
                roles: roles,
                skus: doorSkus,
                completed_at: door.completed_at || b.updated_at || b.created_at || b.scheduled_date,
                scheduled_date: b.scheduled_date
              });
            } else {
              if (anyDoorHasAttachedProducts && door) {
                const attachedSkus = door.products || [];
                attachedSkus.forEach(sku => {
                  const occurrenceIndex = skuOccurrenceCount.get(sku) || 0;
                  skuOccurrenceCount.set(sku, occurrenceIndex + 1);
                });
              }
            }
          });

          return assignedDoors;
        },

        calculateMonthlyReport() {
          const monthlyValues = {};
          this.months.forEach(m => {
            monthlyValues[m.key] = {
              revenueBooking: 0,
              supplierCost: 0,
              installations: 0,
              commissions: 0,
              shipping: 0,
              gasAllowance: 0,
              packagingSupplies: 0,
              otherCogs: {},
              
              salaries: 0,
              adjustments: 0,
              softwareApps: 0,
              admin: { total: 0, details: {} },
              marketingSales: { total: 0, details: {} },
              operationsSupport: { total: 0, details: {} }
            };
          });

          const thresholdVal = this.payoutSettings.installations_before_crediting || 15;
          const leadWeight = this.payoutSettings.lead_credit !== undefined ? this.payoutSettings.lead_credit : 1.0;
          const assistWeight = this.payoutSettings.assist_credit !== undefined ? this.payoutSettings.assist_credit : 0.5;
          const ocularWeight = this.payoutSettings.ocular_credit !== undefined ? this.payoutSettings.ocular_credit : 0;
          const repairWeight = this.payoutSettings.repair_credit !== undefined ? this.payoutSettings.repair_credit : 0;
          const leadRateVal = this.payoutSettings.lead_rate || 1000;
          const assistRateVal = this.payoutSettings.assist_rate || 500;
          const ocularRateVal = this.payoutSettings.ocular_rate || 0;
          const repairRateVal = this.payoutSettings.repair_rate || 0;
          const extraServicesList = (this.payoutSettings.extra_services || []).map(es => {
            let sku = es.sku || es.name || '';
            if (sku === 'Welding Baseplate Metal') sku = 'BASEPLATE-M';
            if (sku === 'Welding Baseplate Stainless') sku = 'BASEPLATE-S';
            return { sku, rate: es.rate };
          });

          // 1. Process Bookings for Revenue & Supplier Cost
          this.bookings.forEach(b => {
            if (!b.scheduled_date) return;
            const bDate = new Date(b.scheduled_date);
            const mKey = `${bDate.getFullYear()}-${String(bDate.getMonth() + 1).padStart(2, '0')}`;
            if (!monthlyValues[mKey]) return;
            if (this.lockedStatements.some(ls => ls.month === mKey)) return;

            if (b.order_no && b.order_no.startsWith('ORD-')) {
              const grandTotal = parseInt(b.grand_total) || 0;
              const balanceDue = parseInt(b.balance_due) || 0;
              let depositCentavos = parseInt(b.deposit_amount) || 0;
              if (b.deduction_labels && b.deduction_values) {
                const dLabels = b.deduction_labels.split('|').map(s => s.trim().toLowerCase());
                const dValues = b.deduction_values.split('|').map(s => s.trim());
                dLabels.forEach((label, idx) => {
                  if (label.includes('deposit')) {
                    depositCentavos += Math.round((parseFloat(dValues[idx]) || 0) * 100);
                  }
                });
              }
              const absDepositCentavos = Math.abs(depositCentavos);
              const orderGrandTotal = grandTotal > 0 ? grandTotal : (balanceDue + absDepositCentavos);
              monthlyValues[mKey].revenueBooking += (orderGrandTotal + absDepositCentavos);
            }

          });

          this.months.forEach(month => {
            if (this.lockedStatements.some(statement => statement.month === month.key)) return;
            monthlyValues[month.key].supplierCost = window.BKFinancialCalculators.calculateSupplierCostMonth(
              this.inventoryCostLedger,
              this.supplierCostAdjustments,
              month.key
            ).total;
          });

          // 2. Installations
          this.months.forEach(m => {
            const mKey = m.key;
            if (this.lockedStatements.some(ls => ls.month === mKey)) return;
            const payoutRows = window.BKInstallerPayouts.calculateMonth({
              employees: this.employees,
              bookings: this.bookings,
              payoutSettings: this.payoutSettings,
              payoutSchedules: this.trackerConfig.payoutSchedules || [15, 30],
              monthKey: mKey,
              resolveAssignedDoors: (booking, employeeId) => this.getAssignedDoorsForEmployee(booking, employeeId)
            });
            monthlyValues[mKey].installations = Math.round(payoutRows.reduce((sum, row) => sum + row.total, 0) * 100);
          });

          // 3. Salaries, Specials, Commissions, Adjustments (Matching OPEX logic per employee)
          this.months.forEach(m => {
            const mKey = m.key;
            if (this.lockedStatements.some(ls => ls.month === mKey)) return;
            const opexSalaryRows = window.BKOpexSalaries.calculateMonth({
              employees: this.employees,
              payslipRecords: this.payslipRecords,
              payoutSchedules: this.trackerConfig.payoutSchedules || [],
              specialSchedules: this.trackerConfig.specialSchedules || [],
              regularPayoutState: this.regularPayoutState,
              specialPayoutState: this.specialPayoutState,
              monthKey: mKey
            });
            const salaryByEmployee = new Map(opexSalaryRows.map(row => [row.employee.id, row]));
            const adjustments = window.BKFinancialCalculators.calculateEmployeeAdjustmentsMonth(this.adjustmentsList, mKey);
            const commissions = window.BKFinancialCalculators.calculateCommissionMonth(this.employees, this.commissionAssignments, this.bookings, mKey);
            monthlyValues[mKey].adjustments = Math.round(adjustments.total * 100);
            monthlyValues[mKey].commissions = commissions.total;

            this.employees.forEach(emp => {
              const salaryRow = salaryByEmployee.get(emp.id);
              monthlyValues[mKey].salaries += Math.round((salaryRow?.total || 0) * 100);
            });
          });

          // 4. Shipping (Matching COGS logic 1-to-1 per month)
          this.months.forEach(m => {
            const mKey = m.key;
            if (this.lockedStatements.some(ls => ls.month === mKey)) return;
            monthlyValues[mKey].shipping = window.BKFinancialCalculators.calculateShippingMonth(
              this.dispatchedTxs,
              Object.values(this.deliveryFeeMap),
              mKey
            ).total;
          });

          // 5. General Ledger Mapping
          this.months.forEach(month => {
            if (this.lockedStatements.some(statement => statement.month === month.key)) return;
            const categories = window.BKFinancialCalculators.calculateJournalMonth(this.journalAccounts, this.generalJournal, month.key);
            const cogs = categories.COGS || { accounts: {} };
            Object.entries(cogs.accounts).forEach(([account, amount]) => {
              if (account.toLowerCase() === 'gas allowance') monthlyValues[month.key].gasAllowance += amount;
              else if (account.toLowerCase() === 'packaging supplies') monthlyValues[month.key].packagingSupplies += amount;
              else monthlyValues[month.key].otherCogs[account] = amount;
            });
            const assignOpex = (category, target) => {
              const result = categories[category] || { total: 0, accounts: {} };
              target.total = result.total;
              target.details = { ...result.accounts };
            };
            assignOpex('OPEX - Admin', monthlyValues[month.key].admin);
            assignOpex('OPEX - Marketing & Sales', monthlyValues[month.key].marketingSales);
            assignOpex('OPEX - Operations Support', monthlyValues[month.key].operationsSupport);
          });

          // 6. Software & Apps Subscriptions
          this.months.forEach(m => {
            const mKey = m.key;
            monthlyValues[mKey].softwareApps = window.BKFinancialCalculators.calculateSoftwareMonth(
              this.softwareSubscriptions,
              this.softwareBilling,
              mKey
            ).total;
          });

          // Merge locked statements
          const liveSoftwareApps = Object.fromEntries(
            Object.entries(monthlyValues).map(([month, values]) => [month, values.softwareApps])
          );
          if (this.lockedStatements && this.lockedStatements.length > 0) {
            this.lockedStatements.forEach(ls => {
              if (monthlyValues[ls.month]) {
                monthlyValues[ls.month] = {
                  ...ls.statement_data,
                  softwareApps: liveSoftwareApps[ls.month] ?? ls.statement_data.softwareApps
                };
              }
            });
          }

          return monthlyValues;
        },

        async init() {
          if (!window.BKAuth) return;
          const authInfo = await window.BKAuth.checkRoleGate(['Finance'], '../../admin.html');
          if (!authInfo) return;

          this.tenantId = authInfo.tenantId;
          const sb = window.BKAuth.sb;

          // Fetch company ID
          const { data: co } = await sb.from('companies').select('id').eq('tenant_id', this.tenantId).limit(1).maybeSingle();
          this.companyId = co?.id || null;

          if (!this.companyId) {
            console.error('Company not resolved.');
            return;
          }

          // Build last 6 months (latest first)
          const now = new Date();
          this.months = [];
          for (let i = 0; i < 6; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const label = d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            this.months.push({
              key,
              label,
              year: d.getFullYear(),
              month: d.getMonth() + 1,
              start: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`,
              end: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()}`
            });
          }

          await this.loadData();
        },

        async loadData() {
          const tbody = document.getElementById('table-body');
          if (tbody) {
            tbody.innerHTML = `
              <tr class="shimmer-row">
                <td style="text-align: left;">Fetching statements data...</td>
                <td></td><td></td><td></td><td></td><td></td><td></td>
              </tr>
            `;
          }

          const sb = window.BKAuth.sb;

          try {
            // Fetch locked statements and company benchmarks together.
            const [lockedResult, benchmarkResult] = await Promise.all([
              sb.from('locked_profit_loss_statements').select('month, statement_data').eq('company_id', this.companyId),
              sb.from('global_settings').select('value').eq('key', 'profit_loss_benchmarks').eq('company_id', this.companyId).maybeSingle()
            ]);
            const { data: lockedRes, error: lockedErr } = lockedResult;
            this.benchmarks = benchmarkResult.data?.value || {};
            if (benchmarkResult.error) console.error('Error fetching P&L benchmarks:', benchmarkResult.error);

            if (lockedErr) {
              console.error('Error fetching locked statements:', lockedErr);
            }
            this.lockedStatements = lockedRes || [];

            // Determine unlocked months range
            const unlockedMonths = this.months.filter(m => !this.lockedStatements.some(ls => ls.month === m.key));

            if (unlockedMonths.length === 0) {
              // All 6 months are locked! Skip fetching other tables
              this.products = [];
              this.bookings = [];
              this.employees = [];
              this.payslipRecords = [];
              this.dispatchedTxs = [];
              this.deliveryFeeMap = {};
              this.payoutSettings = {
                installations_before_crediting: 15,
                lead_credit: 1.0,
                assist_credit: 0.5,
                lead_rate: 1000,
                extra_services: []
              };
              this.trackerConfig = {};
              this.products = [];
              this.bookings = [];
              this.employees = [];
              this.payslipRecords = [];
              this.dispatchedTxs = [];
              this.deliveryFeeMap = {};
              this.payoutSettings = {};
              this.trackerConfig = {};
              this.commissionAssignments = [];
              this.adjustmentsList = [];
              this.reimbursementsList = [];
              this.journalAccounts = [];
              this.generalJournal = [];
              this.softwareSubscriptions = [];
              this.softwareBilling = [];
              this.regularPayoutState = {};
              this.specialPayoutState = {};
              this.inventoryCostLedger = [];
              this.supplierCostAdjustments = [];
            } else {
              // Find the range bounds for unlocked months
              const sortedUnlocked = [...unlockedMonths].sort((a, b) => a.key.localeCompare(b.key));
              const startRange = sortedUnlocked[0].start;
              const endRange = sortedUnlocked[sortedUnlocked.length - 1].end;
              const startMonthKey = sortedUnlocked[0].key;
              const endMonthKey = sortedUnlocked[sortedUnlocked.length - 1].key;
              const rolloverStartDate = new Date(`${startRange}T00:00:00`);
              rolloverStartDate.setMonth(rolloverStartDate.getMonth() - 1);
              const bookingStartRange = `${rolloverStartDate.getFullYear()}-${String(rolloverStartDate.getMonth() + 1).padStart(2, '0')}-01`;

              const [
                inventoryCostLedgerRes,
                bookingsRes,
                employeesRes,
                payslipRecordsRes,
                payoutSettingsRes,
                trackerConfigRes,
                commissionsRes,
                adjustmentsRes,
                reimbursementsRes,
                journalAccountsRes,
                generalJournalRes,
                softwareSubscriptionsRes,
                softwareBillingRes,
                regularPayoutStateRes,
                specialPayoutStateRes,
                dispatchedTxRes,
                deliveryRes,
                supplierCostAdjustmentsRes
              ] = await Promise.all([
                sb.from('inventory_cost_ledger')
                  .select('total_cost_centavos, recognized_at')
                  .eq('company_id', this.companyId)
                  .gte('recognized_at', startRange + 'T00:00:00')
                  .lte('recognized_at', endRange + 'T23:59:59.999999')
                  .order('recognized_at', { ascending: false })
                  .limit(sortedUnlocked.length * 5000),
                sb.from('installation_bookings')
                  .select('id, created_at, updated_at, scheduled_date, order_no, grand_total, deposit_amount, balance_due, deduction_labels, deduction_values, status, product_skus, product_qtys, doors, installers, installer_id, products')
                  .eq('company_id', this.companyId)
                  .neq('status', 'cancelled')
                  .gte('scheduled_date', bookingStartRange)
                  .lte('scheduled_date', endRange),
                sb.from('employees')
                  .select('id, email, first_name, last_name, salary, employment_status, date_hired')
                  .eq('company_id', this.companyId),
                sb.from('payslip_records')
                  .select('employee_id, payout_month, salary, basic_paid, commissions, special_payouts, total_payout, adjustments, adjustments_list')
                  .eq('company_id', this.companyId)
                  .gte('payout_month', startMonthKey)
                  .lte('payout_month', endMonthKey),
                sb.from('global_settings').select('value').eq('key', 'installer_payout_settings').eq('company_id', this.companyId).maybeSingle(),
                sb.from('global_settings').select('value').eq('key', 'salary_tracker_config').eq('company_id', this.companyId).maybeSingle(),
                sb.from('commission_assignments').select('amount, booking_id, employee_id, product_index').eq('company_id', this.companyId),
                sb.from('employee_adjustments').select('employee_id, amount, date').eq('company_id', this.companyId).gte('date', startRange).lte('date', endRange),
                sb.from('employee_reimbursements').select('employee_id, amount, date').eq('company_id', this.companyId).gte('date', startRange).lte('date', endRange),
                sb.from('journal_accounts').select('name, category').eq('company_id', this.companyId),
                sb.from('general_journal').select('account, debit, date').eq('company_id', this.companyId).gte('date', startRange).lte('date', endRange),
                sb.from('software_subscriptions').select('id, name, mode, cost_centavos, status, subscribed_date, unsubscribed_date').eq('company_id', this.companyId),
                sb.from('software_subscription_billing').select('subscription_id, billing_month, cost_centavos, mode').eq('company_id', this.companyId),
                sb.from('global_settings').select('value').eq('key', 'regular_payout_state').eq('company_id', this.companyId).maybeSingle(),
                sb.from('global_settings').select('value').eq('key', 'special_payout_state').eq('company_id', this.companyId).maybeSingle(),
                sb.from('inventory_transactions')
                  .select('reference_id, customer_name, timestamp_dispatched')
                  .eq('company_id', this.companyId)
                  .not('timestamp_dispatched', 'is', null)
                  .gte('timestamp_dispatched', startRange + 'T00:00:00')
                  .lte('timestamp_dispatched', endRange + 'T23:59:59'),
                sb.from('delivery_bookings')
                  .select('reference_id, customer_name, base_fee, tip_1, tip_2, toll')
                  .eq('company_id', this.companyId),
                sb.from('supplier_cost_adjustments')
                  .select('*')
                  .eq('company_id', this.companyId)
                  .gte('adjustment_date', startRange)
                  .lte('adjustment_date', endRange)
              ]);

              if (inventoryCostLedgerRes.error) throw inventoryCostLedgerRes.error;
              this.inventoryCostLedger = inventoryCostLedgerRes.data || [];
              this.bookings = bookingsRes.data || [];
              this.employees = employeesRes.data || [];
              this.payslipRecords = payslipRecordsRes.data || [];
              this.dispatchedTxs = dispatchedTxRes?.data || [];
              this.deliveryFeeMap = {};
              (deliveryRes?.data || []).forEach(db => {
                this.deliveryFeeMap[db.reference_id] = db;
              });
              this.supplierCostAdjustments = supplierCostAdjustmentsRes.data || [];

              this.payoutSettings = payoutSettingsRes.data?.value || {
                installations_before_crediting: 15,
                lead_credit: 1.0,
                adjust_credit: 0.5, // Note: assist_credit fallback in calculateMonthlyReport
                lead_rate: 1000,
                extra_services: []
              };
              this.trackerConfig = trackerConfigRes.data?.value || {};
              this.commissionAssignments = commissionsRes.data || [];
              this.adjustmentsList = adjustmentsRes.data || [];
              this.reimbursementsList = reimbursementsRes.data || [];
              this.journalAccounts = journalAccountsRes.data || [];
              this.generalJournal = generalJournalRes.data || [];
              this.softwareSubscriptions = softwareSubscriptionsRes.data || [];
              this.softwareBilling = softwareBillingRes.data || [];
              this.regularPayoutState = regularPayoutStateRes.data?.value || {};
              this.specialPayoutState = specialPayoutStateRes.data?.value || {};
            }

            this.renderStatement();

          } catch (err) {
            console.error('Error loading P&L data:', err);
            if (tbody) {
              tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger);">Failed to load data: ${err.message}</td></tr>`;
            }
          }
        },

        renderStatement() {
          const actionRow = document.getElementById('action-header-row');
          if (this.lockModeActive) {
            actionRow.style.display = 'table-row';
            actionRow.innerHTML = '<th></th><th></th>' + this.months.map(m => {
              const isLocked = this.lockedStatements.some(ls => ls.month === m.key);
              if (isLocked) {
                return `
                  <th colspan="2" style="text-align: center; background: var(--bg-base); padding: 0.45rem 0.85rem;">
                    <button onclick="PLApp.unlockMonth('${m.key}')" class="btn btn-sm" style="display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; background: rgba(6, 182, 212, 0.15); border: 1px solid var(--cyan); color: var(--cyan-light); cursor: pointer; padding: 0.35rem 0.65rem; border-radius: var(--radius-sm); font-weight: 600; width: 100%; justify-content: center; box-sizing: border-box;">
                      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                      Locked
                    </button>
                  </th>
                `;
              } else {
                return `
                  <th colspan="2" style="text-align: center; background: var(--bg-base); padding: 0.45rem 0.85rem;">
                    <button onclick="PLApp.lockMonth('${m.key}')" class="btn btn-outline btn-sm" style="display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; cursor: pointer; padding: 0.35rem 0.65rem; border-radius: var(--radius-sm); font-weight: 600; width: 100%; justify-content: center; box-sizing: border-box;">
                      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
                      Lock
                    </button>
                  </th>
                `;
              }
            }).join('');
          } else {
            actionRow.style.display = 'none';
          }

          const lockModeBtn = document.getElementById('btn-lock-mode');
          if (lockModeBtn) {
            if (this.lockModeActive) {
              lockModeBtn.style.background = 'var(--cyan)';
              lockModeBtn.style.color = '#fff';
              lockModeBtn.style.borderColor = 'var(--cyan)';
            } else {
              lockModeBtn.style.background = '';
              lockModeBtn.style.color = '';
              lockModeBtn.style.borderColor = '';
            }
          }

          const headerRow = document.getElementById('table-header-row');
          headerRow.innerHTML = '<th>BM</th><th>Line Item</th>' + this.months.map(m => {
            const isLocked = this.lockedStatements.some(ls => ls.month === m.key);
            const lockIcon = isLocked
              ? `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:4px;opacity:0.75;flex-shrink:0;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`
              : '';
            const bgStyle = isLocked ? 'background: #E4F4F7;' : '';
            return `<th colspan="2" style="text-align: center; ${bgStyle}"><span style="display:inline-flex;align-items:center;justify-content:center;">${lockIcon}${m.label}</span></th>`;
          }).join('');

          // 1. Calculate Monthly Values locally
          const monthlyValues = this.calculateMonthlyReport();

          // 3. Render Table
          const formatPHP = (cents) => {
            if (cents === 0) return '—';
            const val = Math.abs(cents) / 100;
            const formattedVal = window.BKCurrency
              ? window.BKCurrency.format(val)
              : `₱${val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            return cents < 0 ? `(${formattedVal})` : formattedVal;
          };

          const formatPercent = (nom, den) => {
            if (!den || den === 0) return '—';
            const val = (nom / den) * 100;
            const absVal = Math.abs(val);
            const formattedVal = `${absVal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%`;
            return val < 0 ? `(${formattedVal})` : formattedVal;
          };

          const tbody = document.getElementById('table-body');
          tbody.innerHTML = '';
          const benchmarkCell = (key) => `<td class="benchmark-cell" data-benchmark-key="${encodeURIComponent(key)}"></td>`;

          // Sub-item list builder helper
          const rowHtml = (title, getterFn, className = '', indent = 0, denominatorFn = null, benchmarkKey = title) => {
            const cells = this.months.map(m => {
              const mv = monthlyValues[m.key];
              const cents = getterFn(mv) || 0;
              const den = denominatorFn ? denominatorFn(mv) : getRevenue(mv);
              
              let valCell = `<td>${formatPHP(cents)}</td>`;
              let pctCell = `<td class="cell-pct">${formatPercentVal(cents, den)}</td>`;
              
              if (className.includes('margin')) {
                valCell = `<td>—</td>`;
                pctCell = `<td class="cell-pct">${cents}</td>`;
              }
              
              return valCell + pctCell;
            }).join('');
            return `<tr class="${className}">
              ${benchmarkCell(benchmarkKey)}
              <td class="indent-${indent}">${title}</td>
              ${cells}
            </tr>`;
          };

          const formatPercentVal = (nom, den) => {
            if (!den || den === 0) return '—';
            const val = (nom / den) * 100;
            const absVal = Math.abs(val);
            const formattedVal = `${absVal.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%`;
            return val < 0 ? `(${formattedVal})` : formattedVal;
          };

          // Helper definitions
          const getRevenue = (mv) => mv.revenueBooking;
          const getCogs = (mv) => {
            const otherCogsSum = Object.values(mv.otherCogs).reduce((a, b) => a + b, 0);
            return mv.supplierCost + mv.installations + mv.commissions + mv.shipping + mv.gasAllowance + mv.packagingSupplies + otherCogsSum;
          };
          const getOpex = (mv) => {
            return mv.salaries + mv.adjustments + mv.softwareApps + mv.admin.total + mv.marketingSales.total + mv.operationsSupport.total;
          };
          const getExpenses = (mv) => getCogs(mv) + getOpex(mv);
          const getNetProfit = (mv) => getRevenue(mv) - getCogs(mv) - getOpex(mv);
          const getGrossProfit = (mv) => getRevenue(mv) - getCogs(mv);

          // Net Profit Row
          const renderNetProfitRow = () => {
            const cells = this.months.map(m => {
              const mv = monthlyValues[m.key];
              const np = getNetProfit(mv);
              const rev = getRevenue(mv);
              return `<td>${formatPHP(np)}</td><td class="cell-pct">${formatPercentVal(np, rev)}</td>`;
            }).join('');
            return `<tr class="row-net-profit">
              ${benchmarkCell('Net Profit')}
              <td>Net Profit</td>
              ${cells}
            </tr>`;
          };

          // Gross Profit Row
          const renderGrossProfitRow = () => {
            const cells = this.months.map(m => {
              const mv = monthlyValues[m.key];
              const gp = getGrossProfit(mv);
              const rev = getRevenue(mv);
              return `<td>${formatPHP(gp)}</td><td class="cell-pct">${formatPercentVal(gp, rev)}</td>`;
            }).join('');
            return `<tr class="row-gross-profit">
              ${benchmarkCell('Gross Profit')}
              <td>Gross Profit</td>
              ${cells}
            </tr>`;
          };

          let html = '';

          // Net Profit & Gross Profit margins at the top
          html += renderNetProfitRow();
          html += renderGrossProfitRow();

          // Spacer gap: gross margin and revenue
          html += `<tr class="row-spacer"><td colspan="14"></td></tr>`;

          // Revenue Header
          const revenueHeaderCells = this.months.map(m => {
            const mv = monthlyValues[m.key];
            const val = getRevenue(mv);
            const rev = getRevenue(mv);
            return `<td>${formatPHP(val)}</td><td class="cell-pct">${formatPercentVal(val, rev)}</td>`;
          }).join('');
          html += `<tr class="row-group-header row-revenue-header">${benchmarkCell('Revenue')}<td>Revenue</td>${revenueHeaderCells}</tr>`;
          html += rowHtml('Booking', (mv) => mv.revenueBooking, 'row-subitem', 1);

          // Spacer gap: booking and expenses
          html += `<tr class="row-spacer"><td colspan="14"></td></tr>`;

          // Expenses (Consolidated COGS + OPEX, ALL CAPS, very light red)
          html += rowHtml('EXPENSES', (mv) => getExpenses(mv), 'row-expenses', 0);

          // COGS Header
          const cogsHeaderCells = this.months.map(m => {
            const mv = monthlyValues[m.key];
            const val = getCogs(mv);
            const rev = getRevenue(mv);
            return `<td>${formatPHP(val)}</td><td class="cell-pct">${formatPercentVal(val, rev)}</td>`;
          }).join('');
          html += `<tr class="row-group-header row-cost-header">${benchmarkCell('COGS')}<td>COGS</td>${cogsHeaderCells}</tr>`;
          html += rowHtml('Supplier Cost', (mv) => mv.supplierCost, 'row-subitem', 1);
          html += rowHtml('Installations', (mv) => mv.installations, 'row-subitem', 1);
          html += rowHtml('Commissions', (mv) => mv.commissions, 'row-subitem', 1);
          html += rowHtml('Shipping', (mv) => mv.shipping, 'row-subitem', 1);
          html += rowHtml('Gas Allowance', (mv) => mv.gasAllowance, 'row-subitem', 1);
          html += rowHtml('Packaging Supplies', (mv) => mv.packagingSupplies, 'row-subitem', 1);

          // Additional dynamic COGS items
          const allOtherCogsKeys = new Set();
          this.months.forEach(m => {
            Object.keys(monthlyValues[m.key].otherCogs).forEach(k => allOtherCogsKeys.add(k));
          });
          const sortedOtherCogs = [...allOtherCogsKeys].sort();
          sortedOtherCogs.forEach(item => {
            html += rowHtml(item, (mv) => mv.otherCogs[item] || 0, 'row-subitem', 1, null, `COGS:${item}`);
          });

          // OPEX Header
          const opexHeaderCells = this.months.map(m => {
            const mv = monthlyValues[m.key];
            const val = getOpex(mv);
            const gp = getGrossProfit(mv);
            return `<td>${formatPHP(val)}</td><td class="cell-pct">${formatPercentVal(val, gp)}</td>`;
          }).join('');
          html += `<tr class="row-group-header row-cost-header">${benchmarkCell('OPEX')}<td>OPEX</td>${opexHeaderCells}</tr>`;
          html += rowHtml('Salaries', (mv) => mv.salaries, 'row-subitem', 1, getGrossProfit);
          html += rowHtml('Adjustments', (mv) => mv.adjustments, 'row-subitem', 1, getGrossProfit);
          html += rowHtml('Software & Apps', (mv) => mv.softwareApps, 'row-subitem', 1, getGrossProfit);

          // Admin Sub-section
          const adminHeaderCells = this.months.map(m => {
            const mv = monthlyValues[m.key];
            const val = mv.admin.total;
            const gp = getGrossProfit(mv);
            return `<td>${formatPHP(val)}</td><td class="cell-pct">${formatPercentVal(val, gp)}</td>`;
          }).join('');
          html += `<tr class="row-subgroup-header">${benchmarkCell('Admin')}<td class="indent-1">Admin</td>${adminHeaderCells}</tr>`;
          const allAdminKeys = new Set();
          this.months.forEach(m => {
            Object.keys(monthlyValues[m.key].admin.details).forEach(k => allAdminKeys.add(k));
          });
          const sortedAdmin = [...allAdminKeys].sort();
          sortedAdmin.forEach(item => {
            html += rowHtml(item, (mv) => mv.admin.details[item] || 0, 'row-sub-subitem', 2, getGrossProfit, `Admin:${item}`);
          });

          // Marketing & Sales Sub-section
          const marketingHeaderCells = this.months.map(m => {
            const mv = monthlyValues[m.key];
            const val = mv.marketingSales.total;
            const gp = getGrossProfit(mv);
            return `<td>${formatPHP(val)}</td><td class="cell-pct">${formatPercentVal(val, gp)}</td>`;
          }).join('');
          html += `<tr class="row-subgroup-header">${benchmarkCell('Marketing & Sales')}<td class="indent-1">Marketing &amp; Sales</td>${marketingHeaderCells}</tr>`;
          const allMarketingKeys = new Set();
          this.months.forEach(m => {
            Object.keys(monthlyValues[m.key].marketingSales.details).forEach(k => allMarketingKeys.add(k));
          });
          const sortedMarketing = [...allMarketingKeys].sort();
          sortedMarketing.forEach(item => {
            html += rowHtml(item, (mv) => mv.marketingSales.details[item] || 0, 'row-sub-subitem', 2, getGrossProfit, `Marketing & Sales:${item}`);
          });

          // Operations & Support Sub-section
          const opsHeaderCells = this.months.map(m => {
            const mv = monthlyValues[m.key];
            const val = mv.operationsSupport.total;
            const gp = getGrossProfit(mv);
            return `<td>${formatPHP(val)}</td><td class="cell-pct">${formatPercentVal(val, gp)}</td>`;
          }).join('');
          html += `<tr class="row-subgroup-header">${benchmarkCell('Operations & Support')}<td class="indent-1">Operations &amp; Support</td>${opsHeaderCells}</tr>`;
          const allOpsKeys = new Set();
          this.months.forEach(m => {
            Object.keys(monthlyValues[m.key].operationsSupport.details).forEach(k => allOpsKeys.add(k));
          });
          const sortedOps = [...allOpsKeys].sort();
          sortedOps.forEach(item => {
            html += rowHtml(item, (mv) => mv.operationsSupport.details[item] || 0, 'row-sub-subitem', 2, getGrossProfit, `Operations & Support:${item}`);
          });

          tbody.innerHTML = html;
          this.renderBenchmarkCells();
          this.applyBenchmarkIndicators();
          this.applyChangeIndicators();
        },

        formatBenchmarkValue(raw) {
          const value = String(raw || '').trim();
          if (!value) return '—';
          if (value.includes('%')) return value.replace(/\s*(?:-|–|—|to)\s*/i, ' – ');
          const currencySymbol = window.BKCurrency?.symbol || '₱';
          const parts = value.replace(currencySymbol, '').replace(/,/g, '').split(/\s*(?:-|–|—|to)\s*/i);
          if (parts.length > 0 && parts.length <= 2 && parts.every(part => part !== '' && Number.isFinite(Number(part)))) {
            return parts.map(part => window.BKCurrency
              ? window.BKCurrency.format(Number(part))
              : `₱${Number(part).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`).join(' – ');
          }
          return value;
        },

        renderBenchmarkCells() {
          document.querySelectorAll('td[data-benchmark-key]').forEach(cell => {
            const key = decodeURIComponent(cell.dataset.benchmarkKey);
            const raw = this.benchmarks[key] || '';
            cell.classList.toggle('is-empty', !String(raw).trim());
            cell.replaceChildren();
            if (this.benchmarkEditMode) {
              const input = document.createElement('input');
              input.type = 'text';
              input.className = 'benchmark-input';
              input.value = raw;
              input.placeholder = '% or value';
              input.setAttribute('aria-label', `${key} benchmark`);
              cell.appendChild(input);
            } else {
              cell.textContent = this.formatBenchmarkValue(raw);
            }
          });
          const btn = document.getElementById('btn-edit-benchmarks');
          const label = document.getElementById('benchmark-edit-btn-text');
          if (btn && label) {
            label.textContent = this.benchmarkEditMode ? 'Save' : 'Edit Benchmarks';
            btn.style.borderColor = this.benchmarkEditMode ? 'var(--cyan)' : '';
            btn.style.color = this.benchmarkEditMode ? 'var(--cyan-light)' : '';
            btn.style.background = this.benchmarkEditMode ? 'var(--cyan-dim)' : '';
          }
          const showBtn = document.getElementById('btn-show-benchmarks');
          if (showBtn) {
            showBtn.setAttribute('aria-pressed', String(this.showBenchmarks));
            showBtn.style.background = this.showBenchmarks ? 'var(--cyan)' : '';
            showBtn.style.color = this.showBenchmarks ? '#fff' : '';
            showBtn.style.borderColor = this.showBenchmarks ? 'var(--cyan)' : '';
          }
          const changesBtn = document.getElementById('btn-show-changes');
          if (changesBtn) {
            changesBtn.setAttribute('aria-pressed', String(this.showChanges));
            changesBtn.style.background = this.showChanges ? 'var(--cyan)' : '';
            changesBtn.style.color = this.showChanges ? '#fff' : '';
            changesBtn.style.borderColor = this.showChanges ? 'var(--cyan)' : '';
          }
        },

        parseBenchmark(raw) {
          const value = String(raw || '').trim();
          if (!value) return null;
          const isPercent = value.includes('%');
          const currencySymbol = window.BKCurrency?.symbol || '₱';
          const parts = value.replace(currencySymbol, '').replace(/[,%]/g, '').split(/\s*(?:-|–|—|to)\s*/i)
            .map(part => Number(part.trim()))
            .filter(Number.isFinite);
          if (!parts.length) return null;
          const lower = Math.min(...parts.slice(0, 2));
          const upper = Math.max(...parts.slice(0, 2));
          return { type: isPercent ? 'percent' : 'value', lower, upper };
        },

        parseDisplayedMetric(cell) {
          const text = String(cell?.textContent || '').trim();
          if (!text || text === '—') return null;
          const currencySymbol = window.BKCurrency?.symbol || '₱';
          const number = Number(text.replace(currencySymbol, '').replace(/[,%(),]/g, ''));
          if (!Number.isFinite(number)) return null;
          return text.startsWith('(') ? -number : number;
        },

        applyBenchmarkIndicators() {
          const markerClasses = ['benchmark-ear', 'benchmark-ear-top', 'benchmark-ear-bottom', 'benchmark-ear-green', 'benchmark-ear-red'];
          document.querySelectorAll('#table-body td').forEach(cell => cell.classList.remove(...markerClasses));
          if (!this.showBenchmarks || this.benchmarkEditMode) return;

          let expenseSection = false;
          document.querySelectorAll('#table-body tr').forEach(row => {
            if (row.classList.contains('row-expenses')) expenseSection = true;
            if (row.classList.contains('row-spacer')) return;
            const benchmarkCell = row.querySelector('td[data-benchmark-key]');
            if (!benchmarkCell) return;
            const key = decodeURIComponent(benchmarkCell.dataset.benchmarkKey);
            const benchmark = this.parseBenchmark(this.benchmarks[key]);
            if (!benchmark) return;

            [...row.cells].slice(2).forEach((cell, index) => {
              const isPercentCell = index % 2 === 1;
              if ((benchmark.type === 'percent') !== isPercentCell) return;
              const metric = this.parseDisplayedMetric(cell);
              if (metric === null || (metric >= benchmark.lower && metric <= benchmark.upper)) return;
              const isAbove = metric > benchmark.upper;
              const isGood = expenseSection ? !isAbove : isAbove;
              cell.classList.add(
                'benchmark-ear',
                isAbove ? 'benchmark-ear-top' : 'benchmark-ear-bottom',
                isGood ? 'benchmark-ear-green' : 'benchmark-ear-red'
              );
            });
          });
        },

        toggleShowBenchmarks() {
          this.showBenchmarks = !this.showBenchmarks;
          if (this.showBenchmarks) this.showChanges = false;
          this.renderBenchmarkCells();
          this.applyBenchmarkIndicators();
          this.applyChangeIndicators();
        },

        applyChangeIndicators() {
          const markerClasses = ['change-ear', 'benchmark-ear', 'benchmark-ear-top', 'benchmark-ear-bottom', 'benchmark-ear-green', 'benchmark-ear-red'];
          document.querySelectorAll('.change-ear').forEach(cell => cell.classList.remove(...markerClasses));
          if (!this.showChanges || this.benchmarkEditMode) return;

          let expenseSection = false;
          document.querySelectorAll('#table-body tr').forEach(row => {
            if (row.classList.contains('row-expenses')) expenseSection = true;
            if (row.classList.contains('row-spacer')) return;
            for (let monthIndex = 0; monthIndex < this.months.length - 1; monthIndex++) {
              const currentPercentCell = row.cells[3 + (monthIndex * 2)];
              const previousPercentCell = row.cells[3 + ((monthIndex + 1) * 2)];
              const current = this.parseDisplayedMetric(currentPercentCell);
              const previous = this.parseDisplayedMetric(previousPercentCell);
              if (current === null || previous === null || current === previous) continue;
              const isIncrease = current > previous;
              const isGood = expenseSection ? !isIncrease : isIncrease;
              currentPercentCell.classList.add(
                'change-ear',
                'benchmark-ear',
                isIncrease ? 'benchmark-ear-top' : 'benchmark-ear-bottom',
                isGood ? 'benchmark-ear-green' : 'benchmark-ear-red'
              );
            }
          });
        },

        toggleShowChanges() {
          this.showChanges = !this.showChanges;
          if (this.showChanges) this.showBenchmarks = false;
          this.renderBenchmarkCells();
          this.applyBenchmarkIndicators();
          this.applyChangeIndicators();
        },

        async toggleBenchmarkEdit() {
          if (!this.benchmarkEditMode) {
            this.benchmarkEditMode = true;
            this.renderStatement();
            return;
          }
          const btn = document.getElementById('btn-edit-benchmarks');
          const label = document.getElementById('benchmark-edit-btn-text');
          const next = { ...this.benchmarks };
          document.querySelectorAll('td[data-benchmark-key]').forEach(cell => {
            const key = decodeURIComponent(cell.dataset.benchmarkKey);
            const value = cell.querySelector('.benchmark-input')?.value.trim() || '';
            if (value) next[key] = value;
            else delete next[key];
          });
          if (btn) btn.disabled = true;
          if (label) label.textContent = 'Saving...';
          try {
            const { error } = await window.BKAuth.sb.from('global_settings').upsert({
              company_id: this.companyId,
              key: 'profit_loss_benchmarks',
              value: next
            }, { onConflict: 'company_id,key' });
            if (error) throw error;
            this.benchmarks = next;
            this.benchmarkEditMode = false;
            this.renderStatement();
            Toast.show('Benchmarks saved.', 'success');
          } catch (error) {
            console.error('Error saving P&L benchmarks:', error);
            Toast.show('Benchmarks could not be saved. Please try again.', 'error');
            if (label) label.textContent = 'Save';
          } finally {
            if (btn) btn.disabled = false;
          }
        },

        toggleLockMode() {
          this.lockModeActive = !this.lockModeActive;
          this.renderStatement();
        },

        async lockMonth(monthKey) {
          const sb = window.BKAuth.sb;
          const monthlyValues = this.calculateMonthlyReport();
          const targetData = monthlyValues[monthKey];

          if (!targetData) {
            console.error('No statement data found for month', monthKey);
            Toast.show('No statement data found for ' + monthKey, 'error');
            return;
          }

          const { error } = await sb
            .from('locked_profit_loss_statements')
            .upsert({
              company_id: this.companyId,
              month: monthKey,
              statement_data: targetData
            }, { onConflict: 'company_id,month' });

          if (error) {
            console.error('Error locking month:', error);
            Toast.show('Could not lock month. Please try again.', 'error');
          } else {
            Toast.show('Locked month ' + monthKey + ' successfully.', 'success');
            await this.loadData();
          }
        },

        async unlockMonth(monthKey) {
          const sb = window.BKAuth.sb;

          const { error } = await sb
            .from('locked_profit_loss_statements')
            .delete()
            .eq('company_id', this.companyId)
            .eq('month', monthKey);

          if (error) {
            console.error('Error unlocking month:', error);
            Toast.show('Could not unlock month. Please try again.', 'error');
          } else {
            Toast.show('Unlocked month ' + monthKey + ' successfully.', 'success');
            await this.loadData();
          }
        }
      };

      document.addEventListener('DOMContentLoaded', () => {
        PLApp.init();
      });
    })();
  </script>
</body>
</html>
