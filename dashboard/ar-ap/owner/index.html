<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner — Brightkey Finance</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
  <style>
    /* ── Month Navigation ── */
    .month-nav-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.5rem 1rem;
    }
    .month-nav-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .month-nav-btn:hover {
      background: var(--bg-base);
      border-color: var(--text-secondary);
    }
    .month-display-label {
      font-size: 0.9rem;
      font-weight: 700;
      min-width: 120px;
      text-align: center;
    }
    .owner-report-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .owner-filter {
      width: 220px;
      height: 46px;
      font-size: 0.85rem;
    }

    /* ── Excel-style Table ── */
    .excel-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      margin-top: 0;
      max-height: 400px;
      overflow-y: auto;
      transition: max-height 0.25s ease-out;
    }
    .excel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10pt;
      color: var(--text-primary);
      font-family: 'commissioner', sans-serif;
    }
    .excel-table th, .excel-table td {
      border: 1px solid var(--border);
      padding: 0.35rem 0.6rem;
    }
    .excel-table th {
      background: var(--bg-base, #fafafa);
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-size: 10pt;
      letter-spacing: 0.05em;
      text-align: left;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: inset 0 -1px 0 var(--border);
    }
    .excel-table td {
      text-align: left;
    }
    .excel-table td.num-col {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .excel-table th.num-col {
      text-align: right;
    }
    .excel-table th:first-child, .excel-table td:first-child {
      text-align: center;
      font-weight: 600;
      background: var(--bg-base, #fafafa);
    }
    .excel-table tr.total-row td {
      font-weight: 700 !important;
      background: var(--bg-base, #fafafa) !important;
      border-top: 2px solid var(--text-primary) !important;
      border-bottom: 2px double var(--text-primary) !important;
      position: sticky;
      bottom: 0;
      z-index: 9;
      box-shadow: 0 -2px 6px rgba(9, 9, 11, 0.08);
    }

    /* ── Tab Container Bar ── */
    .drawer-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      background: var(--bg-surface);
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      padding: 0.9rem 1.25rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
      text-decoration: none;
    }
    .tab-btn.active {
      color: var(--cyan-light);
      border-bottom-color: var(--cyan);
    }
    .tab-btn:hover:not(.active) {
      color: var(--text-secondary);
    }
    .owner-subtabs { margin: 0; padding-left: 2rem; border-top: 0; }
    .owner-subtabs .tab-btn { padding-top: 0.65rem; padding-bottom: 0.65rem; font-size: 0.78rem; }
    .owner-subtabs .tab-btn[aria-selected="true"] { color: var(--cyan-light); border-bottom-color: var(--cyan); }
    .owner-view[hidden] { display: none; }
    .accrual-card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 1.5rem; box-shadow: var(--shadow-sm);
    }
    .accrual-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .accrual-header__left, .accrual-header__actions { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .accrual-owner-filter { width: 240px; }
    .accrual-range { min-width: 120px; text-align: center; font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); }
    .accrual-table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); }
    .accrual-table { width: 100%; min-width: 860px; border-collapse: collapse; font-size: 0.82rem; }
    .accrual-table th, .accrual-table td { border: 1px solid var(--border); padding: 0.55rem 0.75rem; text-align: right; }
    .accrual-table th { background: var(--bg-base); color: var(--text-secondary); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; }
    .accrual-table th:first-child, .accrual-table td:first-child { text-align: left; min-width: 220px; background: var(--bg-base); font-weight: 600; position: sticky; left: 0; z-index: 2; }
    .accrual-table .accrual-actions th { padding: 0.45rem 0.6rem; text-align: center; }
    .accrual-table .is-locked { background: rgba(6, 182, 212, 0.09); }
    .accrual-table .is-prestart { background: #f4f4f5 !important; color: #a1a1aa !important; }
    .accrual-table .calculation-limit { color: var(--danger); font-size: 0.68rem; font-weight: 700; white-space: nowrap; }
    .accrual-table .total-row td { font-weight: 800; border-top: 2px solid var(--text-primary); }
    .accrual-empty { padding: 2.5rem 1rem; text-align: center; color: var(--text-muted); font-style: italic; }

    .shimmer-row td {
      background: linear-gradient(90deg, var(--bg-surface) 25%, var(--bg-base) 50%, var(--bg-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (max-width: 700px) {
      .owner-report-controls { width: 100%; align-items: stretch; flex-direction: column; }
      .owner-filter { width: 100%; }
    }
  </style>
</head>
<body class="bg-base text-primary">
  <div class="dash-layout">
    <aside class="dash-sidebar" id="dash-sidebar"></aside>

    <main class="dash-main">
      <header class="dash-topbar" style="border-bottom: none; height: auto; min-height: 60px; display: flex; flex-direction: column; align-items: stretch; justify-content: space-between; padding-top: 1rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem; padding-left: 2rem; margin-bottom: 0.75rem;">
          <h1 style="font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em;">AR/AP</h1>
        </div>
        <div class="drawer-tabs" style="margin-bottom: 0; padding-left: 2rem; border-top: 1px solid var(--border);">
          <a href="/dashboard/ar-ap/customers" class="tab-btn">Customers</a>
          <a href="/dashboard/ar-ap/owner" class="tab-btn active">Owner</a>
          <a href="/dashboard/ar-ap/staff" class="tab-btn">Staff</a>
          <a href="/dashboard/ar-ap/supplier" class="tab-btn">Supplier</a>
        </div>
        <div class="drawer-tabs owner-subtabs" role="tablist" aria-label="Owner report views">
          <button type="button" class="tab-btn active" id="owner-monthly-tab" role="tab" aria-selected="true" aria-controls="monthly-view" onclick="window.location.hash='monthly'">Monthly</button>
          <button type="button" class="tab-btn" id="owner-accrual-tab" role="tab" aria-selected="false" aria-controls="accrual-view" onclick="window.location.hash='accrual'">Accrual</button>
        </div>
      </header>

      <div id="monthly-view" class="owner-view" role="tabpanel" aria-labelledby="owner-monthly-tab" style="padding: 2rem; max-width: 1200px; width: 100%; margin: 0 auto; box-sizing: border-box;">
        <!-- Top controls row -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <div class="owner-report-controls">
            <div class="month-nav-container">
              <button onclick="App.changeMonth(-1)" class="month-nav-btn" aria-label="Previous month">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <span class="month-display-label" id="month-label">---</span>
              <button onclick="App.changeMonth(1)" class="month-nav-btn" aria-label="Next month">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
            <select id="owner-filter" class="form-select owner-filter" aria-label="Select owner" onchange="App.changeOwner(this.value)" disabled>
              <option value="" disabled selected hidden>Select owner...</option>
            </select>
          </div>

          <button onclick="App.refreshData()" class="btn btn-outline btn-sm" style="display: flex; align-items: center; gap: 0.4rem;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            Refresh
          </button>
        </div>

        <!-- Sections wrapper card -->
        <div id="sections-container" style="background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.5rem; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 2rem;">
          <div>
            <table class="excel-table" style="width:100%;border:1px solid var(--border);">
              <tbody>
                <tr class="shimmer-row">
                  <td style="text-align:left;">Loading...</td>
                  <td></td><td></td><td></td><td></td><td></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="accrual-view" class="owner-view" role="tabpanel" aria-labelledby="owner-accrual-tab" hidden style="padding: 2rem; max-width: 1600px; width: 100%; margin: 0 auto; box-sizing: border-box;">
        <section class="accrual-card" aria-labelledby="accrual-title">
          <div class="accrual-header">
            <div class="accrual-header__left">
              <div class="month-nav-container" aria-label="Accrual focused month">
                <button type="button" id="accrual-older" onclick="OwnerAccrualApp.changeFocusMonth(1)" class="month-nav-btn" aria-label="Previous month">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <span class="accrual-range" id="accrual-range">Current month</span>
                <button type="button" id="accrual-newer" onclick="OwnerAccrualApp.changeFocusMonth(-1)" class="month-nav-btn" aria-label="Next month" disabled>
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>
              <select id="accrual-owner-filter" class="form-select accrual-owner-filter" aria-label="Select owner for accrual report" onchange="OwnerAccrualApp.changeOwner(this.value)" disabled>
                <option value="" disabled selected hidden>Select owner...</option>
              </select>
            </div>
            <div class="accrual-header__actions">
              <button type="button" id="accrual-lock-mode" onclick="OwnerAccrualApp.toggleLockMode()" class="btn btn-outline btn-sm" style="display:flex;align-items:center;gap:0.4rem;">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Lock Months
              </button>
              <button type="button" onclick="OwnerAccrualApp.loadData()" class="btn btn-outline btn-sm">Refresh</button>
            </div>
          </div>
          <h2 id="accrual-title" style="font-size:1rem;font-weight:800;margin:0 0 1rem;">Owner Accrual</h2>
          <div class="accrual-table-wrap">
            <table class="accrual-table">
              <thead id="accrual-table-head"></thead>
              <tbody id="accrual-table-body"><tr><td class="accrual-empty">Select the Accrual tab to load the report.</td></tr></tbody>
            </table>
          </div>
          <p style="margin:0.75rem 0 0;color:var(--text-muted);font-size:0.76rem;font-weight:400;line-height:1.5;">
            Calculations support up to 24 unlocked months. Lock a calculated month to save its closing balance and continue calculating the next 24 months from that snapshot.
          </p>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/dashboard/owner-accrual.js?v=20260809-4"></script>

  <script>
    'use strict';

    const getSb = () => window.BKAuth.sb;
    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function fmtEntry(n) {
      n = parseInt(n, 10);
      if (isNaN(n)) return '—';
      if (n < 0) return `BK-SS${Math.abs(n)}`;
      let li, num;
      if (n <= 9999) { li = 0; num = n; }
      else { const off = n - 10000; li = 1 + Math.floor(off / 10000); num = off % 10000; }
      const c1 = String.fromCharCode(65 + Math.floor(li / 26));
      const c2 = String.fromCharCode(65 + (li % 26));
      return `BK-${c1}${c2}${String(num).padStart(4, '0')}`;
    }

    const esc = (v) => {
      if (v === null || v === undefined) return '';
      return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    };

    const fmtCurrency = (val) => {
      if (!val && val !== 0) return '—';
      const neg = val < 0;
      return `${neg ? '(' : ''}₱${Math.abs(val).toLocaleString(undefined, { minimumFractionDigits:2, maximumFractionDigits:2 })}${neg ? ')' : ''}`;
    };

    window.App = {
      tenantId: null,
      companyId: null,
      currentYear: new Date().getFullYear(),
      currentMonth: new Date().getMonth(),
      owners: [],
      ownerAccounts: [],
      accountAssignments: {},
      selectedOwnerId: '',

      async init() {
        try {
          const authInfo = await window.BKAuth.checkRoleGate(['Owner','Admin','HR','Finance'], '../../admin.html');
          if (!authInfo) return;
          this.tenantId = authInfo.tenantId;

          const { data: co } = await getSb().from('companies').select('id').eq('tenant_id', this.tenantId).limit(1).maybeSingle();
          this.companyId = co?.id || null;
          if (!this.companyId) return;

          await this.loadOwnerOptions();
          await this.loadData();
        } catch (e) {
          console.error(e);
          document.getElementById('sections-container').innerHTML = '<p style="color:var(--danger);padding:1rem;">The owner report could not be initialized. Please refresh and try again.</p>';
        }
      },

      changeMonth(delta) {
        this.currentMonth += delta;
        if (this.currentMonth < 0) { this.currentMonth = 11; this.currentYear--; }
        if (this.currentMonth > 11) { this.currentMonth = 0; this.currentYear++; }
        this.loadData();
      },

      changeOwner(ownerId) {
        this.selectedOwnerId = ownerId || '';
        this.loadData();
      },

      async refreshData() {
        try {
          await this.loadOwnerOptions();
          await this.loadData();
        } catch (error) {
          console.error(error);
          document.getElementById('sections-container').innerHTML = '<p style="color:var(--danger);padding:1rem;">The owner report could not be refreshed. Please try again.</p>';
        }
      },

      async loadOwnerOptions() {
        const previousOwnerId = this.selectedOwnerId;
        const [employeesResult, accountsResult, assignmentsResult] = await Promise.all([
          getSb().from('employees').select('id,first_name,last_name,assignment').eq('company_id', this.companyId).order('first_name'),
          getSb().from('journal_accounts').select('id,name').eq('company_id', this.companyId)
            .or('name.ilike.%due from owner%,name.ilike.%company loan%,name.ilike.%owner loan%').order('name'),
          getSb().from('global_settings').select('value').eq('key', 'journal_account_employee_assignments').eq('company_id', this.companyId).maybeSingle()
        ]);
        if (employeesResult.error) throw employeesResult.error;
        if (accountsResult.error) throw accountsResult.error;
        if (assignmentsResult.error) throw assignmentsResult.error;
        this.owners = (employeesResult.data || []).filter(employee => String(employee.assignment || '').toLowerCase().split(',').some(value => value.trim().includes('owner')));
        this.ownerAccounts = accountsResult.data || [];
        this.accountAssignments = assignmentsResult.data?.value?.assignments || {};
        this.selectedOwnerId = this.owners.some(owner => owner.id === previousOwnerId)
          ? previousOwnerId
          : (this.owners[0]?.id || '');
        const ownerFilter = document.getElementById('owner-filter');
        ownerFilter.disabled = !this.owners.length;
        ownerFilter.innerHTML = this.owners.length
          ? this.owners.map(owner => `<option value="${esc(owner.id)}"${owner.id === this.selectedOwnerId ? ' selected' : ''}>${esc(`${owner.first_name || ''} ${owner.last_name || ''}`.trim())}</option>`).join('')
          : '<option value="" disabled selected hidden>No owners found</option>';
      },

      async loadData() {
        document.getElementById('month-label').textContent = `${MONTH_NAMES[this.currentMonth]} ${this.currentYear}`;
        const container = document.getElementById('sections-container');
        container.innerHTML = `<div><table class="excel-table" style="width:100%;border:1px solid var(--border);"><tbody><tr class="shimmer-row"><td style="text-align:left;">Loading...</td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>`;

        if (!this.selectedOwnerId) {
          container.innerHTML = '<p style="color:var(--text-muted);font-style:italic;text-align:center;padding:2rem 0;">No employees with an Owner assignment were found.</p>';
          return;
        }
        const assignedAccounts = this.ownerAccounts
          .filter(account => String(this.accountAssignments[String(account.id)] || '') === String(this.selectedOwnerId))
          .sort((left, right) => this.ownerAccountRank(left.name) - this.ownerAccountRank(right.name) || left.name.localeCompare(right.name));
        const accountIds = assignedAccounts.map(account => account.id);
        if (!assignedAccounts.length) {
          container.innerHTML = '<p style="color:var(--text-muted);font-style:italic;text-align:center;padding:2rem 0;">This owner has no assigned Due from owner or loan accounts. Assign one under <a href="/dashboard/assign-account" style="color:var(--cyan-light);font-weight:600;">Assign</a>.</p>';
          return;
        }

        const startDate = `${this.currentYear}-${String(this.currentMonth + 1).padStart(2,'0')}-01`;
        const lastDay = new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
        const endDate = `${this.currentYear}-${String(this.currentMonth + 1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;

        try {
          const { data: entries, error } = await getSb()
            .from('general_journal').select('id,account_id,account,entry_number,date,debit,credit,description_1,description_2')
            .eq('company_id', this.companyId)
            .in('account_id', accountIds)
            .gte('date', startDate).lte('date', endDate)
            .order('date', { ascending: true })
            .order('entry_number', { ascending: true })
            .order('id', { ascending: true });

          if (error) throw error;
          this.renderSections(entries || [], assignedAccounts, container);
        } catch (err) {
          console.error(err);
          container.innerHTML = '<p style="color:var(--danger);padding:1rem;">The owner report could not be loaded. Please refresh and try again.</p>';
        }
      },

      ownerAccountRank(name) {
        const normalized = String(name || '').toLowerCase();
        if (normalized.includes('due from owner')) return 0;
        if (normalized.includes('company loan repayment')) return 2;
        if (normalized.includes('company loan')) return 1;
        if (normalized.includes('owner loan')) return 3;
        return 4;
      },

      renderSections(entries, assignedAccounts, container) {
        let html = '';
        assignedAccounts.forEach(account => {
          const accountName = account.name || 'Unnamed account';
          const rows = entries.filter(entry => String(entry.account_id) === String(account.id));
          let totalDebit = 0, totalCredit = 0;

          const rowsHtml = rows.length ? rows.map((e, idx) => {
            const deb = parseFloat(e.debit) || 0;
            const cred = parseFloat(e.credit) || 0;
            totalDebit += deb;
            totalCredit += cred;
            return `<tr>
              <td style="text-align:center;color:var(--text-muted);font-size:9pt;width:3rem;">${idx + 1}</td>
              <td style="font-family:var(--font-mono);font-weight:600;white-space:nowrap;">${esc(fmtEntry(e.entry_number))}</td>
              <td>${esc(e.description_1 || '—')}</td>
              <td>${esc(e.description_2 || '—')}</td>
              <td class="num-col">${fmtCurrency(deb)}</td>
              <td class="num-col">${fmtCurrency(cred)}</td>
            </tr>`;
          }).join('') : '<tr><td colspan="6" style="padding:1.5rem;text-align:center;color:var(--text-muted);font-style:italic;">No transactions for this month.</td></tr>';

          html += `
            <div>
              <div style="border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 0.75rem;">
                <h2 style="font-size: 1rem; font-weight: 800; color: var(--text-primary); margin: 0;">${esc(accountName)}</h2>
              </div>
              <div class="excel-container" style="margin-top: 0;">
                <table class="excel-table">
                  <thead>
                    <tr>
                      <th style="text-align:center;width:3rem;">#</th>
                      <th>Entry #</th>
                      <th>Description 1</th>
                      <th>Description 2</th>
                      <th class="num-col">Debit</th>
                      <th class="num-col">Credit</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rowsHtml}
                    <tr class="total-row">
                      <td colspan="4" style="text-align:left;">Total</td>
                      <td class="num-col">${fmtCurrency(totalDebit)}</td>
                      <td class="num-col">${fmtCurrency(totalCredit)}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>`;
        });

        container.innerHTML = html;
      }
    };

    document.addEventListener('DOMContentLoaded', async () => {
      await App.init();
      const showHashView = () => OwnerViewTabs.show(window.location.hash === '#accrual' ? 'accrual' : 'monthly');
      if (!['#monthly', '#accrual'].includes(window.location.hash)) {
        window.history.replaceState(null, '', `${window.location.pathname}${window.location.search}#monthly`);
      }
      await showHashView();
      window.addEventListener('hashchange', showHashView);
    });
  </script>
</body>
</html>
