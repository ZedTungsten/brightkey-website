<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Brightkey ERP</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/dashboard/messages.css?v=20260819-2" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
</head>
<body>
  <div id="toast-container"></div>
  <div class="dash-layout">
    <aside class="dash-sidebar" id="dash-sidebar"></aside>
    <main class="dash-main messages-page">
      <header class="messages-topbar">
        <div><h1>Messages</h1><p>Direct messages, groups, and your company channel</p></div>
        <button class="btn btn-primary" id="new-group-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New group
        </button>
      </header>

      <section class="messages-shell" aria-label="Company messages">
        <aside class="conversation-panel" id="conversation-panel">
          <div class="conversation-search bk-search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
            <input id="conversation-search" type="search" placeholder="Search conversations" />
          </div>
          <div class="conversation-tabs" role="tablist">
            <button class="active" type="button" data-filter="all">All</button>
            <button type="button" data-filter="direct">Direct</button>
            <button type="button" data-filter="group">Groups</button>
          </div>
          <div class="conversation-list" id="conversation-list"><div class="conversation-skeleton"><i></i><i></i><i></i><i></i></div></div>
        </aside>

        <section class="message-panel" id="message-panel">
          <div class="message-empty" id="message-empty">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
            <h2>Select a conversation</h2><p>Choose a direct message, group, or company channel.</p>
          </div>
          <div class="message-workspace" id="message-workspace" hidden>
            <header class="message-header">
              <button class="back-conversations" id="back-conversations" type="button" aria-label="Back to conversations"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
              <div class="thread-avatar" id="thread-avatar"></div>
              <div class="thread-heading"><h2 id="thread-name"></h2><button type="button" id="thread-members"></button></div>
            </header>
            <div class="message-history" id="message-history"><div class="message-loading"><span></span>Loading messages</div></div>
            <form class="message-composer" id="message-composer">
              <div class="image-preview" id="image-preview" hidden><img id="image-preview-img" alt="Selected image preview" /><span id="image-preview-meta"></span><button id="remove-image" type="button" aria-label="Remove selected image"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
              <input id="image-input" type="file" accept="image/*" hidden />
              <button class="attach-image" id="attach-image" type="button" aria-label="Attach image" title="Attach image"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></svg></button>
              <textarea id="message-input" rows="1" maxlength="5000" placeholder="Write a message"></textarea>
              <button type="submit" aria-label="Send message"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
            </form>
          </div>
        </section>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="group-modal" role="dialog" aria-modal="true" aria-labelledby="group-modal-title">
    <div class="modal-card group-modal-card">
      <div class="modal-header"><div><h3 id="group-modal-title">Create group</h3><p>Start a conversation with people in your company.</p></div><button class="icon-button" id="close-group-modal" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <label class="form-label" for="group-name">Group name <span class="required">*</span></label>
      <input class="form-input" id="group-name" type="text" maxlength="120" placeholder="e.g. Operations Team" />
      <label class="form-label" for="member-search">Members</label>
      <input class="bk-search-control" id="member-search" type="search" placeholder="Search team members" />
      <div class="group-member-list" id="group-member-list"></div>
      <p class="form-error" id="group-error" role="alert"></p>
      <div class="modal-footer"><button class="btn btn-outline" id="cancel-group" type="button">Cancel</button><button class="btn btn-primary" id="create-group" type="button">Create group</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="members-modal" role="dialog" aria-modal="true" aria-labelledby="members-modal-title">
    <div class="modal-card members-modal-card"><div class="modal-header"><h3 id="members-modal-title">Conversation members</h3><button class="icon-button" id="close-members-modal" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div id="members-list" class="members-list"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/dashboard/messages.js?v=20260819-2"></script>
</body>
</html>
