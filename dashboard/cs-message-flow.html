<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Flow — Brightkey ERP</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/dashboard/cs-message-flow.css?v=20260820-2" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
</head>
<body class="message-flow-page">
  <div class="dash-layout">
    <aside class="dash-sidebar" id="dash-sidebar"></aside>
    <div class="dash-main">
      <div class="top-bar">
        <span class="top-bar-title">Message Flow</span>
      </div>

      <main class="flow-page">
        <header class="flow-heading">
          <div>
            <span class="flow-eyebrow">Customer Service</span>
            <h1>Message Flow</h1>
            <p>Design the messages and choices customers see after opening Support.</p>
          </div>
          <div class="flow-heading-actions">
            <span class="flow-save-status" id="flow-save-status" aria-live="polite"></span>
            <button class="btn btn-primary" id="save-flow" type="button">Save Flow</button>
          </div>
        </header>

        <section class="flow-workspace" aria-label="Customer support message flow">
          <div class="flow-start">
            <span class="flow-start-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </span>
            <div><strong>Customer opens Support</strong><span>The first message appears immediately.</span></div>
          </div>
          <div class="flow-loading" id="flow-loading"><span class="spinner-cyan"></span><span>Loading message flow...</span></div>
          <div class="flow-tree" id="flow-tree" hidden></div>
        </section>
      </main>
    </div>
  </div>

  <div class="flow-toast" id="flow-toast" role="status" aria-live="polite"></div>
  <div class="flow-action-picker" id="flow-action-picker" role="dialog" aria-label="Add customer support action" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/dashboard/cs-message-flow.js?v=20260820-2"></script>
</body>
</html>
