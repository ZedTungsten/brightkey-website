<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commission — Brightkey Portal</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/dashboard/payout-tracker/shared.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
  <style>
    .commissions-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1.5rem;
    }
    .month-picker {
      display: flex;
      align-items: center;
      margin-left: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
    }
    .month-picker button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .month-picker button:hover {
      color: var(--cyan-light);
      background: var(--bg-elevated);
    }
    .month-picker svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }
    .month-picker span {
      min-width: 130px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 700;
    }
    @media (max-width: 700px) {
      .month-picker {
        width: 100%;
        margin-left: 0;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar" id="dash-sidebar"></aside>
    <div class="dash-main">
      <div class="top-bar">
        <span class="top-bar-title">Payout Tracker</span>
        <div style="flex:1"></div>
        <span id="save-status" style="font-size:0.75rem;color:var(--text-muted);"></span>
      </div>

      <nav class="drawer-tabs" id="payout-nav">
        <a href="/dashboard/payout-tracker/payout"         class="tab-btn" data-page="payout">Payout</a>
        <a href="/dashboard/payout-tracker/salary"         class="tab-btn" data-page="salary">Salary</a>
        <a href="/dashboard/payout-tracker/special-payout" class="tab-btn" data-page="special-payout">Special Payout</a>
        <a href="/dashboard/payout-tracker/adjustments"    class="tab-btn" data-page="adjustments">Adjustments</a>
        <a href="/dashboard/payout-tracker/commissions"    class="tab-btn" data-page="commissions">Commission</a>
        <a href="/dashboard/payout-tracker/installations"  class="tab-btn" data-page="installations">Installation</a>
        <a href="/dashboard/payout-tracker/schedules"      class="tab-btn" data-page="schedules">Schedules</a>
        <a href="/dashboard/payout-tracker/payslip"        class="tab-btn" data-page="payslip">Payslip</a>
      </nav>

      <main style="overflow-y: auto; flex: 1; min-width: 0; width: 100%;">
        <div class="int-wrap">
          <div class="commissions-toolbar">
            <div class="month-picker" id="commissions-month-navigator" aria-label="Commissions month">
              <button type="button" id="btn-prev-month" aria-label="Previous month">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
              </button>
              <span id="commission-month-display"></span>
              <button type="button" id="btn-next-month" aria-label="Next month">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
              </button>
            </div>
          </div>

          <div class="table-card">
            <div class="table-wrap">
              <table class="salary-table" id="commission-table">
                <thead id="commission-table-header"></thead>
                <tbody id="commission-table-body">
                  <tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--text-muted);">Loading commission data...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/sales-commission-calculator.js?v=20260829-1"></script>
  <script>
    'use strict';

    (function () {
      const parts = window.location.pathname.split('/').filter(Boolean);
      let page = parts[parts.length - 1];
      if (page === 'index.html') page = parts[parts.length - 2];
      document.querySelectorAll('#payout-nav .tab-btn[data-page]').forEach(a => {
        if (a.dataset.page === page) a.classList.add('active');
      });
    })();

    const getSb = () => window.BKAuth.sb;
    const toast = (msg, type = 'success') => {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      c.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    };
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const php = v => {
      if (v === null || v === undefined || v === '' || Number(v) === 0) return '—';
      return '₱' + Number(v).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    const App = {
      tenantId: null,
      companyId: null,
      employees: [],
      commissionSchedules: [],
      commissionAssignments: [],
      commissionProducts: [],
      commissionsConfig: {},
      bookingsList: [],
      commissionPayoutState: {},
      selectedYear: new Date().getFullYear(),
      selectedMonth: new Date().getMonth(),
      saveTimeout: null,

      async init() {
        try {
          const authInfo = await window.BKAuth.checkRoleGate(['HR', 'Finance'], '../../../admin.html');
          if (!authInfo) return;
          this.tenantId = authInfo.tenantId;
          const { data: co } = await getSb().from('companies').select('id').eq('tenant_id', this.tenantId).limit(1).maybeSingle();
          this.companyId = co?.id || null;
          if (!this.companyId) { toast('Failed to resolve company.', 'error'); return; }
          this.updateMonthDisplay();
          await this.loadData();
          this.render();
          this.bindEvents();
        } catch (e) {
          console.error(e);
          toast('Initialization failed: ' + e.message, 'error');
        }
      },

      async loadData() {
        const sb = getSb();

        // Employee names
        try {
          const { data, error } = await sb.from('employees')
            .select('id, first_name, last_name, employment_status, assignment')
            .eq('company_id', this.companyId);
          if (error) throw error;
          this.employees = data || [];
        } catch (e) { this.employees = []; console.error(e); }

        // Commission schedules
        try {
          const { data } = await sb.from('global_settings').select('value').eq('key', 'salary_tracker_config').eq('company_id', this.companyId).maybeSingle();
          this.commissionSchedules = data?.value?.payoutSchedules || [15, 30];
        } catch (_) { this.commissionSchedules = [15, 30]; }

        // Commission assignments
        try {
          const { data, error } = await sb.from('commission_assignments')
            .select('employee_id, booking_id, product_index, amount, rate_label, sku')
            .eq('company_id', this.companyId);
          if (error) throw error;
          this.commissionAssignments = data || [];
        } catch (e) { this.commissionAssignments = []; console.error(e); }

        // Sales Goals booking data is the commission calculation basis.
        try {
          const { data, error } = await sb.from('installation_bookings')
            .select('*')
            .eq('company_id', this.companyId);
          if (error) throw error;
          this.bookingsList = data || [];
        } catch (e) { this.bookingsList = []; console.error(e); }

        try {
          const [{ data: products, error: productsError }, { data: config, error: configError }] = await Promise.all([
            sb.from('products').select('id, sku, business, category, tags').or(`company_id.eq.${this.companyId},company_id.is.null`),
            sb.from('global_settings').select('value').eq('key', 'commissions_config').eq('company_id', this.companyId).maybeSingle()
          ]);
          if (productsError) throw productsError;
          if (configError) throw configError;
          this.commissionProducts = products || [];
          this.commissionsConfig = config?.value || {};
        } catch (e) {
          this.commissionProducts = [];
          this.commissionsConfig = {};
          console.error(e);
        }

        // Commission payout state
        try {
          const { data } = await sb.from('global_settings').select('value').eq('key', 'commission_payout_state').eq('company_id', this.companyId).maybeSingle();
          this.commissionPayoutState = data?.value || {};
        } catch (_) { this.commissionPayoutState = {}; }
      },

      monthKey() {
        return `${this.selectedYear}-${String(this.selectedMonth + 1).padStart(2, '0')}`;
      },

      updateMonthDisplay() {
        const el = document.getElementById('commission-month-display');
        if (el) el.textContent = `${MONTHS[this.selectedMonth]} ${this.selectedYear}`;
      },

      changeMonth(diff) {
        let m = this.selectedMonth + diff;
        let y = this.selectedYear;
        if (m < 0)  { m = 11; y--; }
        if (m > 11) { m = 0;  y++; }
        this.selectedMonth = m;
        this.selectedYear  = y;
        this.updateMonthDisplay();
        this.render();
      },

      bindEvents() {
        document.getElementById('btn-prev-month').addEventListener('click', () => this.changeMonth(-1));
        document.getElementById('btn-next-month').addEventListener('click', () => this.changeMonth(1));
      },

      getCommissionPayoutBucket(dateValue, targetMonthKey, schedules) {
        const datePart = String(dateValue || '').slice(0, 10);
        const match = datePart.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return null;

        const sourceYear = Number(match[1]);
        const sourceMonth = Number(match[2]);
        const sourceDay = Number(match[3]);
        const sourceMonthKey = `${sourceYear}-${String(sourceMonth).padStart(2, '0')}`;
        const sortedSchedules = [...schedules].sort((a, b) => a - b);
        const firstCutoff = sortedSchedules[0];
        const finalCutoff = sortedSchedules[sortedSchedules.length - 1];

        if (sourceMonthKey === targetMonthKey) {
          return {
            day: sortedSchedules.find(day => sourceDay <= day) || finalCutoff,
            rollover: false
          };
        }

        // Work completed after the prior month's last nominal cutoff rolls into
        // this month's first payout. Current month-end work remains in its final cutoff.
        if (sourceDay <= finalCutoff) return null;
        const rolloverDate = new Date(Date.UTC(sourceYear, sourceMonth, 1));
        const rolloverMonthKey = `${rolloverDate.getUTCFullYear()}-${String(rolloverDate.getUTCMonth() + 1).padStart(2, '0')}`;
        return rolloverMonthKey === targetMonthKey ? { day: firstCutoff, rollover: true } : null;
      },

      render() {
        const header = document.getElementById('commission-table-header');
        const tbody  = document.getElementById('commission-table-body');
        if (!header || !tbody) return;

        const mk       = this.monthKey();
        const scheds   = [...this.commissionSchedules].sort((a, b) => a - b);
        const schedDays = scheds.length > 0 ? scheds : [30];
        const bookingsById = new Map(this.bookingsList.map(booking => [booking.id, booking]));
        const includedAssignments = [];
        const assignmentsByDay = new Map(schedDays.map(day => [day, []]));
        const rolloverAssignmentsByDay = new Map(schedDays.map(day => [day, []]));

        this.commissionAssignments.forEach(assignment => {
          const booking = bookingsById.get(assignment.booking_id);
          const bucket = this.getCommissionPayoutBucket(booking?.scheduled_date || booking?.created_at, mk, schedDays);
          if (!bucket) return;
          includedAssignments.push(assignment);
          assignmentsByDay.get(bucket.day).push(assignment);
          if (bucket.rollover) rolloverAssignmentsByDay.get(bucket.day).push(assignment);
        });

        const calculateTotals = assignments => {
          const bookingIds = new Set(assignments.map(assignment => assignment.booking_id));
          return window.BKSalesCommissionCalculator.amountsByEmployee({
            assignments,
            bookings: this.bookingsList.filter(booking => bookingIds.has(booking.id)),
            products: this.commissionProducts,
            config: this.commissionsConfig
          });
        };
        const totalsByDay = new Map(schedDays.map(day => [day, calculateTotals(assignmentsByDay.get(day))]));
        const rolloverTotalsByDay = new Map(schedDays.map(day => [day, calculateTotals(rolloverAssignmentsByDay.get(day))]));

        const empDoneDates = {};
        includedAssignments.forEach(assignment => {
          if (!assignment.employee_id) return;
          const b = bookingsById.get(assignment.booking_id);
          const installDate = b?.scheduled_date || b?.created_at;
          if (!installDate) return;
          const label = new Date(`${String(installDate).slice(0, 10)}T00:00:00`).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          empDoneDates[assignment.employee_id] = empDoneDates[assignment.employee_id] || [];
          if (!empDoneDates[assignment.employee_id].includes(label)) empDoneDates[assignment.employee_id].push(label);
        });

        const employeeTotals = new Map();
        totalsByDay.forEach(totals => totals.forEach((amount, empId) => {
          employeeTotals.set(empId, (employeeTotals.get(empId) || 0) + amount);
        }));
        const activeEmpIds = [...employeeTotals.entries()].filter(([empId, amount]) => {
          const employee = this.employees.find(item => item.id === empId);
          const isOwner = String(employee?.assignment || '').split(',').some(value => value.trim().toLowerCase() === 'owner');
          return amount > 0 && !isOwner;
        }).map(([empId]) => empId);

        // Header
        let headerHtml = `<tr><th style="padding-left:1.5rem;">Employee Name</th><th>Install Date</th>`;
        schedDays.forEach(d => { headerHtml += `<th>Payout (Day ${d})</th>`; });
        headerHtml += `</tr>`;
        header.innerHTML = headerHtml;

        if (activeEmpIds.length === 0) {
          tbody.innerHTML = `<tr><td colspan="${2 + schedDays.length}" style="text-align:center;padding:3rem;color:var(--text-muted);">No commissions earned this month.</td></tr>`;
          return;
        }

        let bodyHtml = '';
        activeEmpIds.forEach(empId => {
          const emp      = this.employees.find(e => e.id === empId);
          const fullName = emp ? [emp.first_name, emp.last_name].filter(Boolean).join(' ') : 'Unknown Employee';

          const allDates = [];
          (empDoneDates[empId] || []).forEach(date => { if (!allDates.includes(date)) allDates.push(date); });

          let cells = '';
          schedDays.forEach(day => {
            const amount = totalsByDay.get(day)?.get(empId) || 0;
            const rolloverAmount = rolloverTotalsByDay.get(day)?.get(empId) || 0;
            cells += `<td style="font-weight:700;font-variant-numeric:tabular-nums;">${esc(php(amount / 100))}${rolloverAmount > 0 ? `<div style="margin-top:0.25rem;font-size:0.72rem;font-weight:500;color:var(--text-muted);">Roll Com: ${esc(php(rolloverAmount / 100))}</div>` : ''}</td>`;
          });

          bodyHtml += `<tr class="employee-row" data-emp-id="${esc(empId)}">
            <td class="col-name" style="padding-left:1.5rem;font-weight:600;color:var(--text-primary);">${esc(fullName)}</td>
            <td style="font-weight:600;font-size:0.78rem;">${esc(allDates.join(', '))}</td>
            ${cells}
          </tr>`;
        });

        tbody.innerHTML = bodyHtml;
      },

      debouncedSave() {
        const el = document.getElementById('save-status');
        if (el) el.textContent = 'Saving changes...';
        if (this.saveTimeout) clearTimeout(this.saveTimeout);
        this.saveTimeout = setTimeout(() => this.saveStateSilent(), 1000);
      },

      async saveStateSilent() {
        try {
          await getSb().from('global_settings').upsert({ key: 'commission_payout_state', company_id: this.companyId, value: this.commissionPayoutState });
          const el = document.getElementById('save-status');
          if (el) { el.textContent = 'All changes saved'; setTimeout(() => { if (el.textContent === 'All changes saved') el.textContent = ''; }, 3000); }
        } catch (e) {
          console.error(e);
          const el = document.getElementById('save-status');
          if (el) el.textContent = 'Autosave failed';
        }
      },
    };

    document.addEventListener('DOMContentLoaded', () => {
      App.init();
      if (typeof initNav === 'function') initNav();
    });
  </script>
</body>
</html>
