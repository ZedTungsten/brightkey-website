        const mk = this.monthKey();
        this.specialPayoutState[mk] = this.specialPayoutState[mk] || {};
        this.specialPayoutState[mk][`${empId}_${day}`] = checked;
        const valEl = document.getElementById(`val-spec-${empId}-${day}`);
        if (valEl) {
          if (checked) { valEl.classList.remove('overdue'); valEl.style.textDecoration = 'line-through'; valEl.style.opacity = '0.5'; }
          else { valEl.style.textDecoration = ''; valEl.style.opacity = ''; if (this.isPastDay(day)) valEl.classList.add('overdue'); }
        }
        this.debouncedSave();
      },

      // ── Debounced save ──
      debouncedSave() {
        const el = document.getElementById('save-status');
        if (el) el.textContent = 'Saving changes...';
        if (this.saveTimeout) clearTimeout(this.saveTimeout);
        this.saveTimeout = setTimeout(() => this.saveStateSilent(), 1000);
      },

      async saveStateSilent() {
        try {
          const sb = getSb();
          const results = await Promise.all([
            sb.from('global_settings').upsert({ key: 'regular_payout_state', company_id: this.companyId, value: this.regularPayoutState }),
            sb.from('global_settings').upsert({ key: 'special_payout_state', company_id: this.companyId, value: this.specialPayoutState }),
            sb.from('global_settings').upsert({ key: 'commission_payout_state', company_id: this.companyId, value: this.commissionPayoutState }),
          ]);
          const failed = results.find(result => result.error);
          if (failed) throw failed.error;
          const el = document.getElementById('save-status');
          if (el) { el.textContent = 'All changes saved'; setTimeout(() => { if (el.textContent === 'All changes saved') el.textContent = ''; }, 3000); }
        } catch (e) {
          console.error(e);
          const el = document.getElementById('save-status');
          if (el) el.textContent = 'Autosave failed';
        }
      },

      // ── Sync payslip record (snapshot when all salary cutoffs are checked) ──
      async syncPayslipRecord(empId) {
        const emp = this.employees.find(e => e.id === empId);
        if (!emp) return;
        const mk     = this.monthKey();
        const state  = this.regularPayoutState[mk];
        const scheds = this.payoutSchedules.length > 0 ? this.payoutSchedules : [15, 30];
        const hasSystemOnlyPayout = !this.isRegularPayoutEmployee(emp, mk)
          && scheds.some(day => this.getSystemAdjustment(empId, mk, day).value !== 0);
        const commissionOnly = this.isCommissionOnlyEmployee(emp, mk) || hasSystemOnlyPayout;
        const requiredDays = commissionOnly
          ? scheds.filter(day => (
              this._commsForSchedule(empId, day, mk, scheds) > 0
              || this.getSystemAdjustment(empId, mk, day).value !== 0
            ))
          : scheds;
        const allChecked = requiredDays.length > 0 && state
          && requiredDays.every(day => window.BKPayoutSnapshots.isPaid(state[`${empId}_${day}`]));

        if (allChecked) {
          const isOwner = this.isOwnerEmployee(emp);
          const inactiveDate = commissionOnly || this.isActiveEmployee(emp) ? null : this.getInactiveDate(emp);
          const baseSalary   = commissionOnly ? 0 : (emp.salary || 0);
          const sortedScheds = [...scheds].sort((a, b) => a - b);
          const salaryPaid   = commissionOnly ? 0 : this.getEmployeeSalaryTotal(emp, sortedScheds, mk);
          const empComms     = isOwner ? 0 : this._commissionForEmpMonth(empId, mk, inactiveDate);
          const empAdjObjs   = commissionOnly ? [] : this.adjustmentsList.filter(a => { const d = new Date(a.date); return a.employeeId === empId && `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` === mk; });
          const empSpecs     = isOwner || commissionOnly ? [] : window.BKSpecialPayoutHistory.forMonth(this.specialSchedules, mk).filter(s => s.employeeId === empId);
          const totalAdjs    = empAdjObjs.reduce((s, a) => s + (Number(a.value) || 0), 0);
          const totalSpecs   = empSpecs.reduce((s, x) => s + (Number(x.value) || 0), 0);
          const lockedRegularTotal = requiredDays.reduce((sum, day) => {
            const entry = state[`${empId}_${day}`];
            return sum + (window.BKPayoutSnapshots.isSnapshot(entry)
              ? window.BKPayoutSnapshots.fromCents(entry.paid_value_centavos)
              : this.getPayoutComponents(empId, day, mk).displayedValue);
          }, 0);
          const systemAdjustmentTotal = requiredDays.reduce((sum, day) => {
            const entry = state[`${empId}_${day}`];
            if (!window.BKPayoutSnapshots.isSnapshot(entry)) return sum;
            const cents = Object.values(entry.system_sources || {})
              .reduce((total, value) => total + (Number(value) || 0), 0);
            return sum + window.BKPayoutSnapshots.fromCents(cents);
          }, 0);

          const instPayouts = isOwner || commissionOnly
            ? { thresholdEarnings: 0, serviceEarnings: 0 }
            : this.calculateInstallerPayouts(empId, mk, sortedScheds);
          const finalAdjObjs = [...empAdjObjs];
          let finalTotalAdjs = totalAdjs;
          if (instPayouts.thresholdEarnings > 0) {
            finalAdjObjs.push({
              label: 'Earnings Past Threshold',
              value: instPayouts.thresholdEarnings,
              description: instPayouts.thresholdDescription,
              date: new Date().toISOString()
            });
            finalTotalAdjs += instPayouts.thresholdEarnings;
          }
          if (instPayouts.serviceEarnings > 0) {
            finalAdjObjs.push({
              label: 'Service Job Earnings',
              value: instPayouts.serviceEarnings,
              description: instPayouts.serviceDescription,
              date: new Date().toISOString()
            });
            finalTotalAdjs += instPayouts.serviceEarnings;
          }
          if (systemAdjustmentTotal !== 0) {
            finalAdjObjs.push({
              label: 'System',
              value: systemAdjustmentTotal,
              description: 'Automatic correction from a previously paid payout',
              date: new Date().toISOString()
            });
            finalTotalAdjs += systemAdjustmentTotal;
          }

          const empGlAdd = commissionOnly ? 0 : this._glAdditionsForEmpMonth(empId, mk);
          const empGlDed = commissionOnly ? 0 : this._glDeductionsForEmpMonth(empId, mk);
          const reimbursementObjects = empGlAdd > 0 ? [{
            label: 'Reimbursement',
            value: empGlAdd,
            description: 'Employee reimbursement from the general ledger',
            date: `${mk}-${String(sortedScheds[sortedScheds.length - 1] || 1).padStart(2, '0')}`
          }] : [];
          if (empGlDed > 0) {
            finalAdjObjs.push({
              label: 'Cash Advance',
              value: -empGlDed,
              description: 'Cash Advance',
              date: new Date().toISOString()
            });
            finalTotalAdjs -= empGlDed;
          }
 
          const grandTotal   = lockedRegularTotal + totalSpecs;

          let resolvedDeptName = emp.department || '—';
          const matchedDept = (this.companyStructure?.departments || []).find(d => d.managerId === empId || (d.subteams || []).some(s => s.managerId === empId || (s.colleagueIds || []).includes(empId)));
          if (matchedDept) resolvedDeptName = matchedDept.name;

          const payload = {
            company_id: this.companyId, employee_id: empId, payout_month: mk,
            department: resolvedDeptName, position: emp.title || '—',
            salary: baseSalary, basic_paid: salaryPaid,
            commissions: empComms, adjustments: finalTotalAdjs,
            reimbursements: empGlAdd, special_payouts: totalSpecs,
            total_payout: grandTotal,
            adjustments_list: finalAdjObjs,
            reimbursements_list: reimbursementObjects,
            special_schedules: empSpecs
          };
          try { await getSb().from('payslip_records').upsert(payload, { onConflict: 'employee_id,payout_month' }); } catch (e) { console.error(e); }
        } else {
          try {
            await getSb().from('payslip_records').delete().eq('employee_id', empId).eq('payout_month', mk);
          } catch (e) { console.error(e); }
        }
      },

      // ── Shortcut PDF save from summary row ──
      shortcutSavePayslip(empId) {
        const emp = this.employees.find(e => e.id === empId);
        if (!emp) return;
        const params = new URLSearchParams({
          employee: empId,
          month: this.monthKey(),
          download: '1'
        });
        window.location.href = `/dashboard/payout-tracker/payslip?${params.toString()}`;
      },

      async downloadPayslipDirect(empId) {
        const emp = this.employees.find(e => e.id === empId);
        if (!emp) return;
        if (typeof html2pdf !== 'function') {
          toast('The PDF generator is still loading. Please try again in a moment.', 'error');
          return;
        }

        const mk = this.monthKey();
        const monthText = `${MONTHS[this.selectedMonth]} ${this.selectedYear}`;
        const isOwner = this.isOwnerEmployee(emp);
        const commissionOnly = this.isCommissionOnlyEmployee(emp, mk);
        const inactiveDate = commissionOnly || this.isActiveEmployee(emp) ? null : this.getInactiveDate(emp);
        const schedules = [...(this.payoutSchedules.length ? this.payoutSchedules : [15, 30])].map(Number).sort((a, b) => a - b);
        const salaryPaid = commissionOnly ? 0 : this.getEmployeeSalaryTotal(emp, schedules, mk);
        const commissions = isOwner ? 0 : this._commissionForEmpMonth(empId, mk, inactiveDate);
        const adjustments = commissionOnly ? [] : this.adjustmentsList.filter(item => item.employeeId === empId && String(item.date || '').startsWith(mk));
        const specialSchedules = isOwner || commissionOnly ? [] : window.BKSpecialPayoutHistory.forMonth(this.specialSchedules, mk).filter(item => item.employeeId === empId);
        const installationPayouts = isOwner || commissionOnly
          ? { thresholdEarnings: 0, thresholdDescription: '', serviceEarnings: 0, serviceDescription: '', cutoffPayouts: {} }
          : this.calculateInstallerPayouts(empId, mk, schedules);
        const glReimbursement = commissionOnly ? 0 : this._glAdditionsForEmpMonth(empId, mk);
        const adjustmentsTotal = adjustments.reduce((sum, item) => sum + (Number(item.value) || 0), 0);
        const specialTotal = specialSchedules.reduce((sum, item) => sum + (Number(item.value) || 0), 0);
        const totalPayout = salaryPaid + commissions + adjustmentsTotal + specialTotal
          + installationPayouts.thresholdEarnings + installationPayouts.serviceEarnings + glReimbursement;

        let profile = {};
        let template = {};
        try {
          const { data, error } = await getSb()
            .from('global_settings')
            .select('key, value')
            .eq('company_id', this.companyId)
            .in('key', ['company_profile_config', 'payslip_template_config']);
          if (error) throw error;
          (data || []).forEach(item => {
            if (item.key === 'company_profile_config') profile = item.value || {};
            if (item.key === 'payslip_template_config') template = item.value || {};
          });
        } catch (error) {
          console.error('Unable to load payslip branding:', error);
        }

        const peso = value => window.BKCurrency
          ? window.BKCurrency.format(Number(value) || 0)
          : `₱${(Number(value) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        const row = window.BKPayslipRenderer.createBreakdownRow || ((type, description, amount) => `<tr><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;font-weight:600;vertical-align:top;">${esc(type)}</td><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;color:#4b5563;line-height:1.5;vertical-align:top;">${esc(description)}</td><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;text-align:right;font-variant-numeric:tabular-nums;width:120px;vertical-align:top;">${peso(amount)}</td></tr>`);
        const salaryIsProrated = !commissionOnly && salaryPaid !== Number(emp.salary);
        let breakdownRows = commissionOnly ? '' : row(
          salaryIsProrated ? 'Prorated Salary' : 'Basic Salary',
          salaryIsProrated ? 'Based on eligible scheduled workdays' : 'Monthly Basic Salary',
          salaryPaid
        );
        if (installationPayouts.thresholdEarnings > 0) {
          breakdownRows += `<tr><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;font-weight:600;">Earnings Past Threshold</td><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;color:#4b5563;line-height:1.5;">${esc(installationPayouts.thresholdDescription).replace(/\n/g, '<br>')}</td><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;text-align:right;font-variant-numeric:tabular-nums;width:120px;">${peso(installationPayouts.thresholdEarnings)}</td></tr>`;
        }
        if (installationPayouts.serviceEarnings > 0) {
          breakdownRows += `<tr><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;font-weight:600;">Service Job Earnings</td><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;color:#4b5563;line-height:1.5;">${esc(installationPayouts.serviceDescription).replace(/\n/g, '<br>')}</td><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;text-align:right;font-variant-numeric:tabular-nums;width:120px;">${peso(installationPayouts.serviceEarnings)}</td></tr>`;
        }
        if (commissions) breakdownRows += row('Commissions', 'Sales commissions', commissions);
        if (adjustments.length > 0) {
          const shortMonths = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const labels = adjustments.map(item => {
            const date = new Date(item.date);
            return esc(item.label || 'Adjustment') + (!isNaN(date.getTime()) ? ` (${shortMonths[date.getMonth()]} ${date.getDate()})` : '');
          }).join('<br>');
          const amounts = adjustments.map(item => peso(item.value)).join('<br>');
          breakdownRows += `<tr><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;font-weight:600;vertical-align:top;">Adjustments</td><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;color:#4b5563;vertical-align:top;line-height:1.5;">${labels}</td><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;text-align:right;font-variant-numeric:tabular-nums;vertical-align:top;line-height:1.5;width:120px;">${amounts}</td></tr>`;
        }
        if (specialSchedules.length > 0) {
          const labels = specialSchedules.map(item => `${esc(item.label || 'Special Payout')} (Day ${item.day})`).join('<br>');
          const amounts = specialSchedules.map(item => peso(item.value)).join('<br>');
          breakdownRows += `<tr><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;font-weight:600;vertical-align:top;">Special Payouts</td><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;color:#4b5563;vertical-align:top;line-height:1.5;">${labels}</td><td style="padding:0.75rem;border-bottom:1px solid #e5e7eb;text-align:right;font-variant-numeric:tabular-nums;vertical-align:top;line-height:1.5;width:120px;">${amounts}</td></tr>`;
        }
        if (glReimbursement !== 0) {
          breakdownRows += row('GL Reimbursement', 'Employee reimbursement from the general ledger', glReimbursement);
        }

        const scheduleRows = schedules.map(day => ({
          day,
          order: 1,
          label: `Cutoff Payout (Day ${day})`,
          value: commissionOnly
            ? (isOwner ? 0 : this._commsForSchedule(empId, day, mk, schedules, null, null, inactiveDate))
            : this.getProratedSalaryAllocation(emp, day, schedules, mk).value
              + this._adjsForSchedule(empId, day, mk, schedules)
              + (isOwner ? 0 : this._commsForSchedule(empId, day, mk, schedules))
              + (installationPayouts.cutoffPayouts[day] || 0)
              + this._glAdditionsForSchedule(empId, day, mk, schedules)
        }));
        const specialByDay = new Map();
        specialSchedules.forEach(item => {
          const day = Number(item.day) || 1;
          specialByDay.set(day, (specialByDay.get(day) || 0) + (Number(item.value) || 0));
        });
        specialByDay.forEach((value, day) => {
          scheduleRows.push({ day, order: 0, label: `Special Payout (Day ${day})`, value });
        });
        let department = emp.department || '—';
        let departmentHeadId = null;
        const matchedDepartment = (this.companyStructure?.departments || []).find(dept => dept.managerId === empId || (dept.subteams || []).some(team => team.managerId === empId || (team.colleagueIds || []).includes(empId)));
        if (matchedDepartment) {
          department = matchedDepartment.name;
          departmentHeadId = matchedDepartment.managerId;
        }
        let managerId = this.reportingToMap[empId] || emp.reporting_to;
        if (!managerId && departmentHeadId && departmentHeadId !== empId) managerId = departmentHeadId;
        const manager = this.employees.find(item => item.id === managerId);
        const reportingTo = manager ? [manager.first_name, manager.last_name].filter(Boolean).join(' ') : '—';
        const employeeName = [emp.first_name, emp.last_name].filter(Boolean).join(' ');
        const logoUrl = template.logoStyle === 'dark' ? profile.logoDark : profile.logoLight;
        const sheet = window.BKPayslipRenderer.createSheet({
          profile,
          template,
          logoUrl,
          monthText,
          employeeName,
          department,
          reportingTo,
          position: emp.title || '—',
          breakdownRowsHtml: breakdownRows,
          scheduleRows,
          totalPayout
        });
        sheet.innerHTML = sheet.innerHTML.replaceAll('₱', profile.currencySymbol || window.BKCurrency?.symbol || '₱');

        try {
          await window.BKPayslipRenderer.downloadSheet(
            sheet,
            `Payslip_${employeeName.replace(/\s+/g, '_')}_${monthText.replace(/\s+/g, '_')}.pdf`
          );
        } catch (error) {
          console.error('Unable to generate payslip PDF:', error);
          toast('The PDF could not be generated. Please try again.', 'error');
        }
      },

    };

    document.addEventListener('DOMContentLoaded', () => {
      App.init();
      if (typeof initNav === 'function') initNav();
    });
  </script>

  <!-- Hidden wrapper for generating payslip PDF -->
  <div id="payslip-hidden-wrapper" style="position: absolute; left: -9999px; top: -9999px; width: 210mm; height: 297mm; background: #fff;">
    <div id="payslip-a4-sheet"></div>
  </div>
</body>
