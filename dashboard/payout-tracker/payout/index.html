<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payout — Brightkey Portal</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/dashboard/payout-tracker/shared.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
  <style>
    /* ── Summary-table sticky columns (only needed on this page) ── */
    #summary-table .col-sticky-1 {
      position: sticky; left: 0; z-index: 10;
      width: 200px; min-width: 200px; max-width: 200px;
      background: var(--bg-surface);
      box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1);
    }
    #summary-table th.col-sticky-1 { background: var(--bg-elevated); z-index: 11; }

    #summary-table .col-sticky-2 {
      position: sticky; left: 200px; z-index: 10;
      width: 140px; min-width: 140px; max-width: 140px;
      background: var(--bg-surface);
      box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1);
    }
    #summary-table th.col-sticky-2 { background: var(--bg-elevated); z-index: 11; }

    #summary-table .col-sticky-3 {
      position: sticky; left: 340px; z-index: 10;
      width: 180px; min-width: 180px; max-width: 180px;
      background: var(--bg-surface);
    }
    #summary-table th.col-sticky-3 { background: var(--bg-elevated); z-index: 11; }
    #summary-table .col-sticky-3::after {
      content: "";
      position: absolute; top: 0; right: -8px; bottom: 0; width: 8px;
      background: linear-gradient(to right, rgba(0,0,0,0.08), rgba(0,0,0,0));
      pointer-events: none;
    }

    #summary-table tr.employee-row:hover td.col-sticky-1,
    #summary-table tr.employee-row:hover td.col-sticky-2,
    #summary-table tr.employee-row:hover td.col-sticky-3 { background: var(--bg-elevated); }
    #summary-table tr.inactive-employee-row td.col-name { color: var(--text-muted); }

    #summary-table tr.dept-header-row td { background: #f4fcfd !important; }
    #summary-table tr.team-header-row td { background: #f8fafc !important; }

    #summary-table .dept-header-sticky { position: sticky; left: 0; display: inline-block; padding-left: 1.5rem; }
    #summary-table .team-header-sticky { position: sticky; left: 0; display: inline-block; padding-left: 2.25rem; }

    #summary-table-container {
      max-height: calc(100vh - 240px);
      max-height: calc(100dvh - 240px);
      overflow: auto;
    }
    #summary-table {
      margin-bottom: 1rem;
    }

    /* ── Sticky Table Headers ── */
    #summary-table thead th {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-elevated, #fafafa);
      box-shadow: 0 1px 0 var(--border);
    }
    /* Sticky header columns need a higher z-index (101) to stay above other sticky components */
    #summary-table th.col-sticky-1 { z-index: 103 !important; }
    #summary-table th.col-sticky-2 { z-index: 102 !important; }
    #summary-table th.col-sticky-3 { z-index: 101 !important; }

    /* Decrease row heights a bit */
    #summary-table td, 
    #summary-table th {
      padding: 0.55rem 0.85rem !important;
    }
    #summary-table tr.dept-header-row td {
      padding-top: 0.7rem !important;
      padding-bottom: 0.7rem !important;
    }
    #summary-table tr.team-header-row td {
      padding-top: 0.5rem !important;
      padding-bottom: 0.5rem !important;
    }

    #payout-loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 110;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    #summary-table-container { position: relative; }
    .payout-loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-weight: 600;
    }
    .payout-loading-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid var(--border);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: payoutLoadingSpin 0.75s linear infinite;
    }
    @keyframes payoutLoadingSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="dash-layout">
    <aside class="dash-sidebar" id="dash-sidebar"></aside>
    <div class="dash-main">
      <div class="top-bar">
        <span class="top-bar-title">Payout Tracker</span>
        <div style="flex:1"></div>
        <span id="save-status" style="font-size:0.75rem; color:var(--text-muted);"></span>
      </div>

      <nav class="drawer-tabs" id="payout-nav">
        <a href="/dashboard/payout-tracker/payout"         class="tab-btn" data-page="payout">Payout</a>
        <a href="/dashboard/payout-tracker/salary"         class="tab-btn" data-page="salary">Salary</a>
        <a href="/dashboard/payout-tracker/special-payout" class="tab-btn" data-page="special-payout">Special Payout</a>
        <a href="/dashboard/payout-tracker/adjustments"    class="tab-btn" data-page="adjustments">Adjustments</a>
        <a href="/dashboard/payout-tracker/commissions"    class="tab-btn" data-page="commissions">Commission</a>
        <a href="/dashboard/payout-tracker/installations"  class="tab-btn" data-page="installations">Installation</a>
        <a href="/dashboard/payout-tracker/schedules"      class="tab-btn" data-page="schedules">Schedules</a>
        <a href="/dashboard/payout-tracker/payslip"        class="tab-btn" data-page="payslip">Payslip</a>
      </nav>

      <main style="overflow-y: auto; flex: 1; min-width: 0; width: 100%;">
        <div class="int-wrap">

          <!-- Month selector -->
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:0.75rem 1.25rem; width:100%; box-sizing:border-box;">
            <div style="display:flex; align-items:center; gap:1rem;">
              <button class="btn btn-outline btn-sm" id="btn-prev-month">&lt;</button>
              <span id="summary-month-display" style="font-size:0.88rem; font-weight:700; color:var(--text-primary); min-width:140px; text-align:center;"></span>
              <button class="btn btn-outline btn-sm" id="btn-next-month">&gt;</button>
            </div>
            <button class="btn btn-outline btn-sm" id="btn-prorated">Prorated</button>
          </div>

          <div class="table-card">
            <div class="table-wrap" id="summary-table-container">
              <div id="payout-loading-overlay" role="status" aria-live="polite" aria-label="Loading payout data">
                <div class="payout-loading-content">
                  <span class="payout-loading-spinner" aria-hidden="true"></span>
                  <span>Loading payout data</span>
                </div>
              </div>
              <table class="salary-table" id="summary-table">
                <thead>
                  <tr id="summary-table-header">
                    <th class="col-sticky-1">Employee Name</th>
                    <th class="col-sticky-2">Title / Position</th>
                    <th class="col-sticky-3">Payment Details</th>
                    <th>Salary</th>
                    <th>Commission</th>
                    <th>Reimbursements</th>
                    <th>Adjustments</th>
                    <th style="border-right:2px solid var(--border); width:1px; padding:0;"></th>
                  </tr>
                </thead>
                <tbody id="summary-table-body">
                  <tr><td colspan="10" style="text-align:center; padding:3rem; color:var(--text-muted);">Loading payout summary...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- Prorated Salary Modal -->
  <div class="modal-overlay" id="prorated-modal">
    <div class="modal" style="max-width:760px; width:min(760px, calc(100vw - 2rem)); padding:1.5rem; max-height:calc(100dvh - 2rem); overflow:hidden; display:flex; flex-direction:column;">
      <h3 style="font-size:1.1rem; font-weight:700; color:var(--text-primary); margin-bottom:0.35rem;">Prorated Salary</h3>
      <p id="prorated-modal-description" style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:1rem; line-height:1.5;"></p>
      <div style="overflow:auto; border:1px solid var(--border); border-radius:8px; flex:1; min-height:0;">
        <table style="width:100%; border-collapse:collapse; font-size:0.8rem;">
          <thead>
            <tr>
              <th style="text-align:left; padding:0.7rem;">Employee</th>
              <th style="text-align:left; padding:0.7rem;">Salary Cutoff Preview</th>
            </tr>
          </thead>
          <tbody id="prorated-employee-list"></tbody>
        </table>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:0.75rem; border-top:1px solid var(--border); padding-top:1rem; margin-top:1rem;">
        <button class="btn btn-outline btn-sm" id="btn-cancel-prorated">Cancel</button>
        <button class="btn btn-primary btn-sm" id="btn-apply-prorated">Apply Prorated</button>
      </div>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="/js/dashboard-ui.js?v=20260731-payslip-4"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/main.js?v=20260815-1"></script>
  <script src="/js/payout-snapshots.js?v=20260818-1"></script>
  <script>
    'use strict';

    // Active tab highlight
    (function () {
      const parts = window.location.pathname.split('/').filter(Boolean);
      let page = parts[parts.length - 1];
      if (page === 'index.html') page = parts[parts.length - 2];
      document.querySelectorAll('#payout-nav .tab-btn[data-page]').forEach(a => {
        if (a.dataset.page === page) a.classList.add('active');
      });
    })();

    const getSb = () => window.BKAuth.sb;

    const toast = (msg, type = 'success') => {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      c.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    };

    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const php = v => {
      if (v === null || v === undefined || v === '' || Number(v) === 0) return '—';
      return '₱' + Number(v).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    const App = {
      tenantId: null,
      companyId: null,
      employees: [],
      companyStructure: { departments: [] },
      reportingToMap: {},
      payoutSchedules: [],
      commissionSchedules: [],
      specialSchedules: [],
      regularPayoutState: {},
      specialPayoutState: {},
      commissionPayoutState: {},
      proratedSalaryState: {},
      adjustmentsList: [],
      commissionAssignments: [],
      bookingsList: [],
      payoutComponentCache: new Map(),
      payoutSystemCache: new Map(),

      selectedYear: new Date().getFullYear(),
      selectedMonth: new Date().getMonth(),

      saveTimeout: null,

      async init() {
        try {
          const authInfo = await window.BKAuth.checkRoleGate(['HR', 'Finance'], '../../../admin.html');
          if (!authInfo) return;
          this.tenantId = authInfo.tenantId;
          const { data: co } = await getSb().from('companies').select('id').eq('tenant_id', this.tenantId).limit(1).maybeSingle();
          this.companyId = co?.id || null;
          if (!this.companyId) { toast('Failed to resolve company.', 'error'); return; }

          this.loadMonthFromHash();
          this.updateMonthDisplay();
          this.syncMonthHash();
          await this.loadData();
          this.render();
          this.bindEvents();
        } catch (e) {
          console.error(e);
          toast('Initialization failed: ' + e.message, 'error');
        } finally {
          this.hideLoadingOverlay();
        }
      },

      hideLoadingOverlay() {
        const overlay = document.getElementById('payout-loading-overlay');
        if (overlay) overlay.style.display = 'none';
      },

      async loadData() {
        const sb = getSb();
        const settingKeys = [
          'company_structure', 'salary_tracker_config', 'regular_payout_state',
          'special_payout_state', 'commission_payout_state', 'prorated_salary_state',
          'installer_payout_settings', 'journal_account_employee_assignments'
        ];
        const settle = request => Promise.resolve(request).catch(error => ({ data: null, error }));
        const [settingsResult, employeesResult, adjustmentsResult, commissionsResult, bookingsResult, accountsResult] = await Promise.all([
          settle(sb.from('global_settings').select('key, value').eq('company_id', this.companyId).in('key', settingKeys)),
          settle(sb.from('employees')
            .select('id, first_name, middle_name, last_name, salary, employment_status, date_inactive, department, title, payout_details, payout_details_image, reporting_to, date_hired, shift_days, assignment')
            .eq('company_id', this.companyId)
            .limit(500)),
          settle(sb.from('employee_adjustments').select('id, employee_id, amount, date, label, paid').eq('company_id', this.companyId)),
          settle(sb.from('commission_assignments').select('employee_id, booking_id, product_index, amount, sku, rate_label').eq('company_id', this.companyId)),
          settle(sb.from('installation_bookings').select('*').eq('company_id', this.companyId)),
          settle(sb.from('journal_accounts').select('id, name').eq('company_id', this.companyId))
        ]);

        if (settingsResult.error) console.error('Error loading payout settings:', settingsResult.error);
        const settingsByKey = Object.fromEntries((settingsResult.data || []).map(row => [row.key, row.value]));

        this.companyStructure = settingsByKey.company_structure || { departments: [] };
        this.buildReportingToMap();
        const trackerConfig = settingsByKey.salary_tracker_config || {};
        this.payoutSchedules = trackerConfig.payoutSchedules || [15, 30];
        this.commissionSchedules = trackerConfig.commissionSchedules || [15, 30];
        this.specialSchedules = trackerConfig.specialSchedules || [];
        this.regularPayoutState = settingsByKey.regular_payout_state || {};
        this.specialPayoutState = settingsByKey.special_payout_state || {};
        this.commissionPayoutState = settingsByKey.commission_payout_state || {};
        this.proratedSalaryState = settingsByKey.prorated_salary_state || {};
        this.installerPayoutSettings = settingsByKey.installer_payout_settings || null;
        this.accountAssignments = settingsByKey.journal_account_employee_assignments?.assignments || {};

        if (employeesResult.error) console.error(employeesResult.error);
        this.employees = employeesResult.data || [];

        // Adjustments remain unbounded because all months are needed for per-schedule partitioning in the summary.
        if (adjustmentsResult.error) console.error(adjustmentsResult.error);
        this.adjustmentsList = (adjustmentsResult.data || []).map(adjustment => ({ id: adjustment.id, employeeId: adjustment.employee_id, value: adjustment.amount, date: adjustment.date, label: adjustment.label, paid: adjustment.paid }));

        if (commissionsResult.error) console.error(commissionsResult.error);
        this.commissionAssignments = commissionsResult.data || [];

        if (bookingsResult.error) console.error(bookingsResult.error);
        this.bookingsList = bookingsResult.data || [];

        if (accountsResult.error) console.error('Error loading journal accounts:', accountsResult.error);
        this.glAccountsMap = {};
        (accountsResult.data || []).forEach(account => {
          this.glAccountsMap[account.id] = account.name.toLowerCase();
        });

        await this.loadGeneralJournalEntries();
        this.payoutComponentCache.clear();
        this.payoutSystemCache.clear();
        await this.captureLegacyPaidPayouts();
      },

      getGeneralJournalWindow() {
        const cutoffs = [...this.payoutSchedules].map(Number).filter(Boolean).sort((a, b) => a - b);
        const finalCutoff = cutoffs[cutoffs.length - 1] || 30;
        const priorMonth = this.selectedMonth === 0 ? 11 : this.selectedMonth - 1;
        const priorYear = this.selectedMonth === 0 ? this.selectedYear - 1 : this.selectedYear;
        const priorDays = new Date(priorYear, priorMonth + 1, 0).getDate();
        const currentDays = new Date(this.selectedYear, this.selectedMonth + 1, 0).getDate();
        const pad = value => String(value).padStart(2, '0');
        const start = finalCutoff < priorDays
          ? `${priorYear}-${pad(priorMonth + 1)}-${pad(finalCutoff + 1)}`
          : `${this.selectedYear}-${pad(this.selectedMonth + 1)}-01`;
        let endYear = this.selectedYear, endMonth = this.selectedMonth + 1, endDay = finalCutoff + 1;
        if (finalCutoff >= currentDays) { endMonth += 1; endDay = 1; if (endMonth > 12) { endMonth = 1; endYear += 1; } }
        return { start, end: `${endYear}-${pad(endMonth)}-${pad(endDay)}` };
      },

      async loadGeneralJournalEntries() {
        const accountIds = Object.keys(this.accountAssignments || {}).filter(id => {
          const name = String(this.glAccountsMap?.[id] || '');
          return name.includes('due to');
        });
        if (!accountIds.length) { this.generalJournalEntries = []; return; }
        const { start, end } = this.getGeneralJournalWindow();
        try {
          const { data, error } = await getSb().from('general_journal')
            .select('id, date, account_id, debit, credit')
            .eq('company_id', this.companyId).in('account_id', accountIds)
            .gte('date', start).lt('date', end).order('id').limit(1000);
          if (error) throw error;
          this.generalJournalEntries = data || [];
        } catch (error) {
          this.generalJournalEntries = [];
          console.error('Error loading general journal entries:', error);
        }
      },

      getAssignedDoorsForBookingAndEmployee(b, empId) {
        const bookingIsDone = ['done', 'completed', 'finished'].includes(String(b.status || '').toLowerCase());
        let doorsArr = [];
        if (b.doors) {
          if (typeof b.doors === 'string') {
            try { doorsArr = JSON.parse(b.doors); } catch(_) {}
          } else if (Array.isArray(b.doors)) {
            doorsArr = b.doors;
          }
        }

        let bInsts = [];
        if (b.installers) {
          if (typeof b.installers === 'string') {
            try { bInsts = JSON.parse(b.installers); } catch(_) {}
          } else if (Array.isArray(b.installers)) {
            bInsts = b.installers;
          }
        }

        const isBookingLevelInstaller = bInsts.some(inst => inst && inst.id === empId) || 
                                        (b.installer_id && b.installer_id.split(' | ').includes(empId));

        const bookingHasDoorLevelInstallers = doorsArr.some(d => d && Array.isArray(d.installers) && d.installers.some(inst => inst && (inst.id || inst.name)));

        const assignedDoors = [];

        if (doorsArr.length === 0) {
          if (isBookingLevelInstaller) {
            let roles = [];
            const matchedBInsts = bInsts.filter(inst => inst && inst.id === empId);
            if (matchedBInsts.length > 0) {
              matchedBInsts.forEach(inst => {
                const r = inst.role || 'lead';
                if (!roles.includes(r)) roles.push(r);
              });
            } else if (b.installer_id) {
              const ids = b.installer_id.split(' | ');
              const myIdIdx = ids.indexOf(empId);
              if (myIdIdx !== -1) {
                roles.push(myIdIdx === 0 ? 'lead' : 'assist');
              }
            }
            if (roles.length === 0) roles.push('lead');
            
            let productsArr = [];
            if (b.products) {
              if (typeof b.products === 'string') {
                try { productsArr = JSON.parse(b.products); } catch(_) {}
              } else if (Array.isArray(b.products)) {
                productsArr = b.products;
              }
            }
            const skus = (b.product_skus || '').split(' | ').filter(Boolean);
            const activeSkus = productsArr.length > 0 
              ? productsArr.filter(p => !p.cancelled && p.sku !== 'ADD-ON LABOR').map(p => p.sku)
              : skus;

            assignedDoors.push({
              completed: bookingIsDone,
              roles: roles,
              skus: activeSkus,
              completed_at: b.completed_at || b.updated_at || b.created_at,
              scheduled_date: b.scheduled_date
            });
          }
          return assignedDoors;
        }

        let productsArr = [];
        if (b.products) {
          if (typeof b.products === 'string') {
            try { productsArr = JSON.parse(b.products); } catch(_) {}
          } else if (Array.isArray(b.products)) {
            productsArr = b.products;
          }
        }
        const skus = (b.product_skus || '').split(' | ');
        const anyDoorHasAttachedProducts = doorsArr.some(d => d && Array.isArray(d.products) && d.products.length > 0);
        const isSingleDoorGrouping = (doorsArr.length === 1 && productsArr.length > 0);
        const skuOccurrenceCount = new Map();

        doorsArr.forEach((door, index) => {
          let isAssignedToThisDoor = false;
          let roles = [];

          if (door && Array.isArray(door.installers)) {
            const matchedInsts = door.installers.filter(inst => inst && inst.id === empId);
            if (matchedInsts.length > 0) {
              isAssignedToThisDoor = true;
              matchedInsts.forEach(inst => {
                const r = inst.role || 'lead';
                if (!roles.includes(r)) roles.push(r);
              });
            }
          } else if (bookingHasDoorLevelInstallers) {
            isAssignedToThisDoor = false;
          } else {
            isAssignedToThisDoor = isBookingLevelInstaller;
            const matchedBInsts = bInsts.filter(inst => inst && inst.id === empId);
            if (matchedBInsts.length > 0) {
              matchedBInsts.forEach(inst => {
                const r = inst.role || 'lead';
                if (!roles.includes(r)) roles.push(r);
              });
            } else if (b.installer_id) {
              const ids = b.installer_id.split(' | ');
              const myIdIdx = ids.indexOf(empId);
              if (myIdIdx !== -1) {
                roles.push(myIdIdx === 0 ? 'lead' : 'assist');
              }
            }
          }

          if (isAssignedToThisDoor) {
            const doorSkus = [];
            if (anyDoorHasAttachedProducts && door) {
              const attachedSkus = door.products || [];
              attachedSkus.forEach(sku => {
                const matchingProds = productsArr.filter(p => p.sku === sku);
                const occurrenceIndex = skuOccurrenceCount.get(sku) || 0;
                const matchedProd = matchingProds[occurrenceIndex];
                if (matchedProd && !matchedProd.cancelled) {
                  doorSkus.push(matchedProd.sku);
                }
                skuOccurrenceCount.set(sku, occurrenceIndex + 1);
              });
            } else if (isSingleDoorGrouping) {
              productsArr.forEach(p => {
                if (p.sku !== 'ADD-ON LABOR' && !p.cancelled) {
                  doorSkus.push(p.sku);
                }
              });
            } else {
              if (productsArr[index] && !productsArr[index].cancelled) {
                doorSkus.push(productsArr[index].sku);
              } else if (skus[index]) {
                doorSkus.push(skus[index]);
              }
            }

            assignedDoors.push({
              completed: Boolean(door.completed) || bookingIsDone,
              roles: roles,
              skus: doorSkus,
              completed_at: door.completed_at || b.completed_at || b.updated_at || b.created_at,
              scheduled_date: b.scheduled_date
            });
          } else {
            if (anyDoorHasAttachedProducts && door) {
              const attachedSkus = door.products || [];
              attachedSkus.forEach(sku => {
                const occurrenceIndex = skuOccurrenceCount.get(sku) || 0;
                skuOccurrenceCount.set(sku, occurrenceIndex + 1);
              });
            }
          }
        });

        return assignedDoors;
      },

      calculateInstallerPayouts(empId, monthKey, sortedScheds = [15, 30]) {
        const payoutSettings = this.installerPayoutSettings || {
          installations_before_crediting: 15,
          lead_credit: 1.0,
          assist_credit: 0.5,
          lead_rate: 1000,
          assist_rate: 500,
          extra_services: [
            { sku: 'BASEPLATE-M', rate: 700 },
            { sku: 'BASEPLATE-S', rate: 700 }
          ]
        };

        const thresholdVal = payoutSettings.installations_before_crediting || 15;
        const leadWeight = payoutSettings.lead_credit !== undefined ? payoutSettings.lead_credit : 1.0;
        const assistWeight = payoutSettings.assist_credit !== undefined ? payoutSettings.assist_credit : 0.5;
        const ocularWeight = payoutSettings.ocular_credit !== undefined ? payoutSettings.ocular_credit : 0;
        const repairWeight = payoutSettings.repair_credit !== undefined ? payoutSettings.repair_credit : 0;
        const leadRateVal = payoutSettings.lead_rate || 1000;
        const assistRateVal = payoutSettings.assist_rate || 500;
        const ocularRateVal = payoutSettings.ocular_rate || 0;
        const repairRateVal = payoutSettings.repair_rate || 0;

        const extraServicesList = window.BKInstallerPayoutRules.serviceRules(payoutSettings);

        const eligibleBookings = this.bookingsList.filter(b => {
          if (!b.scheduled_date) return false;
          if (b.status === 'cancelled') return false;
          return true;
        });

        const doorJobs = [];
        eligibleBookings.forEach(b => {
          const assignmentSkus = String(b.product_skus || '')
            .split('|')
            .map((sku) => sku.trim().toLowerCase())
            .filter(Boolean);
          const orderNo = String(b.order_no || '').toUpperCase();
          const isDayOff = assignmentSkus.includes('day off') || orderNo.startsWith('DO-');
          const isBackjob = assignmentSkus.includes('backjob') || orderNo.startsWith('BJ-');
          const isOcular = assignmentSkus.includes('ocular');
          const isRepair = assignmentSkus.includes('repair');
          if (isDayOff || isBackjob) return;

          const assignedDoors = this.getAssignedDoorsForBookingAndEmployee(b, empId);
          assignedDoors.forEach(d => {
            if (d.completed) {
              doorJobs.push({ ...d, roles: isOcular ? ['ocular'] : isRepair ? ['repair'] : d.roles, assignmentDate: d.assigned_at || b.created_at || b.scheduled_date });
            }
          });
        });

        // Only Done assignments earn installation payout. Their scheduled
        // installation date controls earning order, cutoff, and rollover.
        doorJobs.sort((a, b) => new Date(a.scheduled_date) - new Date(b.scheduled_date));

        let completedMonthCredit = 0;
        let completedMonthLeadCount = 0;
        let completedMonthAssistCount = 0;
        let payoutEligibleCredit = 0;
        const settledCreditBySourceMonth = {};
        doorJobs.forEach(job => {
          const sourceMonth = String(job.scheduled_date || '').slice(0, 7);
          if (!sourceMonth) return;
          const bucket = this.getCutoffBucket(job.scheduled_date, sortedScheds);
          if (bucket?.monthKey !== sourceMonth) return;
          const weight = window.BKInstallerPayoutRules.creditForJob(payoutSettings, { roles: job.roles, skus: job.skus, assignmentDate: job.assignmentDate, workDate: job.scheduled_date });
          settledCreditBySourceMonth[sourceMonth] = (settledCreditBySourceMonth[sourceMonth] || 0) + weight;
        });
        let rolloverCredit = 0;
        doorJobs.forEach(job => {
          const sourceMonth = String(job.scheduled_date || '').slice(0, 7);
          const bucket = this.getCutoffBucket(job.scheduled_date, sortedScheds);
          const threshold = window.BKInstallerPayoutRules.thresholdForDate(payoutSettings, job.scheduled_date);
          if (!sourceMonth || sourceMonth === monthKey || bucket?.monthKey !== monthKey || (settledCreditBySourceMonth[sourceMonth] || 0) >= threshold) return;
          rolloverCredit += window.BKInstallerPayoutRules.creditForJob(payoutSettings, { roles: job.roles, skus: job.skus, assignmentDate: job.assignmentDate, workDate: job.scheduled_date });
        });
        const runningCreditBySourceMonth = {};
        let totalThresholdEarnings = 0;
        let totalServiceEarnings = 0;
        const cutoffPayouts = {};
        const rolloverCutoffPayouts = {};
        const serviceCounts = {};

        sortedScheds.forEach(day => {
          cutoffPayouts[day] = 0;
          rolloverCutoffPayouts[day] = 0;
        });

        doorJobs.forEach(job => {
          const ruleJob = { roles: job.roles, skus: job.skus, assignmentDate: job.assignmentDate, workDate: job.scheduled_date };
          const weight = window.BKInstallerPayoutRules.creditForJob(payoutSettings, ruleJob);
          const jobRate = window.BKInstallerPayoutRules.thresholdRateForJob(payoutSettings, ruleJob);

          // Determine threshold eligibility in the work's original calendar month.
          const sourceMonth = String(job.scheduled_date || '').slice(0, 7);
          if (!sourceMonth) return;
          const previousCredit = sourceMonth === monthKey
            ? (runningCreditBySourceMonth[sourceMonth] || rolloverCredit)
            : (runningCreditBySourceMonth[sourceMonth] || 0);
          const newCredit = previousCredit + weight;
          let thresholdPayForJob = 0;
          const jobThreshold = window.BKInstallerPayoutRules.thresholdForDate(payoutSettings, job.scheduled_date);
          const sourceReachedThreshold = sourceMonth === monthKey || (settledCreditBySourceMonth[sourceMonth] || 0) >= jobThreshold;
          if (sourceReachedThreshold && newCredit > jobThreshold) {
            thresholdPayForJob = jobRate;
          }
          runningCreditBySourceMonth[sourceMonth] = newCredit;

          // Completion belongs to the scheduled installation month. Cutoff
          // bucketing below controls only when that completed work is paid.
          // A Done July 31 installation remains a July completion but rolls
          // into the first August payout when July's final cutoff is the 30th.
          if (sourceMonth === monthKey) {
            completedMonthCredit += weight;
            if (job.roles.includes('lead')) completedMonthLeadCount++;
            else if (job.roles.includes('assist')) completedMonthAssistCount++;
          }

          const bucket = this.getCutoffBucket(job.scheduled_date, sortedScheds);
          if (!bucket || bucket.monthKey !== monthKey) return;
          payoutEligibleCredit += weight;

          let servicePayForJob = 0;
          window.BKInstallerPayoutRules.servicePayoutsForJob(payoutSettings, ruleJob).forEach(service => {
            serviceCounts[service.sku] = (serviceCounts[service.sku] || 0) + 1;
            servicePayForJob += service.amount;
          });

          totalThresholdEarnings += thresholdPayForJob;
          totalServiceEarnings += servicePayForJob;

          // Determine cutoff day
          const cutoffDay = bucket.day;
          
          if (cutoffPayouts[cutoffDay] !== undefined) {
            cutoffPayouts[cutoffDay] += (thresholdPayForJob + servicePayForJob);
            if (sourceMonth !== monthKey) {
              rolloverCutoffPayouts[cutoffDay] += (thresholdPayForJob + servicePayForJob);
            }
          } else {
            cutoffPayouts[sortedScheds[sortedScheds.length - 1]] += (thresholdPayForJob + servicePayForJob);
          }
        });

        let thresholdDescription = '';
        if (totalThresholdEarnings > 0) {
          thresholdDescription = `₱${leadRateVal.toLocaleString()} per extra work`;
        } else {
          thresholdDescription = `Threshold of ${thresholdVal} counts not reached`;
        }

        let serviceDescription = '';
        if (totalServiceEarnings > 0) {
          const parts = [];
          Object.keys(serviceCounts).forEach(sku => {
            const matched = extraServicesList.find(es => es.sku === sku);
            const rate = matched ? matched.rate : 0;
            parts.push(`₱${rate.toLocaleString()} per ${sku}`);
          });
          serviceDescription = parts.join('\n');
        } else {
          serviceDescription = 'No extra paid services recorded';
        }

        return {
          totalCredit: completedMonthCredit + rolloverCredit,
          rolloverCredit,
          completedLeadCount: completedMonthLeadCount,
          completedAssistCount: completedMonthAssistCount,
          payoutEligibleCredit,
          thresholdEarnings: totalThresholdEarnings,
          thresholdDescription,
          serviceEarnings: totalServiceEarnings,
          serviceDescription,
          totalInstallationPayout: totalThresholdEarnings + totalServiceEarnings,
          cutoffPayouts,
          rolloverCutoffPayouts
        };
      },

      monthKey() {
        return `${this.selectedYear}-${String(this.selectedMonth + 1).padStart(2, '0')}`;
      },

      isOwnerEmployee(emp) {
        return String(emp?.assignment || '').split(',').some(value => value.trim().toLowerCase() === 'owner');
      },

      isActiveEmployee(emp) {
        return String(emp?.employment_status || '').trim().toLowerCase() === 'active';
      },

      getInactiveDate(emp) {
        return String(emp?.date_inactive || '').slice(0, 10);
      },

      isRegularPayoutEmployee(emp, monthKey = this.monthKey()) {
        const [year, month] = String(monthKey).split('-').map(Number);
        if (!window.BKEmploymentPeriod.isHiredByMonthEnd(emp, year, month - 1)) return false;
        if (this.isActiveEmployee(emp)) return true;
        const inactiveMonth = this.getInactiveDate(emp).slice(0, 7);
        return Boolean(inactiveMonth) && monthKey <= inactiveMonth;
      },

      isCommissionOnlyEmployee(emp, monthKey = this.monthKey()) {
        return !this.isRegularPayoutEmployee(emp, monthKey)
          && !this.isOwnerEmployee(emp)
          && this._commissionForEmpMonth(emp.id, monthKey) > 0;
      },

      isCutoffEligibleForEmployee(emp, cutoffDay, monthKey = this.monthKey()) {
        const [year, month] = String(monthKey).split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate();
        const cutoffDate = `${monthKey}-${String(Math.min(Number(cutoffDay), daysInMonth)).padStart(2, '0')}`;
        if (!window.BKEmploymentPeriod.isHiredByDate(emp, cutoffDate)) return false;
        if (this.isActiveEmployee(emp)) return true;
        const inactiveDate = this.getInactiveDate(emp);
        if (!inactiveDate) return false;
        const inactiveMonth = inactiveDate.slice(0, 7);
        if (monthKey < inactiveMonth) return true;
        if (monthKey > inactiveMonth) return false;
        return cutoffDate <= inactiveDate;
      },

      getShiftWeekdays(shiftDays) {
        const value = String(shiftDays || '').toLowerCase().replace(/\s+/g, '');
        const tokenMap = {
          su: 0, sun: 0, sunday: 0,
          m: 1, mo: 1, mon: 1, monday: 1,
          t: 2, tu: 2, tue: 2, tuesday: 2,
          w: 3, we: 3, wed: 3, wednesday: 3,
          th: 4, thu: 4, thursday: 4,
          f: 5, fr: 5, fri: 5, friday: 5,
          s: 6, sa: 6, sat: 6, saturday: 6
        };
        const tokens = value.split(',').filter(Boolean);
        if (tokens.length > 0 && tokens.every(token => tokenMap[token] !== undefined)) {
          return new Set(tokens.map(token => tokenMap[token]));
        }
        if (value.includes('mon-sun') || value.includes('monday-sunday')) return new Set([0, 1, 2, 3, 4, 5, 6]);
        if (value.includes('mon-sat') || value.includes('monday-saturday')) return new Set([1, 2, 3, 4, 5, 6]);
        if (value.includes('tue-sat') || value.includes('tuesday-saturday')) return new Set([2, 3, 4, 5, 6]);
        return new Set([1, 2, 3, 4, 5]);
      },

      getProratedSalaryAllocation(emp, cutoffDay, sortedScheds, monthKey = this.monthKey(), forceSelected = null) {
        if (!this.isRegularPayoutEmployee(emp, monthKey)) return { value: 0, isProrated: false };
        const baseSalary = Number(emp.salary) || 0;
        const regularValue = baseSalary / (sortedScheds.length || 1);
        const selectedIds = this.proratedSalaryState[monthKey] || [];
        const isSelected = forceSelected === null ? selectedIds.includes(emp.id) : forceSelected;
        const hiredDate = String(emp.date_hired || '').slice(0, 10);

        if (!isSelected || !hiredDate.startsWith(monthKey)) {
          return { value: regularValue, isProrated: false };
        }

        const hireDay = Number(hiredDate.slice(8, 10));
        const targetIndex = sortedScheds.findIndex(day => Number(day) >= hireDay);
        const cutoffIndex = sortedScheds.findIndex(day => Number(day) === Number(cutoffDay));

        if (targetIndex === -1 || cutoffIndex < targetIndex) {
          return { value: 0, isProrated: true };
        }
        if (cutoffIndex > targetIndex) {
          return { value: regularValue, isProrated: false };
        }

        const [periodYear, periodMonth] = String(monthKey).split('-').map(Number);
        const daysInMonth = new Date(periodYear, periodMonth, 0).getDate();
        const periodEnd = cutoffIndex === sortedScheds.length - 1
          ? daysInMonth
          : Math.min(Number(cutoffDay), daysInMonth);
        const reportingDays = this.getShiftWeekdays(emp.shift_days);
        let totalScheduledWorkdays = 0;
        let payableDays = 0;
        for (let day = 1; day <= daysInMonth; day++) {
          const weekday = new Date(periodYear, periodMonth - 1, day).getDay();
          if (!reportingDays.has(weekday)) continue;
          totalScheduledWorkdays++;
          if (day >= hireDay && day <= periodEnd) payableDays++;
        }

        return {
          value: totalScheduledWorkdays > 0
            ? baseSalary * (payableDays / totalScheduledWorkdays)
            : 0,
          isProrated: true,
          payableDays,
          totalScheduledWorkdays
        };
      },

      getEmployeeSalaryTotal(emp, sortedScheds, monthKey = this.monthKey()) {
        return sortedScheds.reduce((sum, day) => sum + this.getProratedSalaryAllocation(emp, day, sortedScheds, monthKey).value, 0);
      },

      openProratedModal() {
        const mk = this.monthKey();
        const eligible = this.employees.filter(emp => String(emp.date_hired || '').slice(0, 7) === mk);
        const selected = new Set(this.proratedSalaryState[mk] || []);
        const sortedScheds = [...this.payoutSchedules].sort((a, b) => a - b);
        const tbody = document.getElementById('prorated-employee-list');
        document.getElementById('prorated-modal-description').textContent = `Select employees hired in ${MONTHS[this.selectedMonth]} ${this.selectedYear}. Earlier cutoffs become zero, the first eligible cutoff is prorated, and later cutoffs remain regular.`;

        tbody.innerHTML = eligible.length ? eligible.map(emp => {
          const name = [emp.first_name, emp.last_name].filter(Boolean).join(' ');
          const checked = selected.has(emp.id);
          const preview = sortedScheds.map(day => {
            const allocation = this.getProratedSalaryAllocation(emp, day, sortedScheds, mk, checked);
            const label = allocation.isProrated ? 'Pro Sal' : 'Sal';
            const value = allocation.isProrated && allocation.value === 0 ? '₱0.00' : php(allocation.value);
            return `<div><strong>Day ${day}:</strong> ${label}: ${esc(value)}</div>`;
          }).join('');
          return `<tr style="border-bottom:1px solid var(--border);">
            <td style="padding:0.75rem; vertical-align:top;">
              <label style="display:flex; align-items:flex-start; gap:0.55rem; cursor:pointer;">
                <input type="checkbox" class="prorated-employee-checkbox" value="${esc(emp.id)}" ${checked ? 'checked' : ''} onchange="App.refreshProratedPreview()">
                <span><strong>${esc(name || 'Unnamed Employee')}</strong><br><span style="font-size:0.72rem;color:var(--text-muted);">Hired ${esc(emp.date_hired || 'N/A')} · ${esc(emp.shift_days || 'Mon-Fri')}</span></span>
              </label>
            </td>
            <td class="prorated-preview" data-emp-id="${esc(emp.id)}" style="padding:0.75rem; vertical-align:top; line-height:1.55; font-variant-numeric:tabular-nums;">${preview}</td>
          </tr>`;
        }).join('') : `<tr><td colspan="2" style="padding:2rem;text-align:center;color:var(--text-muted);">No employees were hired in this month.</td></tr>`;
        document.getElementById('prorated-modal').classList.add('open');
      },

      refreshProratedPreview() {
        const mk = this.monthKey();
        const sortedScheds = [...this.payoutSchedules].sort((a, b) => a - b);
        document.querySelectorAll('.prorated-preview').forEach(cell => {
          const emp = this.employees.find(item => item.id === cell.dataset.empId);
          const checkbox = document.querySelector(`.prorated-employee-checkbox[value="${cell.dataset.empId}"]`);
          if (!emp || !checkbox) return;
          cell.innerHTML = sortedScheds.map(day => {
            const allocation = this.getProratedSalaryAllocation(emp, day, sortedScheds, mk, checkbox.checked);
            const label = allocation.isProrated ? 'Pro Sal' : 'Sal';
            const value = allocation.isProrated && allocation.value === 0 ? '₱0.00' : php(allocation.value);
            return `<div><strong>Day ${day}:</strong> ${label}: ${esc(value)}</div>`;
          }).join('');
        });
      },

      async applyProratedSelection() {
        const mk = this.monthKey();
        const selectedIds = [...document.querySelectorAll('.prorated-employee-checkbox:checked')].map(input => input.value);
        this.proratedSalaryState = { ...this.proratedSalaryState, [mk]: selectedIds };
        const btn = document.getElementById('btn-apply-prorated');
        btn.disabled = true;
        try {
          const { error } = await getSb().from('global_settings').upsert({
            company_id: this.companyId,
            key: 'prorated_salary_state',
            value: this.proratedSalaryState
          }, { onConflict: 'company_id,key' });
          if (error) throw error;
          document.getElementById('prorated-modal').classList.remove('open');
          this.payoutComponentCache.clear();
          this.payoutSystemCache.clear();
          this.render();
          toast('Prorated salary settings applied.');
        } catch (error) {
          console.error(error);
          toast('Prorated settings could not be saved. Please try again.', 'error');
        } finally {
          btn.disabled = false;
        }
      },

      updateMonthDisplay() {
        const el = document.getElementById('summary-month-display');
        if (el) el.textContent = `${MONTHS[this.selectedMonth]} ${this.selectedYear}`;
      },

      loadMonthFromHash() {
        const match = window.location.hash.match(/^#(0[1-9]|1[0-2])-(\d{4})$/);
        if (!match) return false;
        this.selectedMonth = Number(match[1]) - 1;
        this.selectedYear = Number(match[2]);
        return true;
      },

      syncMonthHash() {
        const hash = `#${String(this.selectedMonth + 1).padStart(2, '0')}-${this.selectedYear}`;
        if (window.location.hash === hash) return;
        window.history.replaceState(null, '', `${window.location.pathname}${window.location.search}${hash}`);
      },

      async changeMonth(diff) {
        let m = this.selectedMonth + diff;
        let y = this.selectedYear;
        if (m < 0)  { m = 11; y--; }
        if (m > 11) { m = 0;  y++; }
        this.selectedMonth = m;
        this.selectedYear  = y;
        this.updateMonthDisplay();
        this.syncMonthHash();
        await this.loadGeneralJournalEntries();
        this.render();
      },

      bindEvents() {
        document.getElementById('btn-prev-month').addEventListener('click', () => this.changeMonth(-1));
        document.getElementById('btn-next-month').addEventListener('click', () => this.changeMonth(1));
        document.getElementById('btn-prorated').addEventListener('click', () => this.openProratedModal());
        document.getElementById('btn-cancel-prorated').addEventListener('click', () => document.getElementById('prorated-modal').classList.remove('open'));
        document.getElementById('btn-apply-prorated').addEventListener('click', () => this.applyProratedSelection());
        window.addEventListener('hashchange', async () => {
          if (!this.loadMonthFromHash()) return;
          this.updateMonthDisplay();
          await this.loadGeneralJournalEntries();
          this.render();
        });
      },

      buildReportingToMap() {
        this.reportingToMap = {};
        (this.companyStructure?.departments || []).forEach(dept => {
          const deptHeadId = dept.managerId;
          (dept.subteams || []).forEach(sub => {
            const subMgrId = sub.managerId;
            if (subMgrId && deptHeadId) this.reportingToMap[subMgrId] = deptHeadId;
            (sub.colleagueIds || []).forEach(id => { this.reportingToMap[id] = subMgrId || deptHeadId; });
          });
        });
      },

      groupEmployees(employees = this.employees) {
        const empDeptMap = {};
        const empSubteamsMap = {};
        const deptHeadsSet = new Set();
        (this.companyStructure?.departments || []).forEach(dept => {
          const deptName = dept.name;
          if (dept.managerId) { empDeptMap[dept.managerId] = deptName; deptHeadsSet.add(dept.managerId); }
          (dept.subteams || []).forEach(sub => {
            const subName = sub.name;
            if (sub.managerId) {
              empDeptMap[sub.managerId] = deptName;
              empSubteamsMap[sub.managerId] = empSubteamsMap[sub.managerId] || [];
              empSubteamsMap[sub.managerId].push(subName);
            }
            (sub.colleagueIds || []).forEach(id => {
              empDeptMap[id] = deptName;
              empSubteamsMap[id] = empSubteamsMap[id] || [];
              empSubteamsMap[id].push(subName);
            });
          });
        });

        const grouped = {};
        const unassigned = [];
        const selectedMonthKey = this.monthKey();
        employees.forEach(emp => {
          const hireMonthKey = String(emp.date_hired || '').slice(0, 7);
          if (hireMonthKey && hireMonthKey > selectedMonthKey) return;

          const dept = empDeptMap[emp.id] || emp.department || '';
          const subs = empSubteamsMap[emp.id] || [];
          if (!dept) { unassigned.push(emp); return; }
          if (!grouped[dept]) grouped[dept] = {};
          if (deptHeadsSet.has(emp.id)) {
            grouped[dept]['Department Head'] = grouped[dept]['Department Head'] || [];
            grouped[dept]['Department Head'].push(emp);
          } else if (subs.length === 0) {
            grouped[dept]['_unassigned_subteam'] = grouped[dept]['_unassigned_subteam'] || [];
            grouped[dept]['_unassigned_subteam'].push(emp);
          } else {
            subs.forEach(sub => {
              grouped[dept][sub] = grouped[dept][sub] || [];
              grouped[dept][sub].push(emp);
            });
          }
        });
        return { grouped, unassigned };
      },

      isPastDay(day) {
        const t = new Date();
        if (this.selectedYear < t.getFullYear()) return true;
        if (this.selectedYear > t.getFullYear()) return false;
        if (this.selectedMonth < t.getMonth()) return true;
        if (this.selectedMonth > t.getMonth()) return false;
        return day < t.getDate();
      },

      getScheduleDayForItemDay(itemDay, sortedScheds) {
        if (!sortedScheds.length) return 30;
        for (const s of sortedScheds) { if (itemDay <= s) return s; }
        return sortedScheds[sortedScheds.length - 1];
      },

      getCutoffBucket(dateValue, schedules = this.payoutSchedules) {
        const match = String(dateValue || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!match) return null;
        let year = Number(match[1]);
        let month = Number(match[2]);
        const day = Number(match[3]);
        const sorted = [...schedules].map(Number).filter(Boolean).sort((a, b) => a - b);
        if (!sorted.length) sorted.push(30);
        const cutoffDay = sorted.find(cutoff => day <= cutoff);
        if (cutoffDay) return { monthKey: `${year}-${String(month).padStart(2, '0')}`, day: cutoffDay };
        month += 1;
        if (month > 12) { month = 1; year += 1; }
        return { monthKey: `${year}-${String(month).padStart(2, '0')}`, day: sorted[0] };
      },

      getPayoutComponents(empId, schedDay, mk) {
        const cacheKey = `${mk}|${empId}|${Number(schedDay)}`;
        if (this.payoutComponentCache.has(cacheKey)) return this.payoutComponentCache.get(cacheKey);
        const emp = this.employees.find(item => item.id === empId);
        if (!emp) return { sourceValue: 0, displayedValue: 0 };
        const schedules = [...(this.payoutSchedules.length ? this.payoutSchedules : [15, 30])]
          .map(Number).sort((a, b) => a - b);
        const isOwner = this.isOwnerEmployee(emp);
        const commissionOnly = this.isCommissionOnlyEmployee(emp, mk);
        const inactiveDate = commissionOnly || this.isActiveEmployee(emp) ? null : this.getInactiveDate(emp);
        const eligible = commissionOnly
          ? this._commsForSchedule(empId, schedDay, mk, schedules, null, null, inactiveDate) > 0
          : this.isCutoffEligibleForEmployee(emp, schedDay, mk);
        if (!eligible) {
          const empty = { sourceValue: 0, displayedValue: 0 };
          this.payoutComponentCache.set(cacheKey, empty);
          return empty;
        }

        const salary = commissionOnly ? 0 : this.getProratedSalaryAllocation(emp, schedDay, schedules, mk).value;
        const adjustments = commissionOnly ? 0 : this._adjsForSchedule(empId, schedDay, mk, schedules);
        const commissions = isOwner ? 0 : this._commsForSchedule(empId, schedDay, mk, schedules, null, null, inactiveDate);
        const installation = commissionOnly ? 0 : (this.calculateInstallerPayouts(empId, mk, schedules).cutoffPayouts[schedDay] || 0);
        const glAdditions = commissionOnly ? 0 : this._glAdditionsForSchedule(empId, schedDay, mk, schedules);
        const glDeductions = commissionOnly ? 0 : this._glDeductionsForSchedule(empId, schedDay, mk, schedules);
        const sourceValue = salary + adjustments + commissions + installation;
        const result = {
          sourceValue,
          displayedValue: sourceValue + glAdditions - glDeductions
        };
        this.payoutComponentCache.set(cacheKey, result);
        return result;
      },

      getReconcilablePayoutCentavos(empId, mk, schedDay) {
        return Math.round(this.getPayoutComponents(empId, schedDay, mk).sourceValue * 100);
      },

      getSystemAdjustment(empId, mk, schedDay) {
        const cacheKey = `${mk}|${empId}|${Number(schedDay)}`;
        if (!this.payoutSystemCache.has(cacheKey)) {
          this.payoutSystemCache.set(
            cacheKey,
            window.BKPayoutSnapshots.systemAdjustment(this, empId, mk, schedDay)
          );
        }
        return this.payoutSystemCache.get(cacheKey);
      },

      async captureLegacyPaidPayouts() {
        const mk = this.monthKey();
        const state = this.regularPayoutState[mk];
        if (!state) return;
        let changed = false;
        Object.entries(state).forEach(([key, entry]) => {
          if (entry !== true) return;
          const separator = key.lastIndexOf('_');
          const empId = key.slice(0, separator);
          const day = Number(key.slice(separator + 1));
          const values = this.getPayoutComponents(empId, day, mk);
          state[key] = window.BKPayoutSnapshots.createSnapshot({
            sourceValue: values.sourceValue,
            paidValue: values.displayedValue,
            systemSources: {}
          });
          changed = true;
        });
        if (!changed) return;
        this.payoutSystemCache.clear();
        const { error } = await getSb().from('global_settings').upsert({
          key: 'regular_payout_state',
          company_id: this.companyId,
          value: this.regularPayoutState
        }, { onConflict: 'company_id,key' });
        if (error) throw error;
      },

      // ── Render ──
      render() {
        const header = document.getElementById('summary-table-header');
        const tbody  = document.getElementById('summary-table-body');
        if (!header || !tbody) return;

        const mk = this.monthKey();
        const monthSpecialSchedules = window.BKSpecialPayoutHistory.forMonth(this.specialSchedules, mk);
        const specialDays  = [...new Set(monthSpecialSchedules.map(s => Number(s.day)))].sort((a, b) => a - b);
        const sortedScheds = [...this.payoutSchedules].sort((a, b) => a - b);
        const colspan = 10 + specialDays.length + sortedScheds.length + 2;

        let headerHtml = `
          <th class="col-sticky-1">Employee Name</th>
          <th class="col-sticky-2">Title / Position</th>
          <th class="col-sticky-3">Payment Details</th>
          <th style="text-align:right;">Salary</th>
          <th style="text-align:right;">Commission</th>
          <th style="text-align:right;">Installation</th>
          <th style="text-align:right;">Adjustments</th>
          <th style="text-align:right;">GL Reimb</th>
          <th style="text-align:right;">GL Cash Adv</th>
          <th style="border-right:2px solid var(--border); width:1px; padding:0;"></th>
        `;
        specialDays.forEach(d => { headerHtml += `<th style="text-align:right;">Special (Day ${d})</th>`; });
        sortedScheds.forEach(d => { headerHtml += `<th style="text-align:right;">Payout (Day ${d})</th>`; });
        headerHtml += `<th style="text-align:right; background: linear-gradient(rgba(161,161,170,0.15), rgba(161,161,170,0.15)), var(--bg-elevated, #fafafa) !important;">Grand Total</th>`;
        headerHtml += `<th style="width:100px; text-align:center;">Action</th>`;
        header.innerHTML = headerHtml;

        const payoutEmployees = this.employees.filter(emp =>
          this.isRegularPayoutEmployee(emp, mk)
          || this.isCommissionOnlyEmployee(emp, mk)
          || sortedScheds.some(day => this.getSystemAdjustment(emp.id, mk, day).value !== 0)
        );
        const { grouped, unassigned } = this.groupEmployees(payoutEmployees);
        let bodyHtml = '';

        // Aggregators for total row
        let sumBaseSalary = 0;
        let sumComms = 0;
        let sumInstPayouts = 0;
        let sumAdjs = 0;
        let sumGlReimbs = 0;
        let sumGlCashAdv = 0;
        let sumSpecialDays = {};
        let sumPayoutDays = {};
        specialDays.forEach(day => sumSpecialDays[day] = 0);
        sortedScheds.forEach(day => sumPayoutDays[day] = 0);
        let sumGrandTotal = 0;

        const renderEmpRow = (emp) => {
          const isOwner = this.isOwnerEmployee(emp);
          const hasSystemOnlyPayout = !this.isRegularPayoutEmployee(emp, mk)
            && sortedScheds.some(day => this.getSystemAdjustment(emp.id, mk, day).value !== 0);
          const commissionOnly = this.isCommissionOnlyEmployee(emp, mk) || hasSystemOnlyPayout;
          const inactiveDate = commissionOnly || this.isActiveEmployee(emp) ? null : this.getInactiveDate(emp);
          const baseSalary    = commissionOnly ? 0 : (emp.salary || 0);
          const positionText  = emp.title || '';
          const detailsText   = emp.payout_details || '';
          const detailsImage  = emp.payout_details_image || '';

          let detailsHtml = '';
          if (detailsText) {
            const isUrl   = /^(https?:\/\/|\/)/.test(detailsText.trim());
            const isImage = isUrl && /\.(png|jpe?g|gif|webp|bmp|svg)(\?.*)?$/i.test(detailsText.trim());
            detailsHtml = isImage
              ? `<a href="${esc(detailsText.trim())}" target="_blank" style="color:var(--cyan); font-weight:600; text-decoration:underline;">View</a>`
              : `<div style="white-space:pre-wrap; max-width:180px;">${esc(detailsText)}</div>`;
          }
          if (detailsImage) detailsHtml += `${detailsHtml ? ' / ' : ''}<a href="${esc(detailsImage)}" target="_blank" style="color:var(--cyan); font-weight:600; text-decoration:underline;">View</a>`;
          if (!detailsHtml) detailsHtml = '—';

          // Commission for this month
          const empComms = isOwner ? 0 : sortedScheds.reduce((sum, day) => {
            if (!commissionOnly && !this.isCutoffEligibleForEmployee(emp, day, mk)) return sum;
            return sum + this._commsForSchedule(emp.id, day, mk, sortedScheds, null, null, inactiveDate);
          }, 0);
          // Adjustments for this month
          const empAdjs = commissionOnly ? 0 : sortedScheds.reduce((sum, day) => this.isCutoffEligibleForEmployee(emp, day, mk) ? sum + this._adjsForSchedule(emp.id, day, mk, sortedScheds) : sum, 0);
          const empGlAdd = commissionOnly ? 0 : sortedScheds.reduce((sum, day) => this.isCutoffEligibleForEmployee(emp, day, mk) ? sum + this._glAdditionsForSchedule(emp.id, day, mk, sortedScheds) : sum, 0);
          const empGlDed = commissionOnly ? 0 : sortedScheds.reduce((sum, day) => this.isCutoffEligibleForEmployee(emp, day, mk) ? sum + this._glDeductionsForSchedule(emp.id, day, mk, sortedScheds) : sum, 0);

          // Add to aggregators
          sumBaseSalary += baseSalary;
          sumComms += empComms;
          sumAdjs += empAdjs;
          sumGlReimbs += empGlAdd;
          sumGlCashAdv += empGlDed;

          // Special payout cells
          let specialCellsHtml = '';
          let totalSpecials = 0;
          specialDays.forEach(day => {
            const specVal = isOwner || commissionOnly ? 0 : monthSpecialSchedules.filter(s => s.employeeId === emp.id && Number(s.day) === day).reduce((s, x) => s + (Number(x.value) || 0), 0);
            const isEligible = !commissionOnly && this.isCutoffEligibleForEmployee(emp, day, mk);
            if (isEligible) {
              totalSpecials += specVal;
              sumSpecialDays[day] += specVal;
            }
            if (specVal > 0) {
              const isPaid = this.specialPayoutState[mk]?.[`${emp.id}_${day}`] || false;
              const isPast = this.isPastDay(day);
              specialCellsHtml += `<td style="text-align:right;"><div class="payout-cell-container${isEligible ? '' : ' grayed-out'}" style="display:inline-flex;align-items:center;justify-content:flex-end;gap:0.4rem;width:100%;">
                ${isEligible ? `<input type="checkbox" class="payout-checkbox" ${isPaid ? 'checked' : ''} onchange="App.toggleSpecialPayoutCheck('${emp.id}',${day},this.checked)">` : ''}
                <span class="payout-val ${isEligible && isPast && !isPaid ? 'overdue' : ''}" id="val-spec-${emp.id}-${day}" style="font-variant-numeric:tabular-nums; ${isPaid ? 'text-decoration:line-through;opacity:0.5;' : ''}">${esc(php(specVal))}</span>
              </div></td>`;
            } else {
              specialCellsHtml += `<td style="text-align:right;color:var(--text-muted);">—</td>`;
            }
          });

          // Payout columns
          let payoutCellsHtml = '';
          const instPayouts = isOwner || commissionOnly
            ? { totalInstallationPayout: 0, cutoffPayouts: {} }
            : this.calculateInstallerPayouts(emp.id, mk, sortedScheds);
          const eligibleInstallationTotal = sortedScheds.reduce((sum, day) => this.isCutoffEligibleForEmployee(emp, day, mk) ? sum + (instPayouts.cutoffPayouts[day] || 0) : sum, 0);
          let employeePayoutDaysTotal = 0;
          sumInstPayouts += eligibleInstallationTotal;
          
          sortedScheds.forEach((day, sIdx) => {
            const regularCutoffEligible = this.isCutoffEligibleForEmployee(emp, day, mk);
            const salaryAllocation = this.getProratedSalaryAllocation(emp, day, sortedScheds, mk);
            const salaryPortion = salaryAllocation.value;
            const adjsVal  = commissionOnly ? 0 : this._adjsForSchedule(emp.id, day, mk, sortedScheds);
            const commsVal  = isOwner ? 0 : this._commsForSchedule(emp.id, day, mk, sortedScheds, null, null, inactiveDate);
            let isEligible = commissionOnly ? commsVal > 0 : regularCutoffEligible;
            const instPortion = commissionOnly ? 0 : (instPayouts.cutoffPayouts[day] || 0);
            const glAddVal = commissionOnly ? 0 : this._glAdditionsForSchedule(emp.id, day, mk, sortedScheds);
            const glDedVal = commissionOnly ? 0 : this._glDeductionsForSchedule(emp.id, day, mk, sortedScheds);
            const rolledComms = isOwner ? 0 : this._commsForSchedule(emp.id, day, mk, sortedScheds, null, true, inactiveDate);
            const rolledInst = commissionOnly ? 0 : (instPayouts.rolloverCutoffPayouts?.[day] || 0);
            const rolledAdjs = commissionOnly ? 0 : this._adjsForSchedule(emp.id, day, mk, sortedScheds, true);
            const rolledGlAdd = commissionOnly ? 0 : this._glAdditionsForSchedule(emp.id, day, mk, sortedScheds, true);
            const rolledGlDed = commissionOnly ? 0 : this._glDeductionsForSchedule(emp.id, day, mk, sortedScheds, true);
            
            const sourceSchedVal = salaryPortion + adjsVal + commsVal + instPortion;
            const liveSchedVal = sourceSchedVal + glAddVal - glDedVal;
            const payoutEntry = this.regularPayoutState[mk]?.[`${emp.id}_${day}`];
            const isPaid = window.BKPayoutSnapshots.isPaid(payoutEntry);
            const systemResult = isPaid && window.BKPayoutSnapshots.isSnapshot(payoutEntry)
              ? {
                  value: window.BKPayoutSnapshots.fromCents(
                    Object.values(payoutEntry.system_sources || {}).reduce((sum, value) => sum + (Number(value) || 0), 0)
                  )
                }
              : this.getSystemAdjustment(emp.id, mk, day);
            if (commissionOnly && systemResult.value !== 0) isEligible = true;
            const displayedSchedVal = isPaid && window.BKPayoutSnapshots.isSnapshot(payoutEntry)
              ? window.BKPayoutSnapshots.fromCents(payoutEntry.paid_value_centavos)
              : liveSchedVal + systemResult.value;
            const totalSchedVal = isEligible ? displayedSchedVal : 0;
            employeePayoutDaysTotal += totalSchedVal;
            sumPayoutDays[day] += totalSchedVal;
            const isPast = this.isPastDay(day);

            const breakdownItems = [];
            if (salaryAllocation.isProrated) breakdownItems.push(`Pro Sal: ${salaryPortion === 0 ? '₱0.00' : php(salaryPortion)}`);
            else if (salaryPortion > 0) breakdownItems.push(`Sal: ${php(salaryPortion)}`);
            if (commsVal - rolledComms > 0) breakdownItems.push(`Com: ${php(commsVal - rolledComms)}`);
            if (rolledComms > 0) breakdownItems.push(`Rol Com: ${php(rolledComms)}`);
            if (instPortion - rolledInst > 0) breakdownItems.push(`Inst: ${php(instPortion - rolledInst)}`);
            if (rolledInst > 0) breakdownItems.push(`Rol Inst: ${php(rolledInst)}`);
            if (adjsVal - rolledAdjs !== 0) breakdownItems.push(`Adj: ${php(adjsVal - rolledAdjs)}`);
            if (rolledAdjs !== 0) breakdownItems.push(`Rol Adj: ${php(rolledAdjs)}`);
            if (glAddVal - rolledGlAdd > 0) breakdownItems.push(`Reimb: ${php(glAddVal - rolledGlAdd)}`);
            if (rolledGlAdd > 0) breakdownItems.push(`Rol Reimb: ${php(rolledGlAdd)}`);
            if (glDedVal - rolledGlDed > 0) breakdownItems.push(`Cash Adv: -${php(glDedVal - rolledGlDed)}`);
            if (rolledGlDed > 0) breakdownItems.push(`Rol Cash Adv: -${php(rolledGlDed)}`);
            if (systemResult.value !== 0) breakdownItems.push(`System: ${php(systemResult.value)}`);
            
            const breakdownHtml = breakdownItems.length > 0 
              ? `<div class="payout-breakdown" style="font-size:0.68rem; color:var(--text-muted); line-height:1.2; text-align:right; font-family:var(--font); width:100%; font-variant-numeric:tabular-nums;">${breakdownItems.join('<br>')}</div>` 
              : '';

            payoutCellsHtml += `<td style="text-align:right;">
              <div class="payout-cell-container${isEligible ? '' : ' grayed-out'}" style="display:flex; flex-direction:column; align-items:flex-end; gap:0.15rem; min-width:90px; padding:0.25rem 0; width:100%;">
                <div style="display:inline-flex; align-items:center; justify-content:flex-end; gap:0.4rem; width:100%;">
                  ${isEligible ? `<input type="checkbox" class="payout-checkbox" ${isPaid ? 'checked' : ''} onchange="App.togglePayoutCheck('${emp.id}',${day},this.checked)">` : ''}
                  <span class="payout-val ${isEligible && isPast && !isPaid ? 'overdue' : ''}" id="val-${emp.id}-${day}" style="font-variant-numeric:tabular-nums; ${isPaid ? 'text-decoration:line-through;opacity:0.5;' : ''}" title="${esc(breakdownItems.join('\n'))}">${esc(php(displayedSchedVal))}</span>
                </div>
                ${breakdownHtml}
              </div>
            </td>`;
          });

          const grandTotal = employeePayoutDaysTotal + totalSpecials;
          sumGrandTotal += grandTotal;

          return `<tr class="employee-row${this.isActiveEmployee(emp) ? '' : ' inactive-employee-row'}" data-emp-id="${esc(emp.id)}">
            <td class="col-name col-sticky-1">${esc([emp.first_name, emp.last_name].filter(Boolean).join(' '))}</td>
            <td class="col-sticky-2"><div style="font-size:0.75rem;color:var(--text-secondary);">${esc(positionText || '—')}</div></td>
            <td class="col-sticky-3"><div style="font-size:0.75rem;color:var(--text-secondary);">${detailsHtml}</div></td>
            <td style="text-align:right; font-variant-numeric:tabular-nums;">${esc(php(baseSalary))}</td>
            <td style="text-align:right; font-variant-numeric:tabular-nums;">${esc(php(empComms))}</td>
            <td style="text-align:right; font-variant-numeric:tabular-nums;">${esc(php(eligibleInstallationTotal))}</td>
            <td style="text-align:right; font-variant-numeric:tabular-nums; color:${empAdjs < 0 ? 'var(--danger)' : 'var(--text-primary)'};">${esc(php(empAdjs))}</td>
            <td style="text-align:right; font-variant-numeric:tabular-nums;">${esc(php(empGlAdd))}</td>
            <td style="text-align:right; font-variant-numeric:tabular-nums; color:${empGlDed > 0 ? 'var(--danger)' : 'var(--text-primary)'};">${esc(empGlDed > 0 ? `-${php(empGlDed)}` : php(0))}</td>
            <td style="border-right:2px solid var(--border);padding:0;"></td>
            ${specialCellsHtml}${payoutCellsHtml}
            <td style="text-align:right; font-variant-numeric:tabular-nums; font-weight:700;color:var(--text-primary);background:rgba(161,161,170,0.15);">${esc(php(grandTotal))}</td>
            <td style="text-align:center;">
              <button class="btn btn-outline btn-xs" onclick="App.shortcutSavePayslip('${emp.id}')" title="Save Payslip as PDF" style="padding:4px 8px;font-size:0.72rem;display:inline-flex;align-items:center;gap:4px;height:26px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PDF
              </button>
            </td>
          </tr>`;
        };

        // Render departments
        Object.keys(grouped).sort().forEach(dept => {
          bodyHtml += `<tr class="dept-header-row"><td colspan="${colspan}"><div class="dept-header-sticky">${esc(dept)} Department</div></td></tr>`;
          const teams = Object.keys(grouped[dept]).sort((a, b) => {
            if (a === 'Department Head') return -1;
            if (b === 'Department Head') return 1;
            return a.localeCompare(b);
          });
          teams.forEach(sub => {
            if (sub !== '_unassigned_subteam') {
              bodyHtml += `<tr class="team-header-row"><td colspan="${colspan}"><div class="team-header-sticky">${esc(sub)}</div></td></tr>`;
            }
            grouped[dept][sub].forEach(emp => { bodyHtml += renderEmpRow(emp); });
          });
        });

        if (unassigned.length > 0) {
          bodyHtml += `<tr class="dept-header-row"><td colspan="${colspan}">Unassigned Department / Pool</td></tr>`;
          unassigned.forEach(emp => { bodyHtml += renderEmpRow(emp); });
        }

        // Append Total Row if employees exist
        if (bodyHtml) {
          let specTotalsHtml = '';
          specialDays.forEach(day => {
            specTotalsHtml += `<td style="text-align:right; font-variant-numeric:tabular-nums; font-weight:700;color:var(--text-primary);">${esc(php(sumSpecialDays[day]))}</td>`;
          });
          let payoutTotalsHtml = '';
          sortedScheds.forEach(day => {
            payoutTotalsHtml += `<td style="text-align:right; font-variant-numeric:tabular-nums; font-weight:700;color:var(--text-primary);">${esc(php(sumPayoutDays[day]))}</td>`;
          });

          bodyHtml += `
            <tr class="total-row" style="background:var(--bg-base); font-weight:700; border-top: 2px solid var(--border);">
              <td class="col-name col-sticky-1" style="font-weight:700;">TOTAL</td>
              <td class="col-sticky-2"></td>
              <td class="col-sticky-3"></td>
              <td style="text-align:right; font-variant-numeric:tabular-nums;">${esc(php(sumBaseSalary))}</td>
              <td style="text-align:right; font-variant-numeric:tabular-nums;">${esc(php(sumComms))}</td>
              <td style="text-align:right; font-variant-numeric:tabular-nums;">${esc(php(sumInstPayouts))}</td>
              <td style="text-align:right; font-variant-numeric:tabular-nums; color:${sumAdjs < 0 ? 'var(--danger)' : 'var(--text-primary)'};">${esc(php(sumAdjs))}</td>
              <td style="text-align:right; font-variant-numeric:tabular-nums;">${esc(php(sumGlReimbs))}</td>
              <td style="text-align:right; font-variant-numeric:tabular-nums; color:${sumGlCashAdv > 0 ? 'var(--danger)' : 'var(--text-primary)'};">${esc(sumGlCashAdv > 0 ? `-${php(sumGlCashAdv)}` : php(0))}</td>
              <td style="border-right:2px solid var(--border);padding:0;"></td>
              ${specTotalsHtml}${payoutTotalsHtml}
              <td style="text-align:right; font-variant-numeric:tabular-nums; font-weight:700;color:var(--text-primary);background:rgba(161,161,170,0.15);">${esc(php(sumGrandTotal))}</td>
              <td></td>
            </tr>
          `;
        }

        tbody.innerHTML = bodyHtml || `<tr><td colspan="${colspan}" style="text-align:center;padding:3rem;color:var(--text-muted);">No employees found.</td></tr>`;
      },

      // ── Commission helpers ──
      _parseDoors(b) {
        if (!b) return [];
        if (Array.isArray(b.doors)) return b.doors;
        try { return JSON.parse(b.doors); } catch (_) { return []; }
      },

      _isCommissionEligibleBooking(b) {
        if (!b || String(b.status || '').toLowerCase() === 'cancelled') return false;
        const doors = this._parseDoors(b);
        const status = String(b.status || '').toLowerCase();
        return ['done', 'completed', 'finished'].includes(status)
          || (doors.length > 0 && doors.every(door => Boolean(door?.completed)));
      },

      _getStoredCommAmount(a) {
        return (Number(a?.amount) || 0) / 100;
      },

      _commissionForEmpMonth(empId, mk, throughDateInclusive = null) {
        const commissionScheds = [...(this.payoutSchedules.length ? this.payoutSchedules : [15, 30])].map(Number).sort((a, b) => a - b);
        return this.commissionAssignments.filter(a => {
          if (a.employee_id !== empId) return false;
          const b = this.bookingsList.find(x => x.id === a.booking_id);
          if (!this._isCommissionEligibleBooking(b)) return false;
          const installDate = b?.scheduled_date;
          if (!installDate) return false;
          if (throughDateInclusive && String(installDate).slice(0, 10) > throughDateInclusive) return false;
          return this.getCutoffBucket(installDate, commissionScheds)?.monthKey === mk;
        }).reduce((sum, assignment) => sum + this._getStoredCommAmount(assignment), 0);
      },

      _isGlReimbursementAccount(accountId) {
        const accountName = String(this.glAccountsMap?.[accountId] || '').toLowerCase();
        return accountName.includes('due to staff') || accountName.includes('due to owner');
      },

      _glReimbursementAmount(entry) {
        // Credits record the employee/owner expense. Debits settle the liability and
        // must not erase the reimbursement from the historical payout cutoff.
        return parseFloat(entry?.credit) || 0;
      },

      _glAdditionsForSchedule(empId, schedDay, mk, sortedScheds, rolloverOnly = null) {
        if (!this.generalJournalEntries || !this.accountAssignments) return 0;
        return this.generalJournalEntries.filter(r => {
          const assignedEmpId = this.accountAssignments[r.account_id];
          if (assignedEmpId !== empId) return false;
          if (!this._isGlReimbursementAccount(r.account_id)) return false;
          const bucket = this.getCutoffBucket(r.date, sortedScheds);
          if (bucket?.monthKey !== mk || bucket.day !== schedDay) return false;
          const isRollover = String(r.date || '').slice(0, 7) !== mk;
          return rolloverOnly === null || isRollover === rolloverOnly;
        }).reduce((sum, entry) => sum + this._glReimbursementAmount(entry), 0);
      },

      _glDeductionsForSchedule(empId, schedDay, mk, sortedScheds, rolloverOnly = null) {
        if (!this.generalJournalEntries || !this.accountAssignments) return 0;
        return this.generalJournalEntries.filter(r => {
          const assignedEmpId = this.accountAssignments[r.account_id];
          if (assignedEmpId !== empId) return false;
          const accName = (this.glAccountsMap?.[r.account_id] || '').toLowerCase();
          if (!accName.includes('due from staff')) return false;
          const bucket = this.getCutoffBucket(r.date, sortedScheds);
          if (bucket?.monthKey !== mk || bucket.day !== schedDay) return false;
          const isRollover = String(r.date || '').slice(0, 7) !== mk;
          return rolloverOnly === null || isRollover === rolloverOnly;
        }).reduce((s, r) => {
          const debit = parseFloat(r.debit) || 0;
          const credit = parseFloat(r.credit) || 0;
          return s + (debit - credit);
        }, 0);
      },

      _glAdditionsForEmpMonth(empId, mk) {
        if (!this.generalJournalEntries || !this.accountAssignments) return 0;
        return this.generalJournalEntries.filter(r => {
          const assignedEmpId = this.accountAssignments[r.account_id];
          if (assignedEmpId !== empId) return false;
          if (!this._isGlReimbursementAccount(r.account_id)) return false;
          return this.getCutoffBucket(r.date, this.payoutSchedules)?.monthKey === mk;
        }).reduce((sum, entry) => sum + this._glReimbursementAmount(entry), 0);
      },

      _glDeductionsForEmpMonth(empId, mk) {
        if (!this.generalJournalEntries || !this.accountAssignments) return 0;
        return this.generalJournalEntries.filter(r => {
          const assignedEmpId = this.accountAssignments[r.account_id];
          if (assignedEmpId !== empId) return false;
          const accName = (this.glAccountsMap?.[r.account_id] || '').toLowerCase();
          if (!accName.includes('due from staff')) return false;
          return this.getCutoffBucket(r.date, this.payoutSchedules)?.monthKey === mk;
        }).reduce((s, r) => {
          const debit = parseFloat(r.debit) || 0;
          const credit = parseFloat(r.credit) || 0;
          return s + (debit - credit);
        }, 0);
      },

      _adjsForSchedule(empId, schedDay, mk, sortedScheds, rolloverOnly = null) {
        return this.adjustmentsList.filter(a => {
          if (a.employeeId !== empId) return false;
          const bucket = this.getCutoffBucket(a.date, sortedScheds);
          if (bucket?.monthKey !== mk || bucket.day !== schedDay) return false;
          const isRollover = String(a.date || '').slice(0, 7) !== mk;
          return rolloverOnly === null || isRollover === rolloverOnly;
        }).reduce((s, a) => s + (Number(a.value) || 0), 0);
      },



      _commsForSchedule(empId, schedDay, mk, sortedScheds, _unusedProductMap = null, rolloverOnly = null, throughDateInclusive = null) {
        return this.commissionAssignments.filter(a => {
          if (a.employee_id !== empId) return false;
          const b = this.bookingsList.find(x => x.id === a.booking_id);
          if (!this._isCommissionEligibleBooking(b)) return false;
          const installDate = b?.scheduled_date;
          if (!installDate) return false;
          if (throughDateInclusive && String(installDate).slice(0, 10) > throughDateInclusive) return false;
          const bucket = this.getCutoffBucket(installDate, sortedScheds);
          if (bucket?.monthKey !== mk || bucket.day !== schedDay) return false;
          const isRollover = String(installDate).slice(0, 7) !== mk;
          return rolloverOnly === null || isRollover === rolloverOnly;
        }).reduce((sum, assignment) => sum + this._getStoredCommAmount(assignment), 0);
      },

      // ── Checkbox toggles ──
      togglePayoutCheck(empId, schedDay, checked) {
        const mk = this.monthKey();
        this.regularPayoutState[mk] = this.regularPayoutState[mk] || {};
        if (checked) {
          const values = this.getPayoutComponents(empId, schedDay, mk);
          const system = this.getSystemAdjustment(empId, mk, schedDay);
          this.regularPayoutState[mk][`${empId}_${schedDay}`] = window.BKPayoutSnapshots.createSnapshot({
            sourceValue: values.sourceValue,
            paidValue: values.displayedValue + system.value,
            systemSources: system.systemSources
          });
        } else {
          this.regularPayoutState[mk][`${empId}_${schedDay}`] = false;
        }
        this.payoutSystemCache.clear();
        this.render();
        this.debouncedSave();
        this.syncPayslipRecord(empId);
      },

      toggleSpecialPayoutCheck(empId, day, checked) {
