<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Directions — Brightkey Portal</title>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=commissioner:400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/dashboard/business/directions/planning.css?v=1" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2" />
</head>
<body>
  <div id="toast-container"></div>

  <div class="dash-layout">
    <aside class="dash-sidebar" id="dash-sidebar"></aside>

    <div class="dash-main">
      <div class="top-bar">
        <span class="top-bar-title">Directions</span>
      </div>

      <div class="drawer-tabs" aria-label="Directions sections">
        <a class="tab-btn active" href="/dashboard/business/directions/planning" aria-current="page">Planning</a>
      </div>

      <div class="content-area">
        <main class="main-panel planning-panel">
          <div class="planning-heading">
            <div>
              <h1>Planning</h1>
              <p>Organize the company’s important directions and priorities.</p>
            </div>
            <button class="btn btn-primary btn-sm" type="button" onclick="Planning.openDirectionModal()">Add Direction</button>
          </div>

          <div class="planning-grid">
            <section class="section-card">
              <div class="section-header planning-bucket planning-bucket-danger">
                <div class="section-title">Urgent and Important</div>
              </div>
              <div class="direction-list" id="planning-urgent-important-list">
                <div class="loading-wrapper"><span class="spinner-cyan"></span><span>Loading directions…</span></div>
              </div>
            </section>

            <section class="section-card">
              <div class="section-header planning-bucket planning-bucket-warning">
                <div class="section-title">Not Urgent but Important</div>
              </div>
              <div class="direction-list" id="planning-not-urgent-important-list">
                <div class="loading-wrapper"><span class="spinner-cyan"></span><span>Loading directions…</span></div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="direction-modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="direction-modal-title">Add New Direction</div>
        <button class="modal-close" type="button" onclick="Planning.closeDirectionModal()" aria-label="Close direction form">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form onsubmit="Planning.saveDirection(event)">
        <input type="hidden" id="direction-modal-id" />
        <div class="modal-body direction-form">
          <div class="form-group">
            <label class="form-label" for="direction-modal-title-input">Title <span class="required">*</span></label>
            <input type="text" id="direction-modal-title-input" class="form-input" placeholder="e.g. Expand to Cebu Market" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="direction-modal-desc-input">Description</label>
            <textarea id="direction-modal-desc-input" class="form-textarea" maxlength="500" placeholder="Details and broad goals..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label" for="direction-modal-date-input">Target Date</label>
            <input type="date" id="direction-modal-date-input" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label" for="direction-modal-bucket-input">Priority <span class="required">*</span></label>
            <select id="direction-modal-bucket-input" class="form-select" required>
              <option value="urgent_important">Urgent and Important</option>
              <option value="not_urgent_important">Not Urgent but Important</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="direction-modal-parent-input">Parent Direction</label>
            <select id="direction-modal-parent-input" class="form-select">
              <option value="">None — Main Direction</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="Planning.closeDirectionModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-direction">Save Direction</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/main.js"></script>
  <script src="/dashboard/business/directions/planning.js?v=1"></script>
</body>
</html>
