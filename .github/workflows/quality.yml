name: Pull Request Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run preflight tests
        run: npm run preflight

  deploy-supabase:
    name: Deploy Supabase migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_DEPLOY_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.101.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show migration history
        run: supabase migration list

      # One-time ledger reconciliation. The production schema already contains
      # these authoritative repository migrations under older generated version
      # numbers; this changes migration history only, not schema objects or data.
      - name: Reconcile historical migration versions
        run: |
          supabase migration repair --status reverted \
            20260325030724 20260325120736 20260518211035 \
            20260817062253 20260820232038 20260820233034 \
            20260821002015 20260821060010 20260821070515 \
            20260829030152 20260831125045 20260831125517 \
            20260901020144 20260901132340 20260902004042 \
            20260902133749 20260903034150 20260903051340 \
            20260903051927 20260903052145 20260903160638 \
            20260907012103 20260907075521
          supabase migration repair --status applied \
            20260903030410 20260903050000 20260903051000 \
            20260903052000 20260903160318 20260904060000 \
            20260905072206 20260905090000 20260907093000
          supabase migration list

      - name: Apply pending migrations
        run: supabase db push

      - name: Verify migration history
        run: supabase migration list
